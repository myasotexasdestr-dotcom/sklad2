  }
  // Створювати, редагувати й видаляти рецепти може тільки власник; заготівельник лише готує за ними.
  if(isOwner()){
    const addBtn = el(`<button class="w-full btn-line py-3 mb-4">+ Додати рецепт</button>`);
    addBtn.onclick = ()=>{ editingIngredientId=null; view='ingredientAdd'; render(); };
    wrap.appendChild(addBtn);
  }

  const visible = availableRecipes();
  if(visible.length===0){
    wrap.appendChild(el(`<div class="sub text-center py-10">Поки немає рецептів</div>`));
    return wrap;
  }
  const showCost = canSeeCost();
  const manage = isOwner();
  const canPrep = canProduce();
  visible.slice().sort((a,b)=>a.name.localeCompare(b.name,'uk')).forEach(ing=>{
    const cost = ingredientCostPerUnit(ing);
    const qty = curIngredientQty(ing);
    const compLabel = '';
    const scopeLabel = ing.warehouseId ? ' · тільки '+escapeHtml(curWhName) : '';
    const costLine = showCost ? `<div class="sub text-xs">${fmtMoneyPrecise(cost)} / ${escapeHtml(ing.unit)}${compLabel?' · '+compLabel:''}${scopeLabel}</div>` : (compLabel ? `<div class="sub text-xs">${compLabel}${scopeLabel}</div>` : '');
    const row = el(`
      <div class="card p-3 mb-2 flex items-center justify-between" style="${manage?'cursor:pointer':''}">
        <div>
          <div class="font-semibold">${escapeHtml(ing.name)}</div>
          <div class="sub text-xs">Наявно: ${fmt(qty)} ${escapeHtml(ing.unit)}</div>
          ${costLine}
        </div>
        ${(canPrep || manage) ? `<div class="flex items-center gap-2">
          ${canPrep ? `<button data-prep class="btn-line" style="padding:6px 12px;font-size:.8rem">Приготувати</button>` : ''}
          ${manage ? `<button data-del style="background:none;border:none;color:var(--danger);font-size:1.3rem;padding:0 4px;cursor:pointer">&times;</button>` : ''}
        </div>` : ''}
      </div>
    `);
    const prepBtn = row.querySelector('[data-prep]');
    if(prepBtn) prepBtn.onclick = (e)=>{ e.stopPropagation(); openPrepare(ing.id, 'ingredients'); };
    if(!manage){ wrap.appendChild(row); return; }
    row.addEventListener('click', (e)=>{
      if(e.target.closest('[data-del]') || e.target.closest('[data-prep]')) return;
      editingIngredientId = ing.id;
      view = 'ingredientAdd';
      render();
    });
    row.querySelector('[data-del]').onclick = (e)=>{ e.stopPropagation(); appConfirm('Видалити "'+ing.name+'"?', ()=> deleteRecipeIngredient(ing.id)); };
    wrap.appendChild(row);
  });
  return wrap;
}

// Екран «Приготувати заготовку»: рецепт (інгредієнт) задає, з яких продуктів він робиться; тут вказуємо
// скільки готового вийшло і скільки чого реально взято — продукти списуються зі складу, готове додається.
function ingredientPrepareView(){
  const ing = state.recipeIngredients.find(i=>i.id===preparingIngredientId);
  const wrap = el(`<div></div>`);
  const back = ()=>{ preparingIngredientId=null; view=prepareReturnTo||'ingredients'; render(); };
  const topBar = el(`
    <div class="flex items-center gap-3 mb-4">
      <button id="ppBack" class="navicon-btn" style="background:var(--card3)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="font-bold" style="font-size:1.1rem">${ing?'Заготовка: '+escapeHtml(ing.name):'Нова заготовка'}</div>
    </div>
  `);
  topBar.querySelector('#ppBack').onclick = back;
  wrap.appendChild(topBar);
  if(!ing){
    // Крок 1: вибір рецепта. Рецепт = інгредієнт зі складом з продуктів («Рецепти» в налаштуваннях).
    const recipes = availableRecipes().sort((a,b)=>a.name.localeCompare(b.name,'uk'));
    if(recipes.length===0){
      wrap.appendChild(el(`<div class="sub text-center py-8">Ще немає рецептів. Створіть рецепт у розділі «Рецепти» — вкажіть, з яких продуктів він складається.</div>`));
      const goBtn = el(`<button class="w-full btn-line py-3">Перейти до рецептів</button>`);
      goBtn.onclick = ()=>{ view='ingredients'; render(); };
      wrap.appendChild(goBtn);
      return wrap;
    }
    wrap.appendChild(el(`<div class="sub text-xs mb-2">Оберіть рецепт — підтягнуться продукти, які потрібні для нього.</div>`));
    const sel = customSelect(recipes.map(r=>({value:r.id, label:r.name+' ('+r.unit+')'})), null, null);
    const selHost = el(`<div class="mb-4"></div>`);
    selHost.appendChild(sel);
    wrap.appendChild(selHost);
    const nextBtn = el(`<button class="w-full btn-solid py-3">Далі</button>`);
    nextBtn.onclick = ()=>{ preparingIngredientId = sel.getValue(); render(); };
    wrap.appendChild(nextBtn);
    return wrap;
  }

  const whId = state.currentWarehouse;
  const whName = (state.warehouses.find(w=>w.id===whId)||{}).name || '';
  const baseYield = Number(ing.yieldAmount)||1;
  wrap.appendChild(el(`<div class="sub text-xs mb-4">Склад: «${escapeHtml(whName)}». Продукти спишуться з цього складу, готове «${escapeHtml(ing.name)}» додасться до наявного. Кількості підставлено за рецептом (на ${fmt(baseYield)} ${escapeHtml(ing.unit)}) — змініть, якщо взяли інакше.</div>`));

  const outWrap = el(`
    <div class="mb-4">
      <div class="sub text-xs mb-1.5">Скільки вийшло готового (${escapeHtml(ing.unit)})</div>
      <input id="ppOut" type="text" inputmode="decimal" class="w-full py-3 px-3" style="border-radius:14px;background:var(--card3);color:var(--text);border:none">
    </div>
  `);
  const outInput = outWrap.querySelector('input');
  outInput.value = String(baseYield);
  wrap.appendChild(outWrap);

  wrap.appendChild(el(`<div class="font-semibold text-sm mb-2">Скільки чого взято</div>`));
  const parse = (s)=> parseFloat(String(s||'').replace(',','.'))||0;
  const rows = (ing.components||[]).map(c=>{
    const stockRow = stockRowByName(c.productName, whId);
    const have = stockRow ? stockRow.qty : 0;
    const r = el(`
      <div class="card p-3 mb-2">
        <div class="flex items-center justify-between gap-3">
          <div>
            <div class="font-medium text-sm">${escapeHtml(c.productName)}</div>
            <div class="sub text-xs" data-have>На складі: ${fmt(have)} ${escapeHtml(c.unit)}</div>
          </div>
          <div class="flex items-center gap-2">
            <input type="text" inputmode="decimal" style="width:90px;border-radius:10px;background:var(--card3);color:var(--text);border:none;padding:8px 10px;text-align:right">
            <span class="sub text-xs">${escapeHtml(c.unit)}</span>
          </div>
        </div>
      </div>
    `);
    const input = r.querySelector('input');
    input.value = String(c.amount);
    const state_ = { c, input, touched:false, haveEl:r.querySelector('[data-have]'), have };
    input.addEventListener('input', ()=>{ state_.touched = true; refresh(); });
    wrap.appendChild(r);
    return state_;
  });

  const costBox = el(`<div class="sub text-xs mb-4" data-cost></div>`);
  wrap.appendChild(costBox);

  function refresh(){
    rows.forEach(r=>{
      const amt = parse(r.input.value);
      const lack = amt > r.have + 1e-9;
      r.haveEl.style.color = lack ? 'var(--danger)' : '';
      r.haveEl.textContent = 'На складі: '+fmt(r.have)+' '+r.c.unit+(lack?(allowNegativeStock()?' — піде в мінус':' — не вистачає'):'');
    });
    if(canSeeCost()){
      const total = rows.reduce((s,r)=>{ const row=stockRowByName(r.c.productName, whId); return s + parse(r.input.value)*(row?(row.costPerUnit||0):0); }, 0);
      const out = parse(outInput.value);
      costBox.textContent = 'Собівартість партії: '+fmtMoneyPrecise(total)+(out>0?' · '+fmtMoneyPrecise(total/out)+' / '+ing.unit:'');
    }
  }
  // Поки користувач не чіпав кількості — масштабуємо їх пропорційно до виходу.
  outInput.addEventListener('input', ()=>{
    const out = parse(outInput.value);
    if(out>0){
      rows.forEach(r=>{ if(!r.touched) r.input.value = String(Number((r.c.amount*out/baseYield).toFixed(3))); });
    }
    refresh();
  });
  refresh();

  const saveBtn = el(`<button class="w-full btn-solid py-3">Приготувати</button>`);
  saveBtn.onclick = ()=>{
    const used = rows.map(r=>({ productName:r.c.productName, unit:r.c.unit, amount:parse(r.input.value) }));
    const res = recordPreparation(ing, parse(outInput.value), used, whId);
    if(!res.ok){ appAlert(res.error); return; }
    saveState();
    preparingIngredientId = null; view = prepareReturnTo || 'ingredients';
    render();
  };
  wrap.appendChild(saveBtn);

  // Останні заготовки цього інгредієнта на цьому складі.
  const recent = (state.preparations||[]).filter(p=>p.ingredientId===ing.id && p.warehouseId===whId).slice(0,5);
  if(recent.length){
    wrap.appendChild(el(`<div class="font-semibold text-sm mt-6 mb-2">Останні заготовки</div>`));
    recent.forEach(p=>{
      wrap.appendChild(el(`
        <div class="card p-3 mb-2">
          <div class="text-sm font-medium">+${fmt(p.outQty)} ${escapeHtml(p.unit)} · <span class="sub">${escapeHtml(p.ts)} · ${escapeHtml(p.who)}</span></div>
          <div class="sub text-xs">${(p.used||[]).map(u=>escapeHtml(u.productName)+' '+fmt(u.amount)+' '+escapeHtml(u.unit)).join(', ')}</div>
        </div>
      `));
    });
  }
  return wrap;
}

function stockTabView(){
  const wrap = el(`<div></div>`);
  const switcher = el(`<div class="flex mb-4 p-1" style="background:var(--card2);border-radius:18px;overflow-x:auto"></div>`);
  const b1 = tabBarItem('stock', 'Залишки', stockSubview==='stock', ()=>{ stockSubview='stock'; render(); });
  const b2 = tabBarItem('history', 'Історія', stockSubview==='history', ()=>{ stockSubview='history'; render(); });
  const b3 = tabBarItem('inventory', 'Інвентаризація', stockSubview==='inventory', ()=>{ stockSubview='inventory'; render(); });
  const b4 = tabBarItem('trash', 'Списання', stockSubview==='writeoffs', ()=>{ stockSubview='writeoffs'; render(); });
  const inProcessCount = state.productions.filter(pr=>pr.status==='in_process' && pr.warehouseId===state.currentWarehouse).length;
  const b5 = tabBarItem('flame', 'Виробництво'+(inProcessCount?' ('+inProcessCount+')':''), stockSubview==='production', ()=>{ stockSubview='production'; render(); });
  switcher.appendChild(b1); switcher.appendChild(b2); switcher.appendChild(b3); switcher.appendChild(b4); switcher.appendChild(b5);
  wrap.appendChild(switcher);
  const tabOrder = ['stock','history','inventory','writeoffs','production'];
  const activeTabBtn = [b1,b2,b3,b4,b5][tabOrder.indexOf(stockSubview)];
  if(activeTabBtn) setTimeout(()=> activeTabBtn.scrollIntoView({inline:'center', block:'nearest'}), 0);

  const whRow = el(`<div class="flex items-center gap-2 mb-3"></div>`);
  const selWrap = el(`<div style="flex:1"></div>`);
  const sel = customSelect(
    state.warehouses.map(w=>({value:w.id, label:w.name})),
    state.currentWarehouse,
    (val)=>{ state.currentWarehouse = val; saveState(); render(); }
  );
  selWrap.appendChild(sel);
  whRow.appendChild(selWrap);
  const whGear = el(`<button class="navicon-btn" style="background:var(--card3);width:38px;height:38px">${ICONS.settings}</button>`);
  const whGearSvg = whGear.querySelector('svg');
  whGearSvg.style.width = '15px'; whGearSvg.style.height = '15px'; whGearSvg.style.stroke = 'var(--sub)';
  whGear.onclick = ()=> openWarehouseEdit(state.currentWarehouse);
  whRow.appendChild(whGear);
  wrap.appendChild(whRow);

  // Кнопку «Додати склад» прибрано з цього екрана за запитом власника.
  // «Нова готовка» перенесена в Налаштування, «Нова поставка»/«Поставки» — в Закупівлі.

  if(stockSubview==='stock'){
    const catRow = segmentedPicker(
      [['all','Усі'],['meat',"М'ясо з Техасу"],['fastfood','Фастфуд']],
      stockCategoryFilter,
      (key)=>{ stockCategoryFilter = key; render(); }
    );
    wrap.appendChild(catRow);
  }

  if(stockSubview==='stock') wrap.appendChild(stockView());
  else if(stockSubview==='history') wrap.appendChild(historyView());
  else if(stockSubview==='production') wrap.appendChild(productionListContent());
  else if(stockSubview==='writeoffs') wrap.appendChild(writeOffListView());
  else wrap.appendChild(inventoryListView());
  return wrap;
}

function stockView(){
  const wrap = el(`<div></div>`);
  const manage = canManageProducts();

  if(!isOwner()){
    // Non-owner roles never see the warehouse switcher — the app already locked them to the
    // right склад at login (База for Кухар/Заготівельник, their own точка for Касир).
    const whName = (state.warehouses.find(w=>w.id===state.currentWarehouse)||{}).name || '';

    const u0 = curUser();
    if(u0 && u0.role==='cashier'){
      // Зарплата за поточний звітний період — одразу під привітанням і місцем роботи (шапка з ними
      // рендериться окремо, перед цим екраном). Показуємо ЗАВЖДИ, навіть якщо ще жодного дня не
      // відпрацьовано — тоді 0.
      const myPeriodKeyForSalary = periodKeyForDateKey(localDateKey(new Date()));
      wrap.appendChild(el(`<div class="sec-head"><div class="sec-title">Швидкі дії</div></div>`));
      const cqa = el(`<div class="qa-row"></div>`);
      [['truck','Glovo',()=>{ glovoTab='sales'; view='glovo'; render(); }],
       ['purchase','Закупівля',()=> startPurchaseFlow()],
       ['calendar','Графік',()=>{ view='scheduleCalendar'; render(); }],
       ['transfer','Запит',()=>{ view='cashierRequest'; render(); }]].forEach(([ic,label,fn])=>{
        const b = el(`<button class="qa"><span class="qa-c">${ICONS[ic]}</span><span>${label}</span></button>`);
        b.onclick = fn; cqa.appendChild(b);
      });
      wrap.appendChild(cqa);
      const salary = cashierSalaryForPeriod(u0.id, myPeriodKeyForSalary);
      wrap.appendChild(el(`
        <div class="card p-4 mb-4 text-center">
          <div class="sub text-xs mb-1">Зарплата за період ${escapeHtml(periodLabel(myPeriodKeyForSalary))}</div>
          <div class="font-bold" style="font-size:1.9rem;color:var(--accent2)">${fmtMoney(salary.total)}</div>
          <div class="sub text-xs mt-1">База ${fmtMoney(salary.basePay)} (${salary.daysWorked} зм.) · М'ясо ${fmtMoney(salary.meatBonus)} (${salary.meatPortions} порц.) · Фастфуд ${fmtMoney(salary.fastfoodBonus)}</div>
        </div>
      `));

      // Каса точки за сьогодні — лише якщо касир сьогодні на зміні (isScheduledToday); якщо ні, її
      // все одно не видно (як і решту функціоналу продажів на цю точку).
      if(isScheduledToday()){
        const cash = locationCashRegisterToday(state.activeLocationId);
        wrap.appendChild(el(`
          <div class="card p-3 mb-4">
            <div class="sub text-xs mb-1">Каса точки за сьогодні</div>
            <div class="font-bold" style="font-size:1.4rem">${fmtMoney(cash.total)}</div>
            <div class="sub text-xs mt-1">М'ясо ${fmtMoney(cash.meatTotal)} · Фастфуд ${fmtMoney(cash.fastfoodTotal)} · ${cash.ordersCount} замовлень</div>
          </div>
        `));
      }

      // Зміна більше не відкривається/закривається вручну — хто сьогодні на точці, визначає лише
      // Графік змін (isScheduledToday гейтить доступ окремо). Цей банер з'являється ЛИШЕ коли за
      // графіком на точку сьогодні виходить ІНША людина, ніж та, що працювала там попереднього
      // робочого дня, — перш ніж продовжити, треба оцінити 5 пунктів роботи попередника.
      const pendingHandover = pendingScheduleHandover(state.activeLocationId);
      if(pendingHandover){
        const priorStaff = state.staff.find(s=>s.id===pendingHandover.staffId);
        const handoverBanner = el(`
          <div class="card p-3 mb-3" style="cursor:pointer;background:rgba(232,163,23,.14);border:1px solid rgba(232,163,23,.35)">
            <div class="font-semibold text-sm">🟡 Прийняти зміну</div>
            <div class="sub text-xs mt-0.5">Оцініть, як точку залишив(ла) ${escapeHtml(priorStaff?priorStaff.name:'-')}</div>
          </div>
        `);
        handoverBanner.onclick = ()=>{ view='shiftAccept'; render(); };
        wrap.appendChild(handoverBanner);
      }

      const myPeriodKey = periodKeyForDateKey(localDateKey(new Date()));
      const myRatingNow = staffRatingForPeriod(u0.id, myPeriodKey);
      const ratingCard = el(`
        <div class="card p-3 mb-4 flex items-center justify-between" style="cursor:pointer">
          <div>
            <div class="font-semibold text-sm">⭐ Мій рейтинг</div>
            <div class="sub text-xs mt-0.5">Множник бонусу за поточний період</div>
          </div>
          <div class="font-bold" style="font-size:1.2rem; color:${myRatingNow ? 'var(--accent2)' : 'var(--sub)'}">${myRatingNow ? myRatingNow.avg.toFixed(1) : '—'}</div>
        </div>
      `);
      ratingCard.onclick = ()=>{ view='myRating'; render(); };
      wrap.appendChild(ratingCard);

      // «+ Закупівля», «Графік змін» і «Запросити поставку» тепер живуть на власних вкладках
      // нижнього меню («Закупка», «Графік змін», «Запросити поставку»), а не тут кнопками.
    }

    wrap.appendChild(el(`<div class="sub text-xs mb-3">Склад: ${escapeHtml(whName)}</div>`));

    // Задачі бачать всі ролі, що проходять через цей екран (кухар і касир) — так само, як і
    // заготівельник на своєму дашборді.
    if(u0) renderTasksSection(wrap, u0.id);

    // Кухар отримує максимально спрощений екран — тільки перелік продуктів (готовка живе на своїй
    // окремій вкладці внизу), без поставок/трансферів, які його ролі не стосуються.
    if(!(u0 && u0.role==='cook')){
      const pending = pendingTransfersFor(state.currentWarehouse);
      if(pending.length>0){
        const banner = el(`
          <div class="card p-3 mb-3" style="background:rgba(232,163,23,.14);border:1px solid rgba(232,163,23,.35);cursor:pointer">
            <div class="font-semibold text-sm">⚠ Нова поставка: ${pending.length} шт. очікує прийому</div>
            <div class="sub text-xs mt-0.5">Перевірте фактичну кількість і підтвердіть прийом</div>
          </div>
        `);
        banner.onclick = ()=>{ view='transferList'; render(); };
        wrap.appendChild(banner);
      }

      if(canProduce() || canTransfer() || pending.length>0){
        const actRow = el(`<div class="flex items-center gap-4 mb-4" style="flex-wrap:wrap"></div>`);
        const u = curUser();
        if(canProduce()){
          const prodBtn = el(`<button class="text-sm font-semibold" style="color:var(--accent)">+ ${u && u.role==='prep' ? 'Нова заготовка' : 'Нова готовка'}</button>`);
          prodBtn.onclick = ()=>{ view='productionStart'; render(); };
          actRow.appendChild(prodBtn);
        }
        if(canTransfer() && state.warehouses.length>1){
          const transferBtn = el(`<button class="text-sm font-semibold" style="color:var(--accent)">⇄ Нова поставка</button>`);
          // Заготівельник спочатку обирає точку (бачить, чого там бракує), і вже звідти переходить
          // до самої форми поставки — власник (тут цієї кнопки й не буває) поза цим сценарієм.
          transferBtn.onclick = ()=>{ view = 'prepTransferLocations'; render(); };
          actRow.appendChild(transferBtn);
          const ingBtn = el(`<button class="text-sm font-semibold" style="color:var(--accent)">Рецепти</button>`);
          ingBtn.onclick = ()=>{ view='ingredients'; render(); };
          actRow.appendChild(ingBtn);
        }
        if(canTransfer() || pending.length>0){
          const listBtn = el(`<button class="text-sm font-semibold" style="color:var(--accent)">Поставки</button>`);
          listBtn.onclick = ()=>{ view='transferList'; render(); };
          actRow.appendChild(listBtn);
        }
        wrap.appendChild(actRow);
      }
    }
  }

  if(manage){
    const addBtn = el(`<button class="w-full btn-line py-3 mb-4">+ Додати продукт</button>`);
    addBtn.onclick = ()=>{ editingStockItemId=null; view='stockItemAdd'; render(); };
    wrap.appendChild(addBtn);
  }

  // Перелік товарів на точці — теж лише в дні, коли касира призначено на зміну (isScheduledToday()
  // для будь-якої іншої ролі завжди true, тож на кухаря/заготівельника/власника це не впливає).
  if(!isScheduledToday()){
    wrap.appendChild(el(`<div class="sub text-sm py-10 text-center">Сьогодні ви не призначені на зміну — перелік товарів недоступний.</div>`));
    return wrap;
  }

  const list = curStockItemsCat();
  if(list.length===0){
    wrap.appendChild(el(`<div class="sub text-center py-10">Поки немає продуктів на цій точці</div>`));
    return wrap;
  }
  list.slice().sort((a,b)=>a.name.localeCompare(b.name,'uk')).forEach(item=>{
    const isLow = item.qty <= item.min;
    const costLine = canSeeCost() ? `<div class="sub text-xs mt-0.5">${fmtMoneyPrecise(item.costPerUnit||0)} / ${escapeHtml(item.unit)} · мін ${fmt(item.min)} ${escapeHtml(item.unit)}</div>` : `<div class="sub text-xs mt-0.5">мін ${fmt(item.min)} ${escapeHtml(item.unit)}</div>`;
    const row = el(`
      <div class="card p-3 mb-2 flex items-center justify-between" style="${manage?'cursor:pointer':''}">
        <div>
          <div class="font-semibold">${escapeHtml(item.name)}</div>
          <div class="text-sm ${isLow?'low font-semibold':'sub'}">${fmt(item.qty)} ${escapeHtml(item.unit)} ${isLow?'· мало!':''}</div>
          ${costLine}
        </div>
        ${manage ? `<button data-del style="background:none;border:none;color:var(--danger);font-size:1.3rem;padding:0 4px;cursor:pointer">&times;</button>` : ''}
      </div>
    `);
    if(manage){
      row.addEventListener('click', (e)=>{
        if(e.target.closest('[data-del]')) return;
        editingStockItemId = item.id;
        view = 'stockItemAdd';
        render();
      });
      row.querySelector('[data-del]').onclick = (e)=>{ e.stopPropagation(); appConfirm('Видалити "'+item.name+'"?', ()=> deleteStockItem(item.id)); };
    }
    wrap.appendChild(row);
  });
  return wrap;
}

function stockItemAddView(){
  // Dual add/edit page: if editingStockItemId is set, this edits that product in place.
  const editing = editingStockItemId ? state.stockItems.find(i=>i.id===editingStockItemId) : null;
  const wrap = el(`<div></div>`);
  const topBar = el(`
    <div class="flex items-center gap-3 mb-5">
      <button id="siBack" class="navicon-btn" style="background:var(--card3)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="font-bold" style="font-size:1.1rem">${editing?'Редагування продукту':'Новий продукт'}</div>
    </div>
  `);
  topBar.querySelector('#siBack').onclick = ()=>{ editingStockItemId=null; view='stock'; render(); };
  wrap.appendChild(topBar);

  function field(label, placeholder){
    const f = el(`
      <div class="mb-4">
        <div class="sub text-xs mb-1.5">${escapeHtml(label)}</div>
        <input type="text" class="w-full py-3 px-3" style="border-radius:14px;background:var(--card3);color:var(--text);border:none" placeholder="${escapeHtml(placeholder||'')}">
      </div>
    `);
    return f;
  }

  const nameField = field('Назва продукту', 'Наприклад, Майонез');
  const nameInput = nameField.querySelector('input');
  if(editing) nameInput.value = editing.name;
  wrap.appendChild(nameField);

  wrap.appendChild(el(`<div class="sub text-xs mb-1.5">Категорія</div>`));
  let draftCategory = editing ? (editing.category||'meat') : 'meat';
  const catRow = segmentedPicker(
    [['meat',"М'ясо з Техасу",'🥩'],['fastfood','Фастфуд','🌯']],
    draftCategory,
    (key)=>{ draftCategory = key; }
  );
  wrap.appendChild(catRow);

  wrap.appendChild(el(`<div class="sub text-xs mb-1.5">Одиниця виміру</div>`));
  let draftUnit = editing ? editing.unit : 'кг';
  const unitRow = segmentedPicker(
    [['кг','Кг','⚖️'],['л','Літри','💧'],['шт','Штуки','#️⃣']],
    draftUnit,
    (key)=>{ draftUnit = key; }
  );
  wrap.appendChild(unitRow);

  const qtyField = field(editing ? 'Поточний залишок' : 'Початковий залишок', '0');
  const qtyInput = qtyField.querySelector('input');
  qtyInput.setAttribute('inputmode','decimal');
  if(editing) qtyInput.value = fmt(editing.qty);
  wrap.appendChild(qtyField);

  // Мінімальний залишок — окремо для кожного складу (напр. Лаваш: База 50, ЦУМ 15). З одним складом
  // це звичайне поле, з кількома — рядок на кожен склад, де цей продукт є (або буде створений).
  const multiWh = state.warehouses.length>1;
  const parseNum = (s)=> parseFloat(String(s||'').replace(',','.')) || 0;
  const siblingRows = editing ? stockRowsForProduct(editing.name) : [];
  let availEverywhere = true;
  const minField = field('Мінімальний залишок (попередження)', '0');
  const minInput = minField.querySelector('input');
  minInput.setAttribute('inputmode','decimal');
  if(editing) minInput.value = fmt(editing.min);
  const minBox = el(`<div class="mb-4"></div>`);
  const draftMins = {};   // key -> введений текст (зберігається, коли перемикаємо «Усі склади / Тільки …»)
  const minInputs = {};   // key -> <input>; key = id рядка stockItems (редагування) або id складу (новий продукт)
  function renderMinBox(){
    minBox.innerHTML = '';
    Object.keys(minInputs).forEach(k=>{ delete minInputs[k]; });
    const targets = [];
    if(editing){
      state.warehouses.forEach(w=>{
        const r = siblingRows.find(x=>x.warehouseId===w.id);
        if(r) targets.push({ key: r.id, label: w.name, initial: fmt(r.min) });
      });
    } else if(availEverywhere){
      state.warehouses.forEach(w=> targets.push({ key: w.id, label: w.name, initial: '' }));
    } else {
      const w = state.warehouses.find(x=>x.id===state.currentWarehouse);
      targets.push({ key: state.currentWarehouse, label: w ? w.name : '', initial: '' });
    }
    minBox.appendChild(el(`<div class="sub text-xs mb-1.5">Мінімальний залишок (попередження) — окремо для кожного складу</div>`));
    targets.forEach(t=>{
      const row = el(`
        <div class="flex items-center gap-3 mb-2">
          <div class="flex-1 text-sm font-semibold">${escapeHtml(t.label)}</div>
          <input type="text" inputmode="decimal" class="py-3 px-3" style="width:110px;border-radius:14px;background:var(--card3);color:var(--text);border:none;text-align:right" placeholder="0">
        </div>
      `);
      const inp = row.querySelector('input');
      inp.value = (t.key in draftMins) ? draftMins[t.key] : t.initial;
      inp.oninput = ()=>{ draftMins[t.key] = inp.value; };
      minInputs[t.key] = inp;
      minBox.appendChild(row);
    });
  }
  if(multiWh){ renderMinBox(); wrap.appendChild(minBox); }
  else wrap.appendChild(minField);

  const costField = field('Закупівельна ціна за одиницю, ' + String.fromCharCode(8372), '0');
  const costInput = costField.querySelector('input');
  costInput.setAttribute('inputmode','decimal');
  if(editing) costInput.value = fmt(editing.costPerUnit);
  wrap.appendChild(costField);

  // New products default to every warehouse; can instead be restricted to the one you're on right now.
  // (availEverywhere оголошено вище, разом із блоком мінімальних залишків — той залежить від цього вибору)
  if(!editing && state.warehouses.length>1){
    const curWhName = (state.warehouses.find(w=>w.id===state.currentWarehouse)||{}).name || '';
    wrap.appendChild(el(`<div class="sub text-xs mb-1.5">Доступність продукту</div>`));
    const availRow = segmentedPicker(
      [['all','Усі склади'],['one','Тільки '+curWhName]],
      availEverywhere ? 'all' : 'one',
      (key)=>{ availEverywhere = key==='all'; renderMinBox(); }
    );
    wrap.appendChild(availRow);
    wrap.appendChild(el(`<div class="sub text-xs mb-4">На «Усіх складах» початковий залишок буде застосовано лише тут, інші почнуть з 0 — далі кожен склад веде свій облік окремо.</div>`));
  }

  // Готові до відвантаження товари (соус у банці тощо) — продукт і інгредієнт це те саме фізично,
  // тож за замовчуванням одразу створюємо й пов'язаний інгредієнт з тим самим залишком, щоб «Поставка»
  // одразу мала що відвантажувати. Для того, що готується з кількох продуктів — це вимикається,
  // і інгредієнт створюється окремо вручну в розділі «Інгредієнти».
  let createIngredientToo = true;
  const ciToggle = el(`<button type="button" style="width:46px;height:26px;border-radius:999px;border:none;position:relative;background:var(--accent);flex-shrink:0;transition:background .15s"><span style="position:absolute;top:3px;left:23px;width:20px;height:20px;border-radius:999px;background:#fff;transition:left .15s"></span></button>`);
  const ciKnob = ciToggle.querySelector('span');
  if(!editing){
    const ciRow = el(`
      <div class="card p-3 mb-4 flex items-center justify-between gap-3">
        <div>
          <div class="font-semibold text-sm">Створити інгредієнт</div>
          <div class="sub text-xs">Продукт готовий до відвантаження як є — одразу з'явиться інгредієнт з таким самим залишком, готовий для «Поставки»</div>
        </div>
      </div>
    `);
    ciRow.appendChild(ciToggle);
    ciToggle.onclick = ()=>{
      createIngredientToo = !createIngredientToo;
      ciToggle.style.background = createIngredientToo ? 'var(--accent)' : 'var(--card3)';
      ciKnob.style.left = createIngredientToo ? '23px' : '3px';
    };
    wrap.appendChild(ciRow);
  }

  const err = el(`<div class="text-sm mb-3" style="color:var(--danger);min-height:1.2em"></div>`);
  wrap.appendChild(err);

  const saveBtn = el(`<button class="w-full btn-solid py-3 ${editing?'mb-3':''}">Зберегти</button>`);
  saveBtn.onclick = ()=>{
    const name = nameInput.value.trim();
    if(!name){ err.textContent = 'Введіть назву продукту'; return; }
    const qty = parseFloat((qtyInput.value||'').replace(',','.')) || 0;
    let min = parseNum(minInput.value);
    const otherMins = {};
    if(multiWh){
      if(editing){
        // свій рядок — через updateStockItem; мінімуми на інших складах цього ж продукту — окремо
        min = parseNum(minInputs[editing.id] && minInputs[editing.id].value);
        siblingRows.forEach(r=>{ if(r.id!==editing.id && minInputs[r.id]) otherMins[r.id] = parseNum(minInputs[r.id].value); });
      } else {
        min = {};
        Object.keys(minInputs).forEach(k=>{ min[k] = parseNum(minInputs[k].value); });
      }
    }
    const cost = parseFloat((costInput.value||'').replace(',','.')) || 0;
    if(editing){
      applyStockMins(otherMins);
      updateStockItem(editing.id, { name, unit: draftUnit, qty, min, costPerUnit: cost, category: draftCategory });
    } else {
      addStockItem(name, draftUnit, qty, min, cost, availEverywhere, draftCategory);
      if(createIngredientToo){
        addRecipeIngredient({
          name, unit: draftUnit, yieldAmount: 1,
          components: [{ id: uid(), productName: name, unit: draftUnit, amount: 1 }],
          warehouseId: null, qty, qtyWarehouseId: state.currentWarehouse
        });
      }
    }
    editingStockItemId = null;
    view = 'stock';
    render();
  };
  wrap.appendChild(saveBtn);

  if(editing){
    const delBtn = el(`<button class="w-full btn-line py-3" style="color:var(--danger)">Видалити продукт</button>`);
    delBtn.onclick = ()=>{
      appConfirm('Видалити "'+editing.name+'"?', ()=>{
        deleteStockItem(editing.id);
        editingStockItemId = null;
        view = 'stock';
        render();
      });
    };
    wrap.appendChild(delBtn);
  }

  setTimeout(()=>nameInput.focus(), 50);
  return wrap;
}

function writeOffStartView(){
  const wrap = el(`<div></div>`);
  const topBar = el(`
    <div class="flex items-center gap-3 mb-4">
      <button id="woBack" class="navicon-btn" style="background:var(--card3)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="font-bold" style="font-size:1.1rem">Списання товару</div>
    </div>
  `);
  topBar.querySelector('#woBack').onclick = ()=>{ view='stock'; stockSubview='writeoffs'; render(); };
  wrap.appendChild(topBar);

  const productList = curStockItems().map(i=>({kind:'product', id:i.id, name:i.name, unit:i.unit, qty:i.qty}));
  const ingredientListRaw = curIngredientRows().map(i=>({kind:'ingredient', id:i.ingredientId, name:i.name, unit:i.unit, qty:i.qty}));
  const combined = productList.concat(ingredientListRaw).sort((a,b)=>a.name.localeCompare(b.name,'uk'));
  if(combined.length===0){
    wrap.appendChild(el(`<div class="sub text-center py-10">На цьому складі ще немає позицій для списання</div>`));
    return wrap;
  }

  let selKind = null, selId = null;
  let reason = WRITEOFF_REASONS[0];

  wrap.appendChild(el(`<div class="sub text-xs mb-1.5">Що списуємо</div>`));
  const itemWrap = el(`<div class="mb-3"></div>`);
  const itemSel = customSelect(
    combined.map(i=>({value:i.kind+':'+i.id, label:`${i.name} (${fmt(i.qty)} ${i.unit})`})),
    null,
    (val)=>{ const [k,id] = val.split(':'); selKind = k; selId = id; }
  );
  itemWrap.appendChild(itemSel);
  wrap.appendChild(itemWrap);
  selKind = combined[0].kind; selId = combined[0].id;

  wrap.appendChild(el(`<div class="sub text-xs mb-1.5">Кількість</div>`));
  const qtyInput = el(`<input type="text" inputmode="decimal" placeholder="0" class="w-full mb-3" style="border-radius:12px;background:var(--card3);color:var(--text);border:none;padding:12px 14px;font-weight:700">`);
  wrap.appendChild(qtyInput);

  wrap.appendChild(el(`<div class="sub text-xs mb-1.5">Причина</div>`));
  const reasonWrap = el(`<div class="mb-3"></div>`);
  const reasonSel = customSelect(
    WRITEOFF_REASONS.map(r=>({value:r, label:r})),
    reason,
    (val)=>{ reason = val; }
  );
  reasonWrap.appendChild(reasonSel);
  wrap.appendChild(reasonWrap);

  wrap.appendChild(el(`<div class="sub text-xs mb-1.5">Коментар (необов'язково)</div>`));
  const commentInput = el(`<textarea class="w-full mb-4" rows="2" style="border-radius:12px;background:var(--card3);color:var(--text);border:none;padding:12px 14px;resize:none"></textarea>`);
  wrap.appendChild(commentInput);

  const err = el(`<div class="text-sm mb-2" style="color:var(--danger);min-height:1.2em"></div>`);
  wrap.appendChild(err);

  const saveBtn = el(`<button class="w-full btn-solid py-3">Списати</button>`);
  saveBtn.onclick = ()=>{
    const qty = parseFloat((qtyInput.value||'').replace(',','.')) || 0;
    if(!selId){ err.textContent = 'Оберіть позицію'; return; }
    if(qty<=0){ err.textContent = 'Вкажіть кількість більше нуля'; return; }
    saveWriteOff(selKind, selId, qty, reason, (commentInput.value||'').trim());
  };
  wrap.appendChild(saveBtn);
  return wrap;
}

// Екран "Прийняти зміну" — тільки оцінка попередника (5 питань). Немає більше готівки, відкриття чи
// закриття зміни: хто сьогодні працює, вирішує лише Графік змін (isScheduledToday). Цей екран
// з'являється лише тоді, коли pendingScheduleHandover() каже, що є кого оцінити.
function shiftAcceptView(){
  const wrap = el(`<div></div>`);
  const topBar = el(`
    <div class="flex items-center gap-3 mb-4">
      <button id="shBack" class="navicon-btn" style="background:var(--card3)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="font-bold" style="font-size:1.1rem">Прийняти зміну</div>
    </div>
  `);
  topBar.querySelector('#shBack').onclick = ()=>{ view=homeView(); render(); };
  wrap.appendChild(topBar);

  const locationId = state.activeLocationId;
  const locName = (state.locations.find(l=>l.id===locationId)||{}).name || '';
  wrap.appendChild(el(`<div class="sub text-xs mb-3">Точка: ${escapeHtml(locName)}</div>`));

  const prior = pendingScheduleHandover(locationId);
  if(!prior){
    // Немає кого оцінювати (вже оцінено, або це той самий працівник, що й минулого разу) —
    // сюди не мало вести жодне посилання, але про всяк випадок показуємо нейтральний стан.
    wrap.appendChild(el(`<div class="sub text-sm py-10 text-center">Оцінювати нема кого — зміну вже прийнято або це ваша власна попередня зміна.</div>`));
    return wrap;
  }

  const priorStaff = state.staff.find(s=>s.id===prior.staffId);
  // На точку виходить ІНША людина, ніж та, що працювала там попереднього робочого дня — перш ніж
  // почати роботу, вона оцінює 5 пунктів того, як точку залишив попередник. Кожне "Добре" = +0.2 до
  // рейтингу (макс. 1.0); рахується в періоди 10-25 і 26-9 для нарахування бонусу.
  wrap.appendChild(el(`<div class="sub text-sm mb-4">Оцініть, як точку залишив(ла) ${escapeHtml(priorStaff?priorStaff.name:'-')}, перш ніж почати свою зміну.</div>`));

  const answers = {};
  SHIFT_RATING_QUESTIONS.forEach(q=>{
    const row = el(`
      <div class="card p-3 mb-2.5">
        <div class="font-semibold text-sm mb-2">${escapeHtml(q.label)}</div>
        <div class="flex gap-2">
          <button type="button" data-v="good" class="flex-1 py-2.5" style="border-radius:10px;border:1.5px solid rgba(47,65,114,.25);background:var(--card3);color:var(--text);font-weight:600;font-size:.85rem">Добре</button>
          <button type="button" data-v="bad" class="flex-1 py-2.5" style="border-radius:10px;border:1.5px solid rgba(47,65,114,.25);background:var(--card3);color:var(--text);font-weight:600;font-size:.85rem">Погано</button>
        </div>
      </div>
    `);
    const goodBtn = row.querySelector('[data-v="good"]');
    const badBtn = row.querySelector('[data-v="bad"]');
    const paint = ()=>{
      const v = answers[q.key];
      goodBtn.style.background = v==='good' ? 'var(--accent2)' : 'var(--card3)';
      goodBtn.style.borderColor = v==='good' ? 'var(--accent2)' : 'rgba(47,65,114,.25)';
      goodBtn.style.color = v==='good' ? '#fff' : 'var(--text)';
      badBtn.style.background = v==='bad' ? 'var(--danger)' : 'var(--card3)';
      badBtn.style.borderColor = v==='bad' ? 'var(--danger)' : 'rgba(47,65,114,.25)';
      badBtn.style.color = v==='bad' ? '#fff' : 'var(--text)';
    };
    goodBtn.onclick = ()=>{ answers[q.key]='good'; paint(); };
    badBtn.onclick = ()=>{ answers[q.key]='bad'; paint(); };
    wrap.appendChild(row);
  });

  const err = el(`<div class="sub text-xs mb-2" style="color:var(--danger)"></div>`);
  wrap.appendChild(err);

  const acceptBtn = el(`<button class="w-full btn-solid py-3">Прийняти зміну</button>`);
  acceptBtn.onclick = ()=>{
    const missing = SHIFT_RATING_QUESTIONS.some(q=>!answers[q.key]);
    if(missing){ err.textContent = 'Дайте відповідь на всі 5 пунктів.'; return; }
    addShiftRating(prior, answers);
    appAlert('Зміну прийнято, дякуємо за оцінку!', ()=>{ view=homeView(); render(); });
  };
  wrap.appendChild(acceptBtn);
  return wrap;
}

const AUDIT_TYPE_LABELS = {
  staff: '👤 Персонал', menu: '🍔 Меню', transfer: '⇄ Поставка',
  production: '🔪 Виробництво', inventory: '📋 Інвентаризація', writeoff: '🗑 Списання',

  wrap.appendChild(descInput);

  wrap.appendChild(el(`<div class="sub text-xs mb-1">Крайня дата виконання</div>`));
  let dueDateValue = '';
  const dueHost = el(`<div class="mb-3"></div>`);
  const duePicker = datePickerField('', (val)=>{ dueDateValue = val; });
  dueHost.appendChild(duePicker);
  wrap.appendChild(dueHost);

  wrap.appendChild(el(`<div class="sub text-xs mb-1.5">Кому</div>`));
  // Задачу можна доручити будь-кому: конкретному співробітнику будь-якої ролі, або одразу всім
  // співробітникам однієї ролі («role:...» — тоді бачить будь-хто з цієї ролі, включно з власником).
  const ROLE_ORDER = ['owner','cook','prep','cashier'];
  const assigneeOptions = [];
  ROLE_ORDER.forEach(role=>{
    const staffOfRole = state.staff.filter(s=>s.role===role);
    if(staffOfRole.length===0) return;
    assigneeOptions.push({value:'role:'+role, label:'Будь-який '+ROLE_LABELS[role].toLowerCase()});
    staffOfRole.forEach(s=> assigneeOptions.push({value:s.id, label:`${s.name} (${ROLE_LABELS[role]})`}));
  });
  if(assigneeOptions.length===0) assigneeOptions.push({value:'role:prep', label:'Будь-який заготівельник'});
  let selectedAssignee = assigneeOptions[0].value;
  const assigneeSelHost = el(`<div class="mb-4"></div>`);
  const assigneeSel = customSelect(assigneeOptions, selectedAssignee, (val)=>{ selectedAssignee = val; });
  assigneeSelHost.appendChild(assigneeSel);
  wrap.appendChild(assigneeSelHost);

  const err = el(`<div class="text-sm mb-2" style="color:var(--danger);min-height:1.2em"></div>`);
  wrap.appendChild(err);

  const saveBtn = el(`<button class="w-full btn-solid py-3">Створити завдання</button>`);
  saveBtn.onclick = ()=>{
    const title = titleInput.value.trim();
    if(!title){ err.textContent = 'Вкажіть назву завдання'; return; }
    let assignedToRole, assignedToStaffId;
    if(selectedAssignee.startsWith('role:')){
      assignedToRole = selectedAssignee.slice(5);
      assignedToStaffId = null;
    } else {
      const staff = state.staff.find(s=>s.id===selectedAssignee);
      assignedToRole = staff ? staff.role : 'prep';
      assignedToStaffId = selectedAssignee;
    }
    addTask({
      title, description: descInput.value.trim(), dueDate: dueDateValue,
      assignedToRole, assignedToStaffId
    });
    view = 'tasks';
    render();
  };
  wrap.appendChild(saveBtn);
  return wrap;
}

// ---- Графік змін: month calendar (owner) -> tap a day -> assign staff+точка for that date. ----
const SCHEDULE_MONTH_NAMES = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const SCHEDULE_WEEKDAY_LABELS = ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
let scheduleCalMonth = null; // {year, month(0-indexed)} — null means "current month", resolved lazily
let scheduleDayKey = null; // dateKey ('YYYY-MM-DD') of the day currently open in scheduleDayView
let scheduleLocationId = null; // location currently open in scheduleLocationView
let scheduleDayReturnTo = 'scheduleCalendar'; // 'scheduleCalendar' | 'scheduleLocation' — where scheduleDayView's back button goes

function scheduleCalCursor(){
  if(!scheduleCalMonth){
    const d = new Date();
    scheduleCalMonth = { year: d.getFullYear(), month: d.getMonth() };
  }
  return scheduleCalMonth;
}
function formatScheduleDate(key){
  const [y,m,d] = key.split('-').map(Number);
  return d+' '+SCHEDULE_MONTH_NAMES[m-1]+' '+y;
}

function scheduleCalendarView(){
  const wrap = el(`<div></div>`);
  const topBar = el(`
    <div class="flex items-center gap-3 mb-4">
      <button id="scBack" class="navicon-btn" style="background:var(--card3)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="font-bold" style="font-size:1.1rem">Графік змін</div>
    </div>
  `);
  topBar.querySelector('#scBack').onclick = ()=>{ view = isOwner() ? 'settings' : 'stock'; render(); };
  wrap.appendChild(topBar);

  const cur = scheduleCalCursor();
  const monthNav = el(`
    <div class="flex items-center justify-between mb-3">
      <button id="scPrev" class="navicon-btn" style="background:var(--card3)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="font-semibold">${SCHEDULE_MONTH_NAMES[cur.month]} ${cur.year}</div>
      <button id="scNext" class="navicon-btn" style="background:var(--card3)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  `);
  monthNav.querySelector('#scPrev').onclick = ()=>{
    scheduleCalMonth = cur.month===0 ? {year:cur.year-1, month:11} : {year:cur.year, month:cur.month-1};
    render();
  };
  monthNav.querySelector('#scNext').onclick = ()=>{
    scheduleCalMonth = cur.month===11 ? {year:cur.year+1, month:0} : {year:cur.year, month:cur.month+1};
    render();
  };
  wrap.appendChild(monthNav);

  const weekHead = el(`<div class="grid grid-cols-7 gap-1 mb-1"></div>`);
  SCHEDULE_WEEKDAY_LABELS.forEach(lbl=> weekHead.appendChild(el(`<div class="sub text-center" style="font-size:.7rem">${lbl}</div>`)));
  wrap.appendChild(weekHead);

  const first = new Date(cur.year, cur.month, 1);
  const startOffset = (first.getDay()+6)%7; // Monday-first grid
  const gridStart = new Date(cur.year, cur.month, 1-startOffset);
  const todayKey = dateKeyFromOffset(0);

  const grid = el(`<div class="grid grid-cols-7 gap-1 mb-4"></div>`);
  for(let i=0;i<42;i++){
    const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const key = localDateKey(d);
    const inMonth = d.getMonth()===cur.month;
    const entries = scheduleEntriesForDate(key);
    const isToday = key===todayKey;
    const cell = el(`
      <div data-key="${key}" class="card" style="aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:4px;${inMonth?'':'opacity:.35'};${isToday?'border:1.5px solid var(--accent)':''}">
        <div style="font-size:.8rem;font-weight:${isToday?'800':'600'}">${d.getDate()}</div>
        ${entries.length>0 ? `<div style="width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:2px"></div>` : ''}
      </div>
    `);
    cell.onclick = ()=>{ scheduleDayKey = key; scheduleDayReturnTo = 'scheduleCalendar'; view='scheduleDay'; render(); };
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);

  wrap.appendChild(el(`<div class="sub text-xs text-center mb-6">${isOwner() ? 'Натисніть на день, щоб призначити співробітника' : 'Натисніть на день, щоб переглянути, хто працює'}</div>`));

  // --- Локації: клік на точку -> список "дата · хто працює" для неї ---
  wrap.appendChild(el(`<div class="font-semibold text-sm mb-2">Локації</div>`));
  if(state.locations.length===0){
    wrap.appendChild(el(`<div class="sub text-xs">Спершу додайте точку в Налаштуваннях.</div>`));
  } else {
    const locList = el(`<div></div>`);
    state.locations.forEach(loc=>{
      const count = scheduleEntriesForLocation(loc.id).length;
      const row = el(`
        <div class="card p-3 mb-2 flex items-center justify-between" style="cursor:pointer">
          <div class="font-medium text-sm">${escapeHtml(loc.name)}</div>
          <div class="sub text-xs">${count>0 ? count+' зміна(и) у графіку' : 'ще немає призначень'} ›</div>
        </div>
      `);
      row.onclick = ()=>{ scheduleLocationId = loc.id; view='scheduleLocation'; render(); };
      locList.appendChild(row);
    });
    wrap.appendChild(locList);
  }
  return wrap;
}

  const wrap = el(`<div></div>`);
  const loc = state.locations.find(l=>l.id===scheduleLocationId);
  const topBar = el(`

      <button id="slocBack" class="navicon-btn" style="background:var(--card3)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
