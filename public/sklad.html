  view = 'inventoryDetail';
  render();
}

// A 'YYYY-MM-DD' key built from the Date object's LOCAL calendar fields — NOT toISOString(), which
// converts to UTC first and so silently shifts to the previous day for any positive UTC offset
// (e.g. Kyiv, UTC+3: local midnight is 21:00 UTC the day before). Every dateKey in the app must be
// built this way, or a day picked in the UI ends up stored/looked-up as the day before it.
function localDateKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dateKeyFromOffset(offset){
  const d = new Date(); d.setDate(d.getDate()-offset);
  return localDateKey(d);
}
function dateLabelFromOffset(offset){
  if(offset===0) return 'Сьогодні';
  if(offset===1) return 'Вчора';
  const d = new Date(); d.setDate(d.getDate()-offset);
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0');
}

// Returns the extensible daily metrics object for a location+date (see analytics spec).
function dailyMetrics(locationId, dateKey){
  const daySales = state.sales.filter(s=>s.locationId===locationId && s.dateKey===dateKey);
  const byCat = {};
  daySales.forEach(s=>{ byCat[s.category] = (byCat[s.category]||0) + s.amount; });
  const turnover = daySales.reduce((sum,s)=>sum+s.amount,0);
  return {
    date: dateKey, locationId,
    metrics: {
      turnover,
      turnoverByCategory: byCat,
      ordersCount: daySales.length,
      averageCheck: daySales.length ? turnover/daySales.length : 0,
      expenses: 0,
      profit: 0
    }
  };
}
function lowStockFor(warehouseId){
  return state.stockItems.filter(i=>i.warehouseId===warehouseId && i.qty<=i.min);
}

// ---- Аналітика (P&L по стравах, усушка, недостачі за період) ----
// Unit cost of one order line, using the snapshots taken at sale time so edits/deletions to the
// master product/recipe afterwards never change historical numbers.
function lineUnitCost(line){
  if(line.productType==='dish'){
    return (line.recipeSnapshot||[]).reduce((s,c)=>s+(Number(c.cost)||0),0) + (Number(line.optionsCostSnapshot)||0);
  }
  return Number(line.costPriceSnapshot)||0;
}
function dateKeyInRange(dateKey, days){
  // days=1 => today only, days=7 => today and the 6 days before, etc.
  for(let off=0; off<days; off++){ if(dateKeyFromOffset(off)===dateKey) return true; }
  return false;
}
// Чистий прибуток локації = сума продажів − собівартість проданого (за знімками собівартості в замовленнях,
// тож зміни цін потім не псують історію). filter(order) → true для замовлень, що враховуємо.
function locationProfit(locationId, filter){
  let revenue = 0, cost = 0;
  (state.orders||[]).forEach(order=>{
    if(order.locationId!==locationId) return;
    if(filter && !filter(order)) return;
    (order.items||[]).forEach(line=>{
      revenue += (Number(line.price)||0) * (Number(line.qty)||0);
      cost += lineUnitCost(line) * (Number(line.qty)||0);
    });
  });
  return { revenue, cost, profit: revenue - cost, marginPct: revenue>0 ? (revenue-cost)/revenue*100 : 0 };
}
// Aggregates every sold dish/product across all orders within the last `days` days into per-item
// revenue/cost/margin. Returns rows sorted by revenue desc.
function dishPnlReport(days){
  const map = new Map(); // name -> {name, qty, revenue, cost}
  state.orders.forEach(order=>{
    if(!dateKeyInRange(order.dateKey, days)) return;
    (order.items||[]).forEach(line=>{
      const cur = map.get(line.name) || { name: line.name, qty: 0, revenue: 0, cost: 0 };
      cur.qty += line.qty;
      cur.revenue += line.price*line.qty;
      cur.cost += lineUnitCost(line)*line.qty;
      map.set(line.name, cur);
    });
  });
  return Array.from(map.values()).map(r=>({
    ...r, margin: r.revenue-r.cost, marginPct: r.revenue>0 ? ((r.revenue-r.cost)/r.revenue*100) : 0
  })).sort((a,b)=>b.revenue-a.revenue);
}
// Shrinkage dynamics across "Нова готовка" records within the last `days` days: overall average and
// a per-production breakdown, worst-first, so the owner can spot outliers by cook/date.
function shrinkageReport(days){
  // productions don't carry a dateKey, only a formatted ts string, so we approximate recency by
  // taking them in insertion order (unshift = newest first) and capping to a generous count when a
  // period is requested — good enough for a prototype-scale business.
  const cap = days<=1 ? 15 : (days<=7 ? 60 : 200);
  const list = state.productions.filter(p=>p.status==='done').slice(0, cap);
  let sum = 0, n = 0;
  const rows = [];
  list.forEach(p=>{
    (p.items||[]).forEach(it=>{
      sum += it.shrinkagePercent||0; n++;
      rows.push({ ts: p.ts, employeeName: p.employeeName, inputName: it.inputName, outputName: it.outputName, shrinkagePercent: it.shrinkagePercent||0 });
    });
  });
  rows.sort((a,b)=>b.shrinkagePercent-a.shrinkagePercent);
  return { avg: n?sum/n:0, count: n, rows: rows.slice(0,10) };
}
// Money-valued gaps over the period: write-offs (reasoned removals) plus negative inventory diffs
// (unexplained shortfall found on count) — kept separate per the ТЗ distinction between the two.
function shortageReport(days){
  const writeOffsTotal = state.writeOffs
    .filter(w=>dateKeyInRange(dateKeyFromTs(w.ts), days))
    .reduce((s,w)=>s+(w.value||0),0);
  const inventoryShortfallTotal = state.inventories
    .filter(inv=>dateKeyInRange(dateKeyFromTs(inv.ts), days))
    .reduce((s,inv)=>s+(inv.items||[]).filter(i=>i.diff<0).reduce((s2,i)=>s2+Math.abs(i.diffValue||0),0), 0);
  return { writeOffsTotal, inventoryShortfallTotal, total: writeOffsTotal+inventoryShortfallTotal };
}
// Теоретичний vs фактичний розхід — for each ready-made ingredient, compares how much the техкарта
// SHOULD have consumed (theoretical, from recorded sale deductions) against what an actual count found
// (actual = theoretical adjusted by any inventory shortfall/surplus of that ingredient in the period).
// A negative variance means more disappeared than the recipe accounts for — leakage, over-portioning,
// theft, or a wrong техкарта. Needs at least one ingredient inventory in the period to say anything.
function theoreticalVsActualReport(days){
  const theoreticalMap = new Map(); // ingredientId -> qty sold (theoretical)
  state.history.forEach(h=>{
    if(h.ingredientId && h.reason==='Продаж' && h.delta<0 && dateKeyInRange(dateKeyFromTs(h.ts), days)){
      theoreticalMap.set(h.ingredientId, (theoreticalMap.get(h.ingredientId)||0) + Math.abs(h.delta));
    }
  });
  const diffMap = new Map(); // ingredientId -> summed inventory diff (after-before) in the period
  state.inventories.forEach(inv=>{
    if(!dateKeyInRange(dateKeyFromTs(inv.ts), days)) return;
    (inv.items||[]).forEach(it=>{
      if(it.kind==='ingredient' && it.ingredientId){
        diffMap.set(it.ingredientId, (diffMap.get(it.ingredientId)||0) + (it.diff||0));
      }
    });
  });
  const ids = new Set([...theoreticalMap.keys(), ...diffMap.keys()]);
  const rows = [];
  ids.forEach(id=>{
    const ing = state.recipeIngredients.find(i=>i.id===id);
    if(!ing) return;
    const theoretical = theoreticalMap.get(id) || 0;
    const diffSum = diffMap.get(id) || 0;
    const actual = theoretical - diffSum; // shortfall (diffSum<0) means actual usage was higher
    const variance = actual - theoretical; // = -diffSum, negative = more used than expected
    const costPerUnit = ingredientCostPerUnit(ing);
    rows.push({
      name: ing.name, unit: ing.unit, theoretical, actual, variance,
      variancePct: theoretical>0 ? (variance/theoretical*100) : (variance!==0 ? null : 0),
      varianceValue: Number((variance*costPerUnit).toFixed(2))
    });
  });
  rows.sort((a,b)=>Math.abs(b.variance)-Math.abs(a.variance));
  return { rows, hasInventoryData: diffMap.size>0 };
}
// Our `ts` fields are formatted "dd.mm, HH:MM" strings (nowStr()), not ISO — approximate a dateKey
// out of them for period filtering (assumes current year, which is fine at prototype scale).
function dateKeyFromTs(ts){
  const m = /^(\d{2})\.(\d{2})/.exec(ts||'');
  if(!m) return null;
  const year = new Date().getFullYear();
  return `${year}-${m[2]}-${m[1]}`;
}

// ---- Сповіщення власнику ----
// Notifications are computed fresh from live data on every call rather than stored, so they always
// reflect current reality (e.g. a low-stock alert disappears the moment stock is replenished). Each
// gets a stable id so it can be individually dismissed without re-showing until it recurs.
const SHRINKAGE_ALERT_THRESHOLD = 15; // %
function computeNotifications(){
  const list = [];
  // 1) Low stock, across every warehouse.
  state.stockItems.filter(i=>i.qty<=i.min).forEach(i=>{
    const whName = (state.warehouses.find(w=>w.id===i.warehouseId)||{}).name || '';
    list.push({
      id: 'lowstock-'+i.id, severity: 'warn',
      title: `Низький залишок: ${i.name}`,
      subtitle: `${fmt(i.qty)} ${i.unit} на складі «${whName}» (мінімум ${fmt(i.min)})`,
      action: ()=>{ state.currentWarehouse = i.warehouseId; view='stock'; stockSubview='stock'; render(); }
    });
  });
  // 2) High shrinkage on recent productions.
  state.productions.filter(p=>p.status==='done').slice(0,30).forEach(p=>{
    (p.items||[]).forEach((it,idx)=>{
      if((it.shrinkagePercent||0) > SHRINKAGE_ALERT_THRESHOLD){
        list.push({
          id: 'shrinkage-'+p.id+'-'+idx, severity: 'danger',
          title: `Висока усушка: ${it.inputName} → ${it.outputName}`,
          subtitle: `${fmt(it.shrinkagePercent)}% · ${p.ts} · ${p.employeeName}`,
          action: ()=>{ view='analytics'; render(); }
        });
      }
    });
  });
  // 3) Received transfers with a discrepancy (sent ≠ received).
  state.transfers.filter(t=>t.status==='RECEIVED').forEach(t=>{
    const hasDiscrepancy = (t.lines||[]).some(l=>l.receivedQty!==null && l.receivedQty!==l.sentQty);
    if(hasDiscrepancy){
      const toName = (state.warehouses.find(w=>w.id===t.toWarehouseId)||{}).name || '';
      list.push({
        id: 'transfer-'+t.id, severity: 'warn',
        title: `Розбіжність у поставці на «${toName}»`,
        subtitle: `Прийнято ${t.receivedBy}, ${t.receivedAt}`,
        action: ()=>{ view='transferList'; render(); }
      });
    }
  });
  return list.filter(n=>!state.dismissedNotifications.includes(n.id));
}
function dismissNotification(id){
  if(!state.dismissedNotifications.includes(id)) state.dismissedNotifications.push(id);
  saveState(); render();
}

// ---- Меню (товари для "Створити замовлення") ----
// product: {id, name, category:'meat'|'fastfood', type:'product'|'dish',
//           ingredients: [{id, ingredientId, name, unit, amount, costPerUnit, cost}] (only for 'dish'),
//           costPrice, price, modifier: null | {label, options:[{id,name}]},
//           optionGroups: [{id,label,options:[{id,name,kind:'none'|'ingredient'|'product',refId,productName,unit,amount,priceDelta}]}]}
// type 'combo': comboSlots [{id,label,productIds:[menu product ids]}] — комбо збирається з уже готових позицій меню:
// на кожен слот (бургер, картопля, напій) касир обирає одну з доданих позицій; списується те, що обрали.
// optionGroups — групи вибору (соус, напій…): при продажу касир обирає по одній опції з кожної групи;
// опція може списувати рецепт (соус) чи продукт зі складу (напій) і мати доплату.
function addProduct(data){
  state.products.push({
    id: uid(),
    name: data.name,
    category: data.category,
    type: data.type,
    ingredients: data.type==='dish' ? data.ingredients : [],
    costPrice: Number(data.costPrice)||0,
    price: Number(data.price)||0,
    modifier: data.modifier || null,
    optionGroups: data.optionGroups || [],
    comboSlots: data.type==='combo' ? (data.comboSlots||[]) : [],
    recipeVersion: 1, recipeHistory: []
  });
  logEvent('menu', `Додано товар у меню: ${data.name} (${fmtMoney(Number(data.price)||0)})`);
  saveState(); render();
}
// Edits an existing menu item in place. When it's a dish and either the recipe (ingredients) or the
// price actually changed, the PREVIOUS version is archived into product.recipeHistory first and
// recipeVersion bumps — so historical sales (which already snapshot their own recipe at sale time,
// see addToCart) stay accurate, and the owner can also see the recipe's own edit trail over time.
function ingredientsEqual(a, b){
  if((a||[]).length!==(b||[]).length) return false;
  const key = x=>x.ingredientId+':'+x.amount;
  const as = (a||[]).map(key).sort(), bs = (b||[]).map(key).sort();
  return as.every((v,i)=>v===bs[i]);
}
function updateProduct(id, data){
  const p = state.products.find(x=>x.id===id);
  if(!p) return;
  if(!p.recipeHistory) p.recipeHistory = [];
  if(!p.recipeVersion) p.recipeVersion = 1;
  const newIngredients = data.type==='dish' ? data.ingredients : [];
  const recipeChanged = data.type==='dish' && !ingredientsEqual(p.ingredients, newIngredients);
  const priceChanged = Number(data.price)!==p.price;
  if(p.type==='dish' && (recipeChanged || priceChanged)){
    const u = curUser();
    p.recipeHistory.unshift({
      version: p.recipeVersion, ingredients: (p.ingredients||[]).map(i=>({...i})),
      costPrice: p.costPrice, price: p.price,
      changedAt: nowStr(), changedBy: u?u.name:'-'
    });
    p.recipeVersion++;
  }
  p.name = data.name;
  p.category = data.category;
  p.type = data.type;
  p.ingredients = newIngredients;
  p.costPrice = Number(data.costPrice)||0;
  p.price = Number(data.price)||0;
  p.optionGroups = data.optionGroups || [];
  p.comboSlots = data.type==='combo' ? (data.comboSlots||[]) : [];
  logEvent('menu', `Редаговано товар у меню: ${data.name}${recipeChanged?' (змінено рецепт)':''}`);
  saveState(); render();
}
function deleteProduct(id){
  const p = state.products.find(x=>x.id===id);
  state.products = state.products.filter(p=>p.id!==id);
  if(p) logEvent('menu', `Видалено товар з меню: ${p.name}`);
  saveState(); render();
}
// Розділи вибору для позиції меню: слоти комбо (вибір готової позиції), опції обраних у слотах позицій,
// і власні групи опцій самої позиції. key — ключ у optionPicks.
function buildPickSections(p){
  const nonEmpty = g=>(g.options||[]).length>0;
  const sections = [];
  if(p.type==='combo'){
    (p.comboSlots||[]).forEach(slot=>{
      const prods = (slot.productIds||[]).map(id=>state.products.find(x=>x.id===id)).filter(Boolean);
      if(!prods.length) return;
      sections.push({ key:'slot:'+slot.id, kind:'slot', slot, label:slot.label, options:prods.map(x=>({id:x.id, name:x.name, delta:0})) });
      const chosen = prods.find(x=>x.id===optionPicks['slot:'+slot.id]);
      if(chosen) (chosen.optionGroups||[]).filter(nonEmpty).forEach(g=>{
        sections.push({ key:slot.id+'|'+g.id, kind:'slotgroup', slot, group:g, label:slot.label+': '+g.label, options:g.options.map(o=>({id:o.id, name:o.name, delta:Number(o.priceDelta)||0})) });
      });
    });
  }
  (p.optionGroups||[]).filter(nonEmpty).forEach(g=>{
    sections.push({ key:g.id, kind:'group', group:g, label:g.label, options:g.options.map(o=>({id:o.id, name:o.name, delta:Number(o.priceDelta)||0})) });
  });
  return sections;
}
// Перетворює обране в optionPicks на picks (власні опції) та comboSel (вибір по слотах).
function resolvePicks(p, sections){
  const picks = [], comboSelMap = new Map();
  sections.forEach(sec=>{
    const pickId = optionPicks[sec.key];
    if(sec.kind==='group'){ picks.push({ group:sec.group, option:sec.group.options.find(o=>o.id===pickId) }); return; }
    if(sec.kind==='slot'){
      const prod = state.products.find(x=>x.id===pickId);
      comboSelMap.set(sec.slot.id, { slot:sec.slot, product:prod, picks:[] });
      return;
    }
    const sel = comboSelMap.get(sec.slot.id);
    if(sel) sel.picks.push({ group:sec.group, option:sec.group.options.find(o=>o.id===pickId) });
  });
  return { picks, comboSel:[...comboSelMap.values()] };
}
function optionCostPerUnit(o){
  const amt = Number(o.amount)||0;
  if(o.kind==='ingredient'){ const ing = state.recipeIngredients.find(i=>i.id===o.refId); return ing ? ingredientCostPerUnit(ing)*amt : 0; }
  if(o.kind==='product') return productCostByName(o.productName)*amt;
  return 0;
}
function productsFor(category){
  return state.products.filter(p=>p.category===category);
}
// За замовчуванням показуємо всі товари обох категорій, відсортовані за алфавітом; categoryFilter
// (null | 'meat' | 'fastfood') звужує до однієї категорії, searchQuery фільтрує за назвою.
function productsFiltered(categoryFilter, searchQuery){
  let list = categoryFilter ? productsFor(categoryFilter) : state.products.slice();
  const q = (searchQuery||'').trim().toLowerCase();
  if(q) list = list.filter(p=>p.name.toLowerCase().includes(q));
  return list.slice().sort((a,b)=>a.name.localeCompare(b.name,'uk'));
}

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Native window.confirm()/alert()/prompt() are blocking browser dialogs that Telegram's in-app
// WebView does not support properly — they can silently no-op, which is why buttons that relied on
// confirm() (delete, etc.) looked like they did nothing. These helpers use Telegram's own popup API
// when available and otherwise fall back to a themed in-page modal, so they work the same everywhere.
function showModal(contentBuilder){
  const overlay = el(`<div style="position:fixed;inset:0;z-index:200;background:rgba(22,33,59,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px"></div>`);
  const card = el(`<div class="card" style="width:100%;max-width:420px;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow-y:auto"></div>`);
  overlay.appendChild(card);
  document.body.appendChild(overlay);
  const close = ()=>{ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); };
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  contentBuilder(card, close);
  return close;
}
function appConfirm(message, onConfirm){
  try{
    if(window.Telegram && window.Telegram.WebApp && typeof window.Telegram.WebApp.showConfirm==='function'){
      window.Telegram.WebApp.showConfirm(message, (ok)=>{ if(ok) onConfirm(); });
      return;
    }
  }catch(e){}
  showModal((card, close)=>{
    card.appendChild(el(`<div class="font-semibold mb-4" style="font-size:1rem;line-height:1.4">${escapeHtml(message)}</div>`));
    const row = el(`<div class="flex gap-2"></div>`);
    const cancelBtn = el(`<button class="btn-line flex-1 py-3">Скасувати</button>`);
    const okBtn = el(`<button class="btn-solid flex-1 py-3">Так</button>`);
    cancelBtn.onclick = close;
    okBtn.onclick = ()=>{ close(); onConfirm(); };
    row.appendChild(cancelBtn); row.appendChild(okBtn);
    card.appendChild(row);
  });
}
// Плашка зверху екрана, що сама зникає (не блокує роботу, на відміну від appAlert).
let toastTimer = null;
function showToast(message, kind){
  try{
    let t = document.getElementById('appToast');
    if(!t){
      t = document.createElement('div');
      t.id = 'appToast';
      t.setAttribute('role','status');
      t.style.cssText = 'position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);z-index:9999;max-width:min(92vw,420px);width:max-content;padding:12px 18px;border-radius:16px;font-weight:600;font-size:.92rem;box-shadow:0 12px 32px rgba(0,0,0,.45);transition:transform .25s ease,opacity .25s ease;opacity:0;pointer-events:none;display:flex;align-items:center;gap:10px;color:#fff';
      document.body.appendChild(t);
    }
    const ok = kind!=='error';
    t.style.background = ok ? '#1f9d63' : '#d64545';
    t.innerHTML = '<span style="font-size:1.1rem;line-height:1">'+(ok?'✓':'!')+'</span><span></span>';
    t.lastChild.textContent = message;
    // перезапуск анімації
    t.style.transform = 'translate(-50%,-140%)'; t.style.opacity = '0';
    void t.offsetWidth;
    t.style.transform = 'translate(-50%,0)'; t.style.opacity = '1';
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ t.style.transform = 'translate(-50%,-140%)'; t.style.opacity = '0'; }, 2600);
  }catch(e){}
}
function appAlert(message, onClose){
  try{
    if(window.Telegram && window.Telegram.WebApp && typeof window.Telegram.WebApp.showAlert==='function'){
      window.Telegram.WebApp.showAlert(message, ()=>{ if(onClose) onClose(); });
      return;
    }
  }catch(e){}
  showModal((card, close)=>{
    card.appendChild(el(`<div class="font-semibold mb-4" style="font-size:1rem;line-height:1.4">${escapeHtml(message)}</div>`));
    const okBtn = el(`<button class="btn-solid w-full py-3">Зрозуміло</button>`);
    okBtn.onclick = ()=>{ close(); if(onClose) onClose(); };
    card.appendChild(okBtn);
  });
}
// No Telegram-native equivalent for prompt(), so this always uses the themed modal.
function appPrompt(message, defaultValue, onSubmit){
  showModal((card, close)=>{
    card.appendChild(el(`<div class="font-semibold mb-3" style="font-size:1rem;line-height:1.4">${escapeHtml(message)}</div>`));
    const input = el(`<input type="text" class="w-full py-3 px-3 mb-4" style="border-radius:14px;background:var(--card3);color:var(--text);border:none">`);
    if(defaultValue) input.value = defaultValue;
    card.appendChild(input);
    const row = el(`<div class="flex gap-2"></div>`);
    const cancelBtn = el(`<button class="btn-line flex-1 py-3">Скасувати</button>`);
    const okBtn = el(`<button class="btn-solid flex-1 py-3">Гаразд</button>`);
    const submit = ()=>{ const v = input.value; close(); onSubmit(v); };
    cancelBtn.onclick = close;
    okBtn.onclick = submit;
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
    row.appendChild(cancelBtn); row.appendChild(okBtn);
    card.appendChild(row);
    setTimeout(()=>input.focus(), 50);
  });
}

// No Telegram-native equivalent for a multi-option chooser, so this always uses the themed modal.
// options: [{value, label, sub}]
function appChoice(message, options, onChoose){
  showModal((card, close)=>{

// Custom styled dropdown — replaces native <select> so the option list matches the app's dark theme.
// options: [{value, label}]. Returns a wrapper div with .getValue()/.setValue()/.setOptions().
function customSelect(options, initialValue, onChange){
  const wrap = el(`<div style="position:relative"></div>`);
  let opts = options;
  let current = initialValue!==undefined && initialValue!==null ? initialValue : (opts[0] ? opts[0].value : null);
  let openState = false;
  let host = null, hostPrev = null;

  const btn = el(`
    <button type="button" class="w-full flex items-center justify-between" style="border-radius:12px;background:var(--card2);color:var(--text);border:none;padding:12px 14px;text-align:left;font-size:.9rem;font-weight:600">
      <span data-label style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
      <svg data-chev viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--sub)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-left:8px;transition:transform .15s"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  `);
  const labelSpan = btn.querySelector('[data-label]');
  const chev = btn.querySelector('[data-chev]');
  const panel = el(`
    <div style="position:absolute; left:0; right:0; top:calc(100% + 8px); z-index:60; background:var(--card2); border:1px solid rgba(47,65,114,.14); border-radius:16px; box-shadow:0 16px 40px rgba(40,60,110,.20); max-height:240px; overflow-y:auto; padding:6px; display:none;"></div>
  `);

  function renderOptions(){
    panel.innerHTML = '';
    if(opts.length===0){
      panel.appendChild(el(`<div class="sub" style="padding:12px 14px;font-size:.85rem">Немає варіантів</div>`));
      return;
    }
    opts.forEach(opt=>{
      const active = opt.value===current;
      const row = el(`
        <div style="display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border-radius:11px;font-size:.9rem;font-weight:${active?'700':'500'};color:${active?'var(--accent)':'var(--text)'};cursor:pointer">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(opt.label)}</span>
        </div>
      `);
      row.addEventListener('mousedown', (e)=>e.preventDefault());
      row.onclick = ()=>{
        current = opt.value;
        updateLabel();
        closePanel();
        if(onChange) onChange(current);
      };
      panel.appendChild(row);
    });
  }
  function updateLabel(){
    const found = opts.find(o=>o.value===current);
    labelSpan.textContent = found ? found.label : '';
  }
  function openPanel(){
    openState = true;
    // Картки з backdrop-filter створюють власний шар: наступна картка перекривала б випадаючий список.
    // Піднімаємо картку-власника списку над сусідніми, поки він відкритий.
    host = wrap.closest('.card, .panel');
    if(host){ hostPrev = { z: host.style.zIndex, pos: host.style.position }; host.style.zIndex = '40'; if(!host.style.position) host.style.position = 'relative'; }
    panel.style.display = 'block';
    chev.style.transform = 'rotate(180deg)';
  }
  function closePanel(){
    openState = false;
    if(host){ host.style.zIndex = hostPrev.z; host.style.position = hostPrev.pos; host = null; }
    panel.style.display = 'none';
    chev.style.transform = 'rotate(0deg)';
  }
  btn.onclick = (e)=>{
    e.stopPropagation();
    openState ? closePanel() : openPanel();
  };
  document.addEventListener('click', closePanel);

  renderOptions();
  updateLabel();
  wrap.appendChild(btn);
  wrap.appendChild(panel);
  wrap.getValue = ()=>current;
  wrap.setValue = (v)=>{ current=v; updateLabel(); renderOptions(); };
  wrap.setOptions = (newOpts, keepValue)=>{
    opts = newOpts;
    if(!keepValue || !opts.some(o=>o.value===current)) current = opts[0] ? opts[0].value : null;
    updateLabel();
    renderOptions();
  };
  return wrap;
}

// Поле вибору дати з календарем-піднавом (той самий патерн, що й customSelect: кнопка + панель, що
// відкривається під полем). Зберігає/повертає дату рядком у форматі "ДД.ММ.РРРР" — так само, як і
// текстове поле, яке воно замінює, тож жодної міграції даних не потрібно.
function datePickerField(initialValue, onChange){
  function parseDMY(str){
    const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(String(str||'').trim());
    if(!m) return null;
    const d = new Date(Number(m[3]), Number(m[2])-1, Number(m[1]));
    return isNaN(d.getTime()) ? null : d;
  }
  function formatDMY(d){
    return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
  }
  const wrap = el(`<div style="position:relative"></div>`);
  let selectedDate = parseDMY(initialValue);
  let cursor = selectedDate
    ? { year: selectedDate.getFullYear(), month: selectedDate.getMonth() }
    : (()=>{ const t = new Date(); return { year: t.getFullYear(), month: t.getMonth() }; })();

  const btn = el(`
    <button type="button" class="w-full flex items-center justify-between" style="border-radius:10px;background:var(--card2);color:${selectedDate?'var(--text)':'var(--sub)'};border:1px solid rgba(47,65,114,.25);padding:12px 14px;text-align:left;font-size:.9rem;font-weight:600">
      <span data-label>${selectedDate ? formatDMY(selectedDate) : 'Оберіть дату'}</span>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--sub)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-left:8px"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    </button>
  `);
  const labelSpan = btn.querySelector('[data-label]');
  const panel = el(`
    <div style="position:absolute; left:0; right:0; top:calc(100% + 8px); z-index:60; background:var(--card2); border:1px solid rgba(47,65,114,.14); border-radius:16px; box-shadow:0 16px 40px rgba(40,60,110,.20); padding:10px; display:none;"></div>
  `);

  function renderCalendar(){
    panel.innerHTML = '';
    const nav = el(`
      <div class="flex items-center justify-between mb-2">
        <button type="button" data-prev class="navicon-btn" style="width:28px;height:28px;background:var(--card3)">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="font-semibold text-sm">${SCHEDULE_MONTH_NAMES[cursor.month]} ${cursor.year}</div>
        <button type="button" data-next class="navicon-btn" style="width:28px;height:28px;background:var(--card3)">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    `);
    const prevBtn = nav.querySelector('[data-prev]');
    const nextBtn = nav.querySelector('[data-next]');
    [prevBtn, nextBtn].forEach(b=> b.addEventListener('mousedown', e=>e.preventDefault()));
    prevBtn.onclick = (e)=>{ e.stopPropagation(); cursor = cursor.month===0 ? {year:cursor.year-1, month:11} : {year:cursor.year, month:cursor.month-1}; renderCalendar(); };
    nextBtn.onclick = (e)=>{ e.stopPropagation(); cursor = cursor.month===11 ? {year:cursor.year+1, month:0} : {year:cursor.year, month:cursor.month+1}; renderCalendar(); };
    panel.appendChild(nav);

    const weekHead = el(`<div class="grid grid-cols-7 gap-1 mb-1"></div>`);
    SCHEDULE_WEEKDAY_LABELS.forEach(lbl=> weekHead.appendChild(el(`<div class="sub text-center" style="font-size:.65rem">${lbl}</div>`)));
    panel.appendChild(weekHead);

    const first = new Date(cursor.year, cursor.month, 1);
    const startOffset = (first.getDay()+6)%7; // Monday-first grid, як і в «Графіку змін»
    const gridStart = new Date(cursor.year, cursor.month, 1-startOffset);
    const todayKey = localDateKey(new Date());
    const selKey = selectedDate ? localDateKey(selectedDate) : null;

    const grid = el(`<div class="grid grid-cols-7 gap-1"></div>`);
    for(let i=0;i<42;i++){
      const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
      const key = localDateKey(d);
      const inMonth = d.getMonth()===cursor.month;
      const isToday = key===todayKey;
      const isSel = key===selKey;
      const cell = el(`
        <div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:8px;font-size:.78rem;font-weight:${(isToday||isSel)?'700':'500'};${inMonth?'':'opacity:.3'};${isSel?'background:var(--accent);color:#fff':(isToday?'border:1.5px solid var(--accent)':'')}">${d.getDate()}</div>
      `);
      cell.addEventListener('mousedown', e=>e.preventDefault());
      cell.onclick = (e)=>{
        e.stopPropagation();
        selectedDate = d;
        labelSpan.textContent = formatDMY(d);
        btn.style.color = 'var(--text)';
        closePanel();
        if(onChange) onChange(formatDMY(d));
      };
      grid.appendChild(cell);
    }
    panel.appendChild(grid);

    const clearBtn = el(`<button type="button" class="w-full text-xs font-semibold mt-2" style="background:none;border:none;color:var(--sub);padding:6px 0;cursor:pointer">Очистити дату</button>`);
    clearBtn.addEventListener('mousedown', e=>e.preventDefault());
    clearBtn.onclick = (e)=>{
      e.stopPropagation();
      selectedDate = null;
      labelSpan.textContent = 'Оберіть дату';
      btn.style.color = 'var(--sub)';
      closePanel();
      if(onChange) onChange('');
    };
    panel.appendChild(clearBtn);
  }

  let openState = false;
  function openPanel(){ openState = true; renderCalendar(); panel.style.display = 'block'; }
  function closePanel(){ openState = false; panel.style.display = 'none'; }
  btn.onclick = (e)=>{
    e.stopPropagation();
    openState ? closePanel() : openPanel();
  };
  document.addEventListener('click', closePanel);

  wrap.appendChild(btn);
  wrap.appendChild(panel);
  wrap.getValue = ()=> selectedDate ? formatDMY(selectedDate) : '';
  return wrap;
}

// Icon-on-top, small-label-below action button (e.g. "Додати склад") — a standalone tap target,
// not part of a mutually-exclusive group.
function iconActionBtn(iconKey, label, onClick){

// Icon-on-top, small-label-below tab item for a switcher (Залишки/Історія/…) — highlights the
// icon's background when active, per the reference layout (icon centered above a small regular label).

// Segmented pill picker for a small set of mutually-exclusive choices (category, type, unit, etc.)
// options: [[key,label,icon?], ...]. Returns the row element with .setActive(key)/.getActive() helpers.
function segmentedPicker(options, activeKey, onChange){
  const row = el(`<div class="flex gap-2 mb-4" style="background:var(--card3);border-radius:999px;padding:4px"></div>`);
  const btns = {};
  function paint(){
    Object.entries(btns).forEach(([k,btn])=>{
      const on = k===activeKey;
      btn.style.background = on ? 'var(--accent)' : 'transparent';
      btn.style.color = on ? '#fff' : 'var(--sub)';
      btn.style.boxShadow = on ? '0 4px 12px rgba(47,65,114,.30)' : 'none';
    });
  }
  options.forEach(opt=>{
    const key = opt[0], label = opt[1], icon = opt[2];
    const b = el(`<button type="button" class="flex-1 flex items-center justify-center gap-1.5 py-2.5" style="border-radius:999px;font-weight:700;font-size:.85rem;border:none;transition:background .15s,color .15s,box-shadow .15s">${icon?`<span style="font-size:1rem;line-height:1">${icon}</span>`:''}<span>${escapeHtml(label)}</span></button>`);
    b.onclick = ()=>{ activeKey = key; paint(); if(onChange) onChange(key); };
    btns[key] = b;
    row.appendChild(b);
  });
  paint();
  row.setActive = (k)=>{ activeKey = k; paint(); };
  row.getActive = ()=> activeKey;
  return row;
}

// Таби категорій + пошук — спільний патерн для «Нового замовлення» та «Меню і цін»: за замовчуванням
// жоден таб не активний (показуємо все, відсортоване за алфавітом), клік на таб фільтрує список до
// цієї категорії, повторний клік знову знімає фільтр.
function categoryTabsAndSearch(activeKey, onFilterChange, searchValue, onSearchInput, searchPlaceholder){
  const wrap = el(`<div></div>`);
  const row = el(`<div class="flex gap-2 mb-3" style="background:var(--card3);border-radius:999px;padding:4px"></div>`);
  const btns = {};
  function paint(){
    Object.entries(btns).forEach(([k,btn])=>{
      const on = k===activeKey;
      btn.style.background = on ? 'var(--accent)' : 'transparent';
      btn.style.color = on ? '#fff' : 'var(--sub)';
      btn.style.boxShadow = on ? '0 4px 12px rgba(47,65,114,.30)' : 'none';
    });
  }
  [['meat',"М'ясо з Техасу"],['fastfood','Фастфуд']].forEach(([key,label])=>{
    const b = el(`<button type="button" class="flex-1" style="border-radius:999px;font-weight:700;font-size:.85rem;padding:10px 6px;border:none;transition:background .15s,color .15s,box-shadow .15s">${escapeHtml(label)}</button>`);
    b.onclick = ()=>{
      activeKey = (activeKey===key) ? null : key;
      paint();
      if(onFilterChange) onFilterChange(activeKey);
    };
    btns[key] = b;
    row.appendChild(b);
  });
  paint();
  wrap.appendChild(row);

  const searchWrap = el(`<div class="mb-3" style="position:relative"></div>`);
  const searchInput = el(`<input type="text" class="w-full py-2.5 px-3" style="border-radius:14px;background:var(--card3);color:var(--text);border:none" placeholder="${escapeHtml(searchPlaceholder||'Пошук')}">`);
  searchInput.value = searchValue || '';
  searchInput.addEventListener('input', e=>{ if(onSearchInput) onSearchInput(e.target.value); });
  searchWrap.appendChild(searchInput);
  wrap.appendChild(searchWrap);

  return wrap;
}

const ICONS = {

function loginView(){
  const wrap = el(`
    <div class="flex flex-col justify-center px-2" style="min-height:calc(100vh - 3rem);padding-top:15vh">
      <div class="eyebrow mb-3">Склад · Облік</div>
      <div class="mb-2" style="font-size:2rem;line-height:1.2;font-weight:800">Доброго дня, для початку робочого дня — авторизуйтесь.</div>
      <div class="sub text-sm mb-6">Введіть свій пін-код</div>
      <input id="pinInput" type="password" inputmode="numeric" maxlength="6" class="pin-input card w-full py-4 mb-4 outline-none">
      <button id="loginBtn" class="w-full btn-solid py-3">Увійти</button>
      <div id="loginErr" class="text-center text-sm mt-3" style="color:var(--danger)"></div>
    </div>
  `);
  const input = wrap.querySelector('#pinInput');
  const err = wrap.querySelector('#loginErr');
  const btn = wrap.querySelector('#loginBtn');
  let busy = false;
  const doLogin = async ()=>{
    if(busy) return;
    busy = true;
    err.textContent = '';
    const prevLabel = btn.textContent;
    btn.textContent = 'Заходимо…';
    btn.disabled = true;
    let ok = false;
    try{
      ok = await login(input.value.trim());
    }catch(e){
      ok = false;
    }
    if(!ok){
      btn.textContent = prevLabel;
      btn.disabled = false;
      busy = false;
      err.textContent = lastSyncError && !authToken ? "Немає з'єднання з сервером. Перевірте інтернет і спробуйте ще раз." : 'Невірний пін-код';
      input.value=''; input.focus();
    }
    // При успіху render() всередині login() вже замінив увесь екран — тут більше нічого робити не треба.
  };
  wrap.querySelector('#loginBtn').onclick = doLogin;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  setTimeout(()=>input.focus(), 50);
  return wrap;
}

// Where a non-owner should understand themself to be working right now — cook/prep always work off
// the central "База" склад regardless of the schedule; cashier follows activeLocationId, which login()
// has already resolved against today's Графік змін (falling back to their default точка).
function currentWorkplaceLabel(u){
  if(!u || u.role==='owner') return '';
  if(u.role==='cook' || u.role==='prep'){
    return (state.warehouses.find(w=>w.id===baseWarehouseId())||{}).name || 'База';
  }
  return (state.locations.find(l=>l.id===state.activeLocationId)||{}).name || '';
}
function userInitials(name){
  const parts = String(name||'?').trim().split(/\s+/);
  return ((parts[0]||'?')[0] + (parts[1]?parts[1][0]:'')).toUpperCase();
}
function header(){
  const u = curUser();
  const notifCount = isOwner() ? computeNotifications().length : 0;
  const workplace = currentWorkplaceLabel(u);
  const h = el(`
    <div class="flex items-center justify-between py-3 mb-2">
      <div class="flex items-center gap-3" style="min-width:0">
        <div class="avatar">${escapeHtml(userInitials(u.name))}</div>
        <div style="min-width:0">
          <div class="sub" style="font-size:.74rem">З поверненням 👋</div>
          <div style="font-size:1.12rem;font-weight:700;line-height:1.2;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(u.name)}</div>
          ${!isOwner() ? `<div class="sub" style="font-size:.7rem">${escapeHtml(roleLabel(u.role))}${workplace ? ' · '+escapeHtml(workplace) : ''}</div>` : ''}
        </div>
      </div>
      <div class="flex items-center gap-2">
        ${isOwner() ? `
        <button id="bellBtn" class="navicon-btn" style="background:rgba(255,255,255,.85);border:1px solid var(--line);position:relative;width:42px;height:42px">
          ${ICONS.bell}
          ${notifCount>0 ? `<span style="position:absolute;top:1px;right:1px;background:var(--danger);color:#fff;font-size:.6rem;font-weight:800;min-width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px">${notifCount}</span>` : ''}
        </button>
        ` : ''}
        <button id="logoutBtn" class="navicon-btn" aria-label="Вийти" style="background:rgba(255,255,255,.85);border:1px solid var(--line);width:42px;height:42px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </div>
  `);
  h.querySelectorAll('.navicon-btn svg').forEach(sv=>{ sv.style.width='18px'; sv.style.height='18px'; sv.style.stroke='var(--sub)'; });
  if(isOwner()) h.querySelector('#bellBtn').onclick = ()=>{ view='notifications'; render(); };
  h.querySelector('#logoutBtn').onclick = logout;
  return h;

function tabbar(){
  const u = curUser();
  const isCook = u && u.role==='cook';
  const isPrep = u && u.role==='prep';
  const isCashier = u && u.role==='cashier';
  const tabs = isOwner()
    ? [['dashboard','dashboard'],['purchase','purchase'],['stock','stock'],['settings','settings']]
    : (isCook ? [['stock','stock'],['productionList','flame']]
      : (isPrep ? [['prepDashboard','dashboard'],['productionStart','flame'],['prepTransferLocations','transfer'],['myHistory','history']]
        : (isCashier ? [['stock','dashboard'],['purchase','purchase'],['scheduleCalendar','calendar'],['cashierRequest','transfer'],['myHistory','history']]
          : [['stock','stock'],['history','history']])));
  let activeKey = (view==='menu' || view==='staffEdit' || view==='locationEdit' || view==='locationAdd' || view==='productAdd' || view==='ingredients' || view==='ingredientAdd' || view==='ingredientPrepare' || view==='productionLinks' || view==='checkbox' || view==='glovo' || view==='glovoAdd' || view==='analytics' || view==='auditLog' || view==='shiftRatings' || view==='scheduleCalendar' || view==='scheduleDay' || view==='scheduleLocation' || view==='tasks' || view==='taskAdd') ? 'settings' : view;
  if(view==='stockItemAdd' || view==='warehouseAdd' || view==='warehouseEdit' || view==='inventoryStart' || view==='inventoryDetail' || view==='writeOffStart' || view==='transferStart' || view==='transferReceive' || view==='productionStart' || view==='ingredientPrepare' || view==='productionDetail' || view==='prepTransferLocations' || view==='locationTransferNeeds') activeKey = isCook ? 'productionList' : 'stock';
  if(view==='shiftAccept' || view==='notifications' || view==='myRating') activeKey = homeView();
  if(!isOwner() && (view==='transferList')) activeKey = 'stock';
  if(!isOwner() && (view==='ingredients' || view==='ingredientAdd' || view==='ingredientPrepare')) activeKey = 'stock';
  // Касир має власну вкладку «Графік змін» — підсвічуємо саме її, а не Дашборд.
  if(isCashier && (view==='scheduleCalendar' || view==='scheduleDay' || view==='scheduleLocation')) activeKey = 'scheduleCalendar';
  // Заготівельник має власні вкладки замість «Склад»/«Історія» — підсвічуємо саме їх.
  if(isPrep){
    if(view==='productionStart' || view==='productionDetail') activeKey = 'productionStart';
    else if(view==='prepTransferLocations' || view==='locationTransferNeeds' || (view==='transferStart' && transferReturnTo==='locationTransferNeeds')) activeKey = 'prepTransferLocations';
    else if(view==='myHistory') activeKey = 'myHistory';
    else if(view==='ingredients' || view==='ingredientAdd' || view==='ingredientPrepare') activeKey = 'prepDashboard';
    else if(view==='prepDashboard') activeKey = 'prepDashboard';
  }
  // У власника «Поставки» тепер живуть у Налаштуваннях, а «Нова готовка» — теж там.
  if(isOwner() && (view==='transferList' || view==='transferReceive')) activeKey = 'settings';
  if(isOwner() && (view==='productionStart' || view==='productionDetail')) activeKey = 'settings';
  if(view==='locationStock' || view==='receipts') activeKey = 'dashboard';
  if(!isOwner() && (view==='glovo' || view==='glovoAdd')) activeKey = 'stock';
  // Власник відкрив поставку прямо зі "Складу точки" (картка в Аналітиці) — підсвічуємо той самий таб.
  if(view==='transferStart' && transferReturnTo==='locationStock') activeKey = 'dashboard';
  // "Закупівля" (нове поповнення складу закупівлею) відкрита з Закупівель, або, у касира, з власної вкладки «Закупка».
  if(view==='purchaseCreate') activeKey = 'purchase';
  if(isOwner() && (view==='prepTransferLocations' || view==='locationTransferNeeds' || (view==='transferStart' && transferReturnTo==='locationTransferNeeds'))) activeKey = 'purchase';
  const bar = el(`<div class="navbar-pill navbar-tabs"></div>`);
  const LABELS = { dashboard:'Головна', purchase:'Закупівлі', stock:'Склад', settings:'Ще', productionList:'Готовка',
    prepDashboard:'Головна', productionStart:'Готовка', prepTransferLocations:'Поставки', myHistory:'Історія',
    scheduleCalendar:'Графік', cashierRequest:'Запит', history:'Історія' };
  const canSell = false; // замовлення з застосунку створювати не можна — продажі лише з чеків Checkbox
  const fabAt = canSell ? Math.floor(tabs.length/2) : -1;
  tabs.forEach(([key,icon],idx)=>{
    if(idx===fabAt){
      const fab = el(`<button class="navfab" aria-label="Нове замовлення">${ICONS.plus}</button>`);
      fab.onclick = ()=> startCreateOrder();
      bar.appendChild(fab);
    }
    const label = (isCashier && key==='stock') ? 'Головна' : (LABELS[key]||'');
    const b = el(`<button class="navicon-btn navitem ${activeKey===key?'active':''}"><span class="ico">${ICONS[icon]}</span><span class="lbl">${escapeHtml(label)}</span></button>`);
    // Касирова вкладка «Закупка» одразу веде у форму закупівлі, але без відкритої зміни зараховувати
    // нема куди — той самий захист, що й раніше був на кнопці «+ Закупівля».
    if(isCashier && key==='purchase') b.onclick = ()=> startPurchaseFlow();
    else b.onclick = ()=>{ view=key; render(); };
    bar.appendChild(b);
  });
  const wrap = el(`<div></div>`);
  wrap.appendChild(bar);
  return wrap;
}

          </div>
          <div class="text-sm font-bold text-right" style="color:${mColor}">${r.margin>=0?'+':''}${fmt(r.margin)} ₴<div class="sub text-xs font-normal">${fmt(r.marginPct)}%</div></div>

  } else {
    wrap.appendChild(el(`
      <div class="card p-3 mb-2">
        <div class="sub text-xs">Середня усушка (${shr.count} позицій)</div>
        <div class="text-lg font-bold">${fmt(shr.avg)}%</div>
      </div>
    `));
    wrap.appendChild(el(`<div class="sub text-xs mb-1">Найбільша усушка:</div>`));
    shr.rows.forEach(r=>{
      wrap.appendChild(el(`
        <div class="card p-3 mb-2 flex items-center justify-between gap-3">
          <div>
            <div class="font-semibold">${escapeHtml(r.inputName)} → ${escapeHtml(r.outputName)}</div>
            <div class="sub text-xs">${escapeHtml(r.ts)} · ${escapeHtml(r.employeeName)}</div>
          </div>
          <div class="text-sm font-bold" style="color:${r.shrinkagePercent>15?'var(--danger)':'var(--text)'}">${fmt(r.shrinkagePercent)}%</div>
        </div>
      `));

  // --- Недостачі за період ---
  wrap.appendChild(el(`<div class="font-bold mb-2 mt-2" style="font-size:.95rem">Недостачі за період</div>`));
  const sh = shortageReport(analyticsPeriod);
  wrap.appendChild(el(`
    <div class="card p-3 mb-2">
      <div class="flex items-center justify-between text-sm">
        <span class="sub">Списання (з причиною)</span><span class="font-bold" style="color:var(--danger)">-${fmt(sh.writeOffsTotal)} ₴</span>
      </div>
      <div class="flex items-center justify-between text-sm mt-1">
        <span class="sub">Недостача при інвентаризації</span><span class="font-bold" style="color:var(--danger)">-${fmt(sh.inventoryShortfallTotal)} ₴</span>
      </div>
      <div class="flex items-center justify-between text-sm mt-2" style="border-top:1px solid rgba(47,65,114,.14);padding-top:8px">
        <span class="font-semibold">Разом</span><span class="font-bold" style="color:var(--danger)">-${fmt(sh.total)} ₴</span>
      </div>

  // --- Теоретичний vs фактичний розхід ---
  wrap.appendChild(el(`<div class="font-bold mb-2 mt-2" style="font-size:.95rem">Теоретичний vs фактичний розхід</div>`));
  const tva = theoreticalVsActualReport(analyticsPeriod);
  if(!tva.hasInventoryData){
    wrap.appendChild(el(`<div class="sub text-sm py-3 mb-4">Потрібна хоча б одна інвентаризація готових інгредієнтів у цьому періоді, щоб порівняти теоретичний розхід (за техкартами) з фактичним</div>`));
  } else if(tva.rows.length===0){
    wrap.appendChild(el(`<div class="sub text-sm py-3 mb-4">Розбіжностей не знайдено</div>`));
  } else {
    tva.rows.forEach(r=>{
      // Positive variance = more was actually used than the техкарта accounts for (waste/leakage) —
      // bad for the owner, so it's colored as a warning; negative variance (used less) is colored ok.
      const color = r.variance>0 ? 'var(--danger)' : (r.variance<0 ? 'var(--accent2)' : 'var(--sub)');
      const pctLabel = r.variancePct===null ? '' : ` (${r.variancePct>0?'+':''}${fmt(r.variancePct)}%)`;
      wrap.appendChild(el(`
        <div class="card p-3 mb-2 flex items-center justify-between gap-3">
          <div>
            <div class="font-semibold">${escapeHtml(r.name)}</div>
            <div class="sub text-xs">Теоретично: ${fmt(r.theoretical)} ${escapeHtml(r.unit)} · Фактично: ${fmt(r.actual)} ${escapeHtml(r.unit)}</div>
          </div>
          <div class="text-sm font-bold text-right" style="color:${color}">${r.variance>0?'+':''}${fmt(r.variance)} ${escapeHtml(r.unit)}${pctLabel}<div class="sub text-xs font-normal">${r.varianceValue>0?'+':''}${fmt(r.varianceValue)} ₴</div></div>
        </div>
      `));
    });
  }

  return wrap;
}

// Список того, що є на складі конкретної точки (за натисканням на картку в Аналітиці). Склад
// точки визначається за тим самим id, що й локація (так само, як при першій міграції складів).
// Першим у списку — "Необхідно поповнення" (залишок <= мінімуму), потім повний перелік з залишком.
function locationStockView(){
  const loc = state.locations.find(l=>l.id===viewingLocationId) || state.locations[0];
  const wrap = el(`<div></div>`);
  const topBar = el(`
    <div class="flex items-center gap-3 mb-4">
      <button id="lsBack" class="navicon-btn" style="background:var(--card3)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="font-bold" style="font-size:1.1rem">${escapeHtml(loc ? loc.name : '')}</div>
    </div>
  `);
  topBar.querySelector('#lsBack').onclick = ()=>{ viewingLocationId=null; view='dashboard'; render(); };
  wrap.appendChild(topBar);

  if(!loc){
    wrap.appendChild(el(`<div class="sub text-center py-10">Локацію не знайдено</div>`));
    return wrap;
  }

  const locWh = warehouseForLocationOrNull(loc.id);
  if(!locWh){
    wrap.appendChild(el(`<div class="card p-3 mb-3 text-sm">Для цієї точки не знайдено склад. Відкрийте потрібний склад (Склад → редагування) і виберіть поле «Склад точки».</div>`));
    return wrap;
  }
  // Власник може прямо звідси відправити поставку на цю точку (кнопка нагорі).
  if(state.warehouses.length>1){
    const createBtn = el(`<button class="w-full btn-solid py-3 mb-4">Створити поставку</button>`);
    createBtn.onclick = ()=>{ transferReturnTo = 'locationStock'; view='transferStart'; render(); };
    wrap.appendChild(createBtn);
  }
  const items = state.stockItems.filter(i=>i.warehouseId===locWh.id);

  function itemRow(item){
    const isLow = item.qty <= item.min;
    return el(`
      <div class="card p-3 mb-2">
        <div class="font-semibold">${escapeHtml(item.name)}</div>
        <div class="text-sm ${isLow?'low font-semibold':'sub'}">${fmt(item.qty)} ${escapeHtml(item.unit)} ${isLow?'· мало!':''}</div>
        <div class="sub text-xs mt-0.5">мін ${fmt(item.min)} ${escapeHtml(item.unit)}</div>
      </div>
    `);
  }

  if(items.length===0){
    wrap.appendChild(el(`<div class="sub text-sm mb-5">На цьому складі поки немає продуктів</div>`));
  } else {
    const low = lowStockFor(locWh.id).slice().sort((a,b)=>a.name.localeCompare(b.name,'uk'));
    wrap.appendChild(el(`<div class="font-bold mb-2" style="font-size:.95rem; color:var(--danger)">Необхідно поповнення</div>`));
    if(low.length===0){
      wrap.appendChild(el(`<div class="sub text-sm mb-5">Дефіциту немає</div>`));
    } else {
      const lowWrap = el(`<div class="mb-5"></div>`);
      low.forEach(item=> lowWrap.appendChild(itemRow(item)));
      wrap.appendChild(lowWrap);
    }

    wrap.appendChild(el(`<div class="font-bold mb-2" style="font-size:.95rem">Усі залишки</div>`));
    items.slice().sort((a,b)=>a.name.localeCompare(b.name,'uk')).forEach(item=> wrap.appendChild(itemRow(item)));
  }

  return wrap;
}

      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--sub)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>`);

  if(state.locations.length===0){

      <div class="card p-3 mb-2 flex items-center justify-between" style="cursor:pointer">

// Що зараз є на складі конкретної точки (готові інгредієнти + продукти), "Необхідно поповнення" першим
// (немає або нижче мінімуму), і кнопка "Створити поставку", яка веде на форму вже з цією точкою як "Куди".
function locationTransferNeedsView(){
  const loc = state.locations.find(l=>l.id===viewingLocationId) || state.locations[0];
  const wrap = el(`<div></div>`);
  const topBar = el(`
    <div class="flex items-center gap-3 mb-4">
      <button id="ltnBack" class="navicon-btn" style="background:var(--card3)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="font-bold" style="font-size:1.1rem">${escapeHtml(loc ? loc.name : '')}</div>
    </div>
  `);
  topBar.querySelector('#ltnBack').onclick = ()=>{ view='prepTransferLocations'; render(); };
  wrap.appendChild(topBar);

  if(!loc){
    wrap.appendChild(el(`<div class="sub text-center py-10">Точку не знайдено</div>`));
    return wrap;
  }
  const wh = warehouseForLocationOrNull(loc.id);
  if(!wh){
    wrap.appendChild(el(`<div class="card p-3 text-sm">Для цієї точки не знайдено склад, тому поставку відправити нікуди. Власнику: відкрийте склад точки (Склад → редагування) і виберіть поле «Склад точки».</div>`));
    return wrap;
  }

  const items = transferCatalog(wh.id).concat(
    // позиції, яких на складі точки ще немає взагалі, але вони є в довіднику рецептів/на Базі
    []);
  // Також показуємо сирі продукти/інгредієнти, що є на складі-відправнику, а на точці ще не заведені.
  const baseId = state.defaultWarehouseId || baseWarehouseId();
  const known = new Set(items.map(c=>lineKey(c.kind==='ingredient' ? {kind:'ingredient', ingredientId:c.ing.id} : {kind:'product', stockName:c.name})));
  if(baseId && baseId!==wh.id){
    transferCatalog(baseId).forEach(c=>{
      const k = lineKey(c.kind==='ingredient' ? {kind:'ingredient', ingredientId:c.ing.id} : {kind:'product', stockName:c.name});
      if(!known.has(k)){ known.add(k); items.push(c); }
    });
  }
  if(items.length===0){
    wrap.appendChild(el(`<div class="sub text-sm py-6 text-center">Поки немає чого відправляти.</div>`));
    return wrap;
  }

  const createBtn = el(`<button class="w-full btn-solid py-3 mb-4">Створити поставку</button>`);
  createBtn.onclick = ()=>{ transferReturnTo = 'locationTransferNeeds'; view='transferStart'; render(); };
  wrap.appendChild(createBtn);

  const incoming = state.transfers.filter(t=>t.status==='SENT' && t.toWarehouseId===wh.id);
  if(incoming.length>0){
    wrap.appendChild(el(`<div class="card p-3 mb-3" style="background:rgba(232,163,23,.14);border:1px solid rgba(232,163,23,.35)"><div class="font-semibold text-sm">В дорозі на точку: ${incoming.length}</div><div class="sub text-xs mt-0.5">${incoming.map(t=>t.lines.map(l=>escapeHtml(l.name)+' '+fmt(l.sentQty)+' '+escapeHtml(l.unit)).join(', ')).join(' · ')}</div></div>`));
  }

  function ingRow(c, qty, min){
    const low = qty<=min;
    return el(`
      <div class="card p-3 mb-2">
        <div class="font-semibold">${escapeHtml(c.name)}</div>
        <div class="text-sm ${low?'low font-semibold':'sub'}">${fmt(qty)} ${escapeHtml(c.unit)} ${qty<=0?'· немає!':(low?'· мало!':'')}</div>
        ${min>0?`<div class="sub text-xs mt-0.5">мін ${fmt(min)} ${escapeHtml(c.unit)}</div>`:''}
      </div>
    `);
  }
  const withQty = items.map(c=>({ c, qty: catalogQty(c, wh.id), min: catalogMin(c, wh.id) }));
  const low = withQty.filter(x=>x.qty<=x.min).sort((a,b)=>a.c.name.localeCompare(b.c.name,'uk'));

  wrap.appendChild(el(`<div class="font-bold mb-2" style="font-size:.95rem; color:var(--danger)">Необхідно поповнення</div>`));
  if(low.length===0){
    wrap.appendChild(el(`<div class="sub text-sm mb-5">Дефіциту немає</div>`));
  } else {
    const lowWrap = el(`<div class="mb-5"></div>`);
    low.forEach(x=> lowWrap.appendChild(ingRow(x.c, x.qty, x.min)));
    wrap.appendChild(lowWrap);
  }

  wrap.appendChild(el(`<div class="font-bold mb-2" style="font-size:.95rem">Усі залишки</div>`));
  withQty.slice().sort((a,b)=>a.c.name.localeCompare(b.c.name,'uk')).forEach(x=> wrap.appendChild(ingRow(x.c, x.qty, x.min)));

  return wrap;
}

    return;

function cartTotal(){ return orderDraft.cart.reduce((s,l)=>s+l.price*l.qty,0); }
function cartCount(){ return orderDraft.cart.reduce((s,l)=>s+l.qty,0); }
function addToCart(product, modifierOption, picks, comboSel){
  // Кожне замовлення ведеться в одній категорії (на це зав'язані зарплата й каса точки), тож перший
  // доданий товар фіксує категорію замовлення; товар іншої категорії, поки кошик не порожній,
  // пропонуємо оформити окремим замовленням.
  if(orderDraft.cart.length>0 && orderDraft.category && orderDraft.category!==product.category){
    appAlert('У цьому замовленні вже є товари з категорії «'+(orderDraft.category==='fastfood'?'Фастфуд':"М'ясо з Техасу")+'». Завершіть його і створіть нове для іншої категорії.');
    return;
  }
  orderDraft.category = product.category;
  const modId = modifierOption ? modifierOption.id : null;
  picks = picks || []; // [{group, option}]
  comboSel = comboSel || []; // [{slot, product, picks:[{group,option}]}]
  const optKey = picks.map(x=>x.option.id).sort().join(',') + '|' + comboSel.map(c=>c.slot.id+'='+c.product.id+':'+c.picks.map(x=>x.option.id).sort().join(',')).join(';');
  const existing = orderDraft.cart.find(l=>l.productId===product.id && (l.modifierId||null)===modId && (l.optionKey||'')===optKey);
  if(existing){ existing.qty++; }
  else{
    orderDraft.cart.push({
      id: uid(), productId: product.id, name: product.name,
      price: product.price + picks.reduce((s,x)=>s+(Number(x.option.priceDelta)||0),0) + comboSel.reduce((s,c)=>s+c.picks.reduce((s2,x)=>s2+(Number(x.option.priceDelta)||0),0),0), qty: 1,
      modifierId: modId,
      modifierName: modifierOption ? modifierOption.name : ((comboSel.length||picks.length) ? comboSel.map(c=>c.product.name+(c.picks.length?' ('+c.picks.map(x=>x.option.name).join(', ')+')':'')).concat(picks.map(x=>x.option.name)).join(' + ') : null),
      comboSelections: comboSel.map(c=>({ slotId:c.slot.id, slotLabel:c.slot.label, productId:c.product.id, name:c.product.name,
        productType:c.product.type, recipeSnapshot: c.product.type==='dish' ? (c.product.ingredients||[]).map(i=>({...i})) : [],
        selectedOptions: c.picks.map(x=>({ groupId:x.group.id, groupLabel:x.group.label, optionId:x.option.id, name:x.option.name,
          kind:x.option.kind||'none', refId:x.option.refId||null, productName:x.option.productName||null, unit:x.option.unit||'',
          amount:Number(x.option.amount)||0, priceDelta:Number(x.option.priceDelta)||0 })) })),
      optionsCostSnapshot: picks.reduce((s,x)=>s+optionCostPerUnit(x.option),0),
      optionKey: optKey,
      selectedOptions: picks.map(x=>({ groupId:x.group.id, groupLabel:x.group.label, optionId:x.option.id, name:x.option.name,
        kind:x.option.kind||'none', refId:x.option.refId||null, productName:x.option.productName||null, unit:x.option.unit||'',
        amount:Number(x.option.amount)||0, priceDelta:Number(x.option.priceDelta)||0 })),
      // Snapshot the техкарта (product type + its recipe) as it is right now, so this sale always
      // deducts and records what was actually used, even if the master recipe changes later.
      productType: product.type,
      recipeSnapshot: product.type==='dish' ? (product.ingredients||[]).map(i=>({...i})) : [],
      // Snapshot cost too, so P&L analytics stays accurate even if the product is edited/deleted later.
      costPriceSnapshot: product.type==='combo'
        ? comboSel.reduce((s,c)=>s + (Number(c.product.costPrice)||0) + c.picks.reduce((s2,x)=>s2+optionCostPerUnit(x.option),0), 0) + picks.reduce((s,x)=>s+optionCostPerUnit(x.option),0)
        : (Number(product.costPrice)||0) + picks.reduce((s,x)=>s+optionCostPerUnit(x.option),0)
    });
  }
  expandedProductId = null;
  render();
}
// Warehouse a sale at this location deducts stock from — warehouses were originally seeded 1:1 with
// locations, so the warehouse of the same id is that point's own stock.
// Склад, з якого списуються продажі точки. Пріоритет: явна прив'язка (склад → «Локація» у редагуванні складу),
// потім збіг id (старі дані), потім збіг назви склад↔точка («ЦУМ» = «ЦУМ»), і лише тоді — «База».
function warehouseForLocationOrNull(locationId){
  const whs = state.warehouses || [];
  let wh = whs.find(w=>w.locationId && w.locationId===locationId);
  if(!wh) wh = whs.find(w=>w.id===locationId);
  const loc = (state.locations||[]).find(l=>l.id===locationId);
  const norm = x=>String(x||'').trim().toLowerCase();
  if(!wh && loc){
    const ln = norm(loc.name);
    wh = whs.find(w=>!w.locationId && norm(w.name)===ln)
      || (ln ? whs.find(w=>!w.locationId && norm(w.name)!=='база' && (norm(w.name).includes(ln) || ln.includes(norm(w.name)))) : null);
  }
  return wh || null;
}
function warehouseForLocation(locationId){
  const wh = warehouseForLocationOrNull(locationId);
  return wh ? wh.id : baseWarehouseId();
}
// Sums how much of each recipe ingredient this cart needs (across all dish lines, by qty), and
// separately which raw "товар"-type lines need a matching-name product decremented 1:1.
function cartConsumption(cart){
  const ingredientNeeds = new Map(); // ingredientId -> {name, unit, amount}
  const productNeeds = new Map(); // name -> {unit, amount}
  const addIng = (id, name, unit, amount)=>{
    const cur = ingredientNeeds.get(id) || { name, unit, amount: 0 };
    cur.amount += amount; ingredientNeeds.set(id, cur);
  };
  const addProd = (name, unit, amount)=>{
    const cur = productNeeds.get(name) || { unit: unit||null, amount: 0 };
    cur.amount += amount; productNeeds.set(name, cur);
  };
  // Обрані опції (соус, напій…) теж списують зі складу: рецепт → інгредієнт, продукт → товар.
  const addOptions = (opts, qty)=>{
    (opts||[]).forEach(o=>{
      if(!(o.amount>0)) return;
      if(o.kind==='ingredient' && o.refId) addIng(o.refId, o.name, o.unit, o.amount*qty);
      else if(o.kind==='product' && o.productName) addProd(o.productName, o.unit, o.amount*qty);
    });
  };
  // Одна позиція (страва чи сирий товар) зі своєю кількістю й опціями.
  const addItem = (type, name, recipe, opts, qty)=>{
    if(type==='dish') (recipe||[]).forEach(comp=> addIng(comp.ingredientId, comp.name, comp.unit, comp.amount*qty));
    else addProd(name, null, qty);
    addOptions(opts, qty);
  };
  cart.forEach(line=>{
    if(line.productType==='combo'){
      // Комбо: списуємо те, що обрано в кожному слоті (разом з опціями цих позицій), + власні опції комбо.
      (line.comboSelections||[]).forEach(c=> addItem(c.productType, c.name, c.recipeSnapshot, c.selectedOptions, line.qty));
      addOptions(line.selectedOptions, line.qty);
    } else {
      addItem(line.productType, line.name, line.recipeSnapshot, line.selectedOptions, line.qty);
    }
  });
  return { ingredientNeeds, productNeeds };
}
// Applies the deduction for a completed sale at warehouseId, clamped at 0 (never goes negative —
// a shortfall was already confirmed with the cashier before this runs). No save/render (caller does).
function applySaleConsumption(cart, warehouseId){
  const { ingredientNeeds, productNeeds } = cartConsumption(cart);
  ingredientNeeds.forEach((need, ingredientId)=>{
    const ing = state.recipeIngredients.find(i=>i.id===ingredientId);
    if(ing) recordIngredientChange(ing, warehouseId, -need.amount, 'Продаж');
  });
  productNeeds.forEach((need, name)=>{
    const item = state.stockItems.find(p=>p.warehouseId===warehouseId && p.name.trim().toLowerCase()===name.trim().toLowerCase());
    if(item) recordStockChange(item, -need.amount, 'Продаж');
  });
}
function changeCartQty(lineId, delta){
  const line = orderDraft.cart.find(l=>l.id===lineId);
  if(!line) return;
  line.qty += delta;
  if(line.qty<=0) orderDraft.cart = orderDraft.cart.filter(l=>l.id!==lineId);
  render();
}
function submitOrder(){
  const total = cartTotal();
  if(total<=0){ appAlert('Кошик порожній'); return; }
  const whId = warehouseForLocation(orderDraft.locationId);
  const { ingredientNeeds, productNeeds } = cartConsumption(orderDraft.cart);
  const shortfalls = [];
  ingredientNeeds.forEach((need, ingredientId)=>{
    const available = ingredientQtyAt(ingredientId, whId);
    if(need.amount>available) shortfalls.push(need.name+': потрібно '+fmt(need.amount)+' '+need.unit+', є '+fmt(available)+' '+need.unit);
  });
  productNeeds.forEach((need, name)=>{
    const item = state.stockItems.find(p=>p.warehouseId===whId && p.name.trim().toLowerCase()===name.trim().toLowerCase());
    const available = item ? item.qty : 0;
    if(need.amount>available) shortfalls.push(name+': потрібно '+fmt(need.amount)+', є '+fmt(available));
  });
  if(shortfalls.length>0 && !allowNegativeStock()){
    appConfirm('Не вистачає на складі: '+shortfalls.join('; ')+'. Все одно оформити замовлення?', ()=> finalizeOrder(whId, total));
    return;
  }
  finalizeOrder(whId, total);
}
function finalizeOrder(warehouseId, total){
  const u = curUser();
  const order = {
    id: uid(), locationId: orderDraft.locationId, category: orderDraft.category,
    items: orderDraft.cart.map(l=>({...l})), comment: orderDraft.comment||'',
    total, ts: nowStr(), tsMs: Date.now(), dateKey: dateKeyFromOffset(0), who: u?u.name:'-'
  };
  state.orders.push(order);
  state.sales.push({ id: uid(), locationId: orderDraft.locationId, category: orderDraft.category, amount: total, ts: nowStr(), tsMs: Date.now(), dateKey: dateKeyFromOffset(0), who: u?u.name:'-' });
  applySaleConsumption(orderDraft.cart, warehouseId);
  saveState();
  showToast('Замовлення оформлено: '+fmtMoney(total), 'success');
  orderDraft = null;
  view = homeView();
  render();
}

// ---- Зарплата касира за звітний період ----
// За КОЖЕН відпрацьований день періоду (11-25 чи 26-10): база — якщо на точці того дня за Графіком
// змін заплановано 2 людини, по 870 грн кожному; якщо 1 людина — 1200 грн. Бонус за м'ясо: 15 грн за
// кожну продану того дня порцію (кожен на зміні отримує ПОВНУ суму, не ділиться між ними). Бонус за
// фастфуд: денна виручка фастфуду ділиться на кількість людей на зміні того дня — і з цього середнього
// нараховується денний бонус СХОДИНКАМИ по 500 грн: 5000→1000, 5500→1500, 6000→2000, 6500→2500,
// 7000 і вище→3000 (максимум за день), нижче 5000 — бонусу немає. Всі денні суми за період складаються.
function peopleScheduledAt(locationId, dateKey){
  return scheduleEntriesForDate(dateKey).filter(e=>e.locationId===locationId).length;
}
function fastfoodBonusFor(avgPerPerson){
  if(avgPerPerson>=7000) return 3000;
  if(avgPerPerson>=6500) return 2500;
  if(avgPerPerson>=6000) return 2000;
  if(avgPerPerson>=5500) return 1500;
  if(avgPerPerson>=5000) return 1000;
  return 0;
}
// Зарплата staffId за períodKey, порахована день-за-днем від початку періоду до сьогодні (дні
// періоду, що ще не настали, просто не враховуються). Дні, коли staffId не був запланований на
// жодній точці, до підсумку не додають нічого. Завжди повертає об'єкт (з нулями, якщо не відпрацьовано
// жодного дня) — картку на дашборді ніколи не ховаємо.
function cashierSalaryForPeriod(staffId, periodKey){
  const range = periodDateRange(periodKey);
  const todayKey = localDateKey(new Date());
  const days = dateKeysInRange(range.start, range.end).filter(dk=>dk<=todayKey);

  let daysWorked=0, basePay=0, meatPortions=0, meatBonus=0, fastfoodTotal=0, fastfoodBonus=0;
  days.forEach(dateKey=>{
    const entry = scheduleEntryFor(staffId, dateKey);
    if(!entry) return;
    daysWorked++;
    const locationId = entry.locationId;
    const people = peopleScheduledAt(locationId, dateKey) || 1;
    basePay += people>=2 ? 870 : 1200;

    const dayOrders = state.orders.filter(o=>o.locationId===locationId && o.dateKey===dateKey);
    const dayMeatPortions = dayOrders.filter(o=>o.category==='meat')
      .reduce((sum,o)=> sum + (o.items||[]).reduce((s,it)=>s+(Number(it.qty)||0),0), 0);
    meatPortions += dayMeatPortions;
    meatBonus += dayMeatPortions * 15;

    const dayFastfoodTotal = dayOrders.filter(o=>o.category==='fastfood').reduce((s,o)=>s+(Number(o.total)||0),0);
    fastfoodTotal += dayFastfoodTotal;
    fastfoodBonus += fastfoodBonusFor(dayFastfoodTotal / people);
  });

  return {
    periodKey, daysWorked, basePay, meatPortions, meatBonus, fastfoodTotal, fastfoodBonus,
    total: basePay + meatBonus + fastfoodBonus
  };
}
// Каса точки за сьогодні — сумарна виручка всіх замовлень (м'ясо + фастфуд) на цій точці за
// сьогодні. Показуємо касиру лише якщо він сьогодні на зміні.
function locationCashRegisterToday(locationId){
  const todayKey = localDateKey(new Date());
  const todaysOrders = state.orders.filter(o=>o.locationId===locationId && o.dateKey===todayKey);
  const meatTotal = todaysOrders.filter(o=>o.category==='meat').reduce((s,o)=>s+(Number(o.total)||0),0);
  const fastfoodTotal = todaysOrders.filter(o=>o.category==='fastfood').reduce((s,o)=>s+(Number(o.total)||0),0);
  return { meatTotal, fastfoodTotal, total: meatTotal+fastfoodTotal, ordersCount: todaysOrders.length };
}

  view = 'purchaseCreate'; render();
