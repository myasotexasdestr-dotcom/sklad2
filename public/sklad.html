<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Склад — учёт ингредиентов</title>
<!-- Офіційний Telegram Web App SDK — має завантажуватись першим, синхронно, щоб window.Telegram.WebApp
     (ready/expand/showAlert/showConfirm тощо, які вже використовуються нижче по коду) був доступний
     одразу. Поза Telegram (звичайний браузер) просто не визначається — весь код і так перевіряє
     typeof/наявність перед викликом, тож інструмент працює і як звичайна сторінка. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Світла «скляна» тема: прохолодний блакитно-сірий фон, білі напівпрозорі картки, темно-синій акцент */
    --bg:#e9eef7; --text:#16213b; --sub:#7a8499;
    --accent:#2f4172; --accent2:#12a574; --danger:#e5484d; --ok:#12a574; --warn:#e8a317;
    --card2:rgba(255,255,255,.78); --card3:rgba(226,233,246,.85);
    --line:rgba(47,65,114,.12); --shadow:0 10px 30px rgba(40,60,110,.10);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px); background:#e9eef7;}
  body{background:radial-gradient(120% 60% at 85% -5%,#ffffff 0%,rgba(255,255,255,0) 60%),linear-gradient(180deg,#f6f8fd 0%,#e8edf7 45%,#c9d3ea 100%) fixed; letter-spacing:-.01em; color:var(--text); font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif; margin:0; min-height:100vh;}
  .card{background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(255,255,255,.62)); border-radius:28px; border:1px solid rgba(255,255,255,.85); box-shadow:var(--shadow); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);}
  .card .card{box-shadow:none; background:var(--card3);}
  .sub{color:var(--sub);}
  .low{color:var(--danger);}
  ::-webkit-scrollbar{display:none;}
  /* iOS Safari auto-zooms the whole page when a focused input's font-size is under 16px.
     Force every field to at least 16px so tapping in never triggers that zoom. */
  input, select, textarea{ font-size:16px; }
  input::placeholder, textarea::placeholder{ color:#9aa4ba; }
  .eyebrow{color:var(--sub); font-size:.72rem; font-weight:600;}

  /* solid pill — primary action per screen */
  .btn-solid{background:var(--accent); color:#fff; border-radius:999px; font-weight:700; font-size:.95rem;
    box-shadow:0 10px 22px rgba(47,65,114,.30); border:none;}
  .btn-solid:disabled{box-shadow:none;}
  /* outline pill — secondary actions */
  .btn-line{background:rgba(255,255,255,.75); border:1px solid var(--line); color:var(--text); border-radius:999px; font-weight:600; font-size:.85rem;}

  .pin-input{letter-spacing:0.6em; font-size:1.5rem; text-align:center; background:var(--card3); color:var(--text); border:none; border-radius:18px;}

  /* segmented tab switcher */
  .navtab{color:var(--sub); font-size:.85rem; font-weight:600; background:none; border:none; border-radius:999px; padding:8px 0;}
  .navtab.active{color:#fff; background:var(--accent);}

  /* icon badge — colored circle behind an icon */
  .icon-badge{width:38px; height:38px; border-radius:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .icon-badge svg{width:18px; height:18px;}

  /* плаваюча «пігулка» навігації знизу — активна вкладка = темно-синє коло з білою іконкою */
  .navbar-pill{position:fixed; left:14px; right:14px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); z-index:50; max-width:420px; margin:0 auto;
    background:rgba(255,255,255,.88); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.9); border-radius:36px; box-shadow:0 14px 36px rgba(40,60,110,.18);
    display:flex; align-items:center; justify-content:space-around; padding:8px 10px;}
  .navicon-btn{width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:none; border:none;}
  .navicon-btn svg{width:22px; height:22px; stroke:#8b96ad;}
  .navicon-btn.active{background:var(--accent); box-shadow:0 8px 18px rgba(47,65,114,.35);}
  .navicon-btn.active svg{stroke:#fff;}

  /* ---- Redesign: frosted fintech components ---- */
  .hero{position:relative; padding:18px 18px 16px; margin-bottom:22px;}
  .hero-top{display:flex; align-items:center; justify-content:space-between;}
  .hero-label{display:flex; align-items:center; gap:10px; color:var(--sub); font-size:.8rem; font-weight:500;}
  .chip-ico{width:30px; height:30px; border-radius:10px; background:rgba(47,65,114,.08); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .chip-ico svg{width:16px; height:16px; stroke:var(--accent);}
  .round-btn{width:36px; height:36px; border-radius:50%; background:var(--accent); border:none; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 16px rgba(47,65,114,.3); flex-shrink:0;}
  .round-btn svg{width:16px; height:16px; stroke:#fff;}
  .hero-num{font-size:2.9rem; font-weight:300; letter-spacing:-.04em; line-height:1.05; margin:0; color:var(--text); white-space:nowrap;}
  .hero-num small{font-size:1.5rem; font-weight:300; color:var(--sub); margin-left:4px;}
  .hero-locs{border-top:1px solid rgba(47,65,114,.08); padding-top:8px;}
  .hero-loc{display:flex; align-items:center; gap:6px; font-size:.72rem; color:var(--sub); line-height:1.9;}
  .hero-loc .hl-name{max-width:64px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex-shrink:0;}
  .hero-loc .hl-sum{color:var(--text); font-weight:600; white-space:nowrap;}
  .hero-loc .hl-gap{flex:1; min-width:4px;}
  .hero-loc .hl-gv{display:flex; align-items:center; gap:5px; white-space:nowrap;}
  .hero-loc .hl-gv b{font-weight:700;}
  .hero-chk{background:var(--accent); color:#fff; border:none; border-radius:999px; padding:2px 10px; font-size:.68rem; font-weight:600; margin-left:4px; flex-shrink:0; line-height:1.5;}
  .pill-chip{display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.85); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:.72rem; font-weight:500; color:var(--sub);}
  .pill-chip b{color:var(--text); font-weight:700;}
  .sec-head{display:flex; align-items:center; justify-content:space-between; margin:4px 2px 12px;}
  .sec-title{font-size:.95rem; font-weight:700; color:var(--text);}
  .sec-link{font-size:.8rem; font-weight:500; color:var(--sub); background:none; border:none; padding:0;}
  .qa-row{display:flex; justify-content:space-between; gap:8px; margin-bottom:24px;}
  .qa{display:flex; flex-direction:column; align-items:center; gap:8px; background:none; border:none; flex:1; padding:0;}
  .qa .qa-c{width:60px; height:60px; border-radius:50%; background:linear-gradient(160deg,#fff,rgba(255,255,255,.6)); border:1px solid rgba(255,255,255,.95); box-shadow:0 8px 20px rgba(40,60,110,.10); display:flex; align-items:center; justify-content:center;}
  .qa .qa-c svg{width:22px; height:22px; stroke:var(--accent);}
  .qa span{font-size:.74rem; font-weight:500; color:var(--text);}
  .panel{background:linear-gradient(180deg,rgba(255,255,255,.75) 0%,rgba(190,201,226,.55) 100%); border:1px solid rgba(255,255,255,.9); border-radius:30px; padding:6px 14px; box-shadow:var(--shadow); margin-bottom:22px;}
  .tx{display:flex; align-items:center; gap:12px; padding:12px 0; cursor:pointer;}
  .tx + .tx{border-top:1px solid rgba(47,65,114,.08);}
  .avatar{width:44px; height:44px; border-radius:50%; background:linear-gradient(145deg,#4a5d92,#2f4172); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.95rem; flex-shrink:0; box-shadow:0 6px 14px rgba(47,65,114,.25);}
  .avatar.soft{background:linear-gradient(145deg,#fff,#dfe6f4); color:var(--accent); box-shadow:0 4px 10px rgba(40,60,110,.12);}
  .avatar.soft svg{width:20px; height:20px; stroke:var(--accent);}
  .avatar.warn{background:linear-gradient(145deg,#fff,#fde3e3); color:var(--danger);}
  .tx-main{flex:1; min-width:0;}
  .tx-name{font-weight:600; font-size:.92rem;}
  .tx-sub{font-size:.74rem; color:var(--sub); margin-top:1px;}
  .tx-amt{font-weight:700; font-size:.92rem; text-align:right; white-space:nowrap;}
  /* нижня навігація: підписані іконки + центральна кругла кнопка «+» */
  .navbar-tabs{padding:8px 8px 8px; border-radius:36px; justify-content:space-between;}
  .navitem{flex:1; min-width:0; height:auto; border-radius:0; flex-direction:column; gap:3px; padding:4px 0; width:auto;}
  .navitem .ico{width:38px; height:30px; border-radius:15px; display:flex; align-items:center; justify-content:center;}
  .navitem svg{width:21px; height:21px; stroke:#8b96ad;}
  .navitem .lbl{font-size:.62rem; font-weight:600; color:#8b96ad; white-space:nowrap;}
  .navitem.active, .navitem.active:hover{background:none; box-shadow:none;}
  .navitem.active .ico{background:var(--accent); box-shadow:0 6px 14px rgba(47,65,114,.32);}
  .navitem.active svg{stroke:#fff;}
  .navitem.active .lbl{color:var(--accent);}
  .navfab{width:58px; height:58px; border-radius:50%; background:linear-gradient(150deg,#41568f,#2a3a68); border:3px solid rgba(255,255,255,.95); box-shadow:0 12px 26px rgba(47,65,114,.45); display:flex; align-items:center; justify-content:center; margin:-22px 6px 0; flex-shrink:0;}
  .navfab svg{width:26px; height:26px; stroke:#fff; stroke-width:2;}
  input[type=text], input[type=search], input[type=number], input[type=tel], input[type=password], input:not([type]), textarea, select{
    font-family:inherit; border-radius:18px; padding:12px 16px; background:rgba(255,255,255,.8); border:1px solid var(--line); color:var(--text); outline:none;}
  input:focus, textarea:focus, select:focus{border-color:rgba(47,65,114,.45); box-shadow:0 0 0 4px rgba(47,65,114,.08);}
  button{font-family:inherit;}
  .page-title{font-size:1.5rem; font-weight:700; letter-spacing:-.03em;}
</style>
</head>
<body>
<div id="app" class="max-w-md mx-auto px-4 pt-4" style="padding-bottom:120px"></div>
<div id="navHost"></div>
<div id="syncBanner" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:999;background:#ffb020;color:#1a1a1a;font-size:.78rem;font-weight:600;text-align:center;padding:6px 10px;"></div>

<script>
try{
  if(window.Telegram && window.Telegram.WebApp){
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    // Узгоджуємо системний хедер/фон Telegram із темною темою застосунку, щоб не було білого
    // спалаху під час відкриття, і вимикаємо смахування вниз, яке інакше може випадково закрити
    // застосунок посеред заповнення форми.
    if(typeof Telegram.WebApp.setHeaderColor==='function') Telegram.WebApp.setHeaderColor('#e9eef7');
    if(typeof Telegram.WebApp.setBackgroundColor==='function') Telegram.WebApp.setBackgroundColor('#e9eef7');
    if(typeof Telegram.WebApp.disableVerticalSwipes==='function') Telegram.WebApp.disableVerticalSwipes();
  }
}catch(e){}

// ---- Синхронізація з бекендом ----
// Раніше весь `state` жив у localStorage цього браузера (кожен пристрій — свої окремі дані). Тепер
// спільні бізнес-дані (локації, склади, товари, замовлення, штат тощо) зберігаються на сервері в
// одній спільній таблиці й синхронізуються між усіма пристроями. Лише те, "хто зараз залогінений НА
// ЦЬОМУ пристрої" (LOCAL_ONLY_KEYS), лишається в localStorage — інакше логін касира на одному телефоні
// підмінював би собою того, хто залогінений на іншому.
const LOCAL_ONLY_KEYS = ['currentUserId','currentLocation','currentWarehouse','activeLocationId'];
const SESSION_KEY = 'sklad_session_v1';
const POLL_INTERVAL_MS = 5000;
const SAVE_DEBOUNCE_MS = 500;

let authToken = null;
let stateLoaded = false;
let stateVersion = 0;
let lastSyncError = null;
let saveDebounceTimer = null;
let saveInFlight = false;
let saveQueuedAgain = false;
let pollTimer = null;
let lastSyncedJSON = null;
let historyRefOverride = null; // id замовлення (чека Checkbox), до якого належить списання
let historyCapture = null;     // масив, у який збираємо рядки списання цього чека
let historyWhoOverride = null; // для проданих через Checkbox позицій — автор «Checkbox», а не той, на чиєму пристрої застосовано

function loadLocalSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { s:0, currentUserId:null, currentLocation:null, currentWarehouse:null, activeLocationId:null };
}
function saveLocalSession(){
  try{
    const snap = { s: authToken ? 1 : 0 }; // лише ознака «була сесія»; сам токен — в HttpOnly-cookie, JS його не бачить
    LOCAL_ONLY_KEYS.forEach(k=>{ snap[k] = state[k]; });
    localStorage.setItem(SESSION_KEY, JSON.stringify(snap));
  }catch(e){}
}

async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json', 'X-Sklad':'1'}, opts.headers||{});
  let res;
  try{
    res = await fetch(path, Object.assign({}, opts, { headers, credentials:'same-origin' }));
  }catch(e){
    return { ok:false, status:0, networkError:true, body:null };
  }
  let body = null;
  try{ body = await res.json(); }catch(e){}
  return { ok: res.ok, status: res.status, body };
}

const DEFAULT_STATE = {
  locations: [{id:'loc1', name:'Точка 1'}],
  staff: [{id:'own1', name:'Власник', role:'owner', locationId:'loc1'}],
  currentLocation: 'loc1',
  stockItems: [], recipeIngredients: [], history: [], sales: [], products: [], orders: []
};
let state = Object.assign({ currentUserId:null, currentWarehouse:null, activeLocationId:null }, DEFAULT_STATE);

// Усі старі "if(!state.X) state.X = []" міграції/дефолти — раніше виконувались один раз при
// завантаженні з localStorage, тепер виконуються кожного разу, коли в пам'ять потрапляють свіжі дані
// з сервера (початкове завантаження і кожен поллінг) — це ідемпотентно й дешево для такого обсягу даних.
function runMigrations(){
  if(!state.sales) state.sales = [];
  if(!state.products) state.products = [];
  if(!state.orders) state.orders = [];
  // Migration: "ингредиенты" (per-location stock) renamed to "Продукти" (stockItems);
  // "Інгредієнти" now means a global recipe catalog built from products (recipeIngredients).
  if(!state.stockItems) state.stockItems = state.ingredients || [];
  if(!state.recipeIngredients) state.recipeIngredients = [];
  delete state.ingredients;
  // Migration: warehouses ("Склади") are now independent of business locations
  // (e.g. a central "База" that isn't a customer-facing point). Seed one warehouse
  // per existing location so existing stock keeps pointing at the same place.
  if(!state.warehouses) state.warehouses = state.locations.map(l=>({id:l.id, name:l.name}));
  if(!state.currentWarehouse) state.currentWarehouse = state.currentLocation;
  if(!state.inventories) state.inventories = [];
  if(!state.writeOffs) state.writeOffs = [];
  if(!state.dismissedNotifications) state.dismissedNotifications = [];
  if(!state.auditLog) state.auditLog = [];
  state.products.forEach(p=>{ if(!p.recipeVersion) p.recipeVersion = 1; if(!p.recipeHistory) p.recipeHistory = []; });
  // On-hand ingredient quantities per warehouse — separate from recipeIngredients (which only holds
  // the recipe/cost definition), so the same ingredient can have a different amount in stock at each
  // warehouse (e.g. a batch of sauce made at "База" before being sent out as a "поставка").
  if(!state.ingredientStock) state.ingredientStock = [];
  // Міграція: окремі залишки 1:1-інгредієнтів прибираємо — правдою є залишок продукту в stockItems.
  if(state.recipeIngredients && state.ingredientStock.some(r=>linkedProductName(state.recipeIngredients.find(i=>i.id===r.ingredientId)))){
    state.ingredientStock = state.ingredientStock.filter(r=>!linkedProductName(state.recipeIngredients.find(i=>i.id===r.ingredientId)));
  }
  // Default warehouse: the one "Термінові закупки" on the dashboard is based on. Prefers one literally
  // named "База" (a central depot) if there is one, otherwise the first warehouse.
  if(!state.defaultWarehouseId){
    const base = state.warehouses.find(w=>(w.name||'').trim().toLowerCase()==='база');
    state.defaultWarehouseId = base ? base.id : (state.warehouses[0] ? state.warehouses[0].id : null);
  }
  state.stockItems.forEach(i=>{
    if(i.warehouseId===undefined){ i.warehouseId = i.locationId; delete i.locationId; }
    // Products/сировина are split into "М'ясо з Техасу" and "Фастфуд", same as menu items —
    // lets the Склад list (and the cook's view) be filtered by department. Existing items default
    // to 'meat' (the core business) so nothing silently disappears after this update.
    if(!i.category) i.category = 'meat';
  });
  state.history.forEach(h=>{
    if(h.stockItemId!==undefined && h.warehouseId===undefined){ h.warehouseId = h.locationId; delete h.locationId; }
  });
  // Migration: the old generic non-owner role ("staff", tied to one point/локація) becomes "cashier" —
  // the same restriction (sees only their own point) matches the "Касир" role below.
  state.staff.forEach(s=>{ if(s.role==='staff') s.role = 'cashier'; });
  // Виробничі операції ("Нова готовка"/"Нова заготовка"): сировина -> (втрати обробки) -> чиста вага
  // -> готовий продукт, з розрахунком усушки. Один запис може містити кілька позицій.
  if(!state.productions) state.productions = [];
  // Migration: productions used to be created and finished in one step. Older records get a
  // status of 'done' (they're already complete) plus start/end timestamps derived from the one ts they had.
  state.productions.forEach(p=>{
    if(!p.status) p.status = 'done';
    if(!p.startTs) p.startTs = p.ts;
    if(!p.endTs) p.endTs = p.ts;
    (p.items||[]).forEach(it=>{ if(it.id===undefined) it.id = uid(); });
  });
  // Зв'язки "сировина -> готовий продукт" для виробництва (напр. "М'ясо курка" -> "М'ясо курка BBQ"),
  // налаштовуються власником у Налаштуваннях. Керують тим, які варіанти готового продукту
  // пропонуються при виборі конкретної сировини в «Новій готовці».
  if(!state.productionLinks) state.productionLinks = [];
  // Журнал заготовок (приготування інгредієнта з кількох продуктів зі списанням зі складу).
  if(!state.preparations) state.preparations = [];
  // Поставки between warehouses now go through a two-step handoff: SENT (stock already left the
  // sender, but isn't credited to the receiver yet — it's "в дорозі") -> RECEIVED (receiver confirms
  // the actual quantity, which may differ from what was sent — that difference is a "розбіжність").
  if(!state.transfers) state.transfers = [];
  // Графік змін: власник заздалегідь призначає, хто з працівників і на якій точці працює в конкретний
  // день. При вході в цей день працівник бачить своє робоче місце, а касира це ще й переводить на
  // потрібний склад (currentWarehouse), навіть якщо за замовчуванням він прив'язаний до іншої.
  if(!state.shiftSchedule) state.shiftSchedule = [];
  // The точка a currently logged-in non-owner (cashier, or cook/prep for display only) is actually
  // working at right now — resolved at login from today's Графік змін, falling back to their default
  // locationId. Kept separate from state.currentLocation, which is the OWNER's browsing selection in
  // Налаштування/Дашборд: a cashier's login used to overwrite that same field, so after they signed in
  // the owner's location filters (e.g. the staff list) would silently follow the cashier around instead
  // of staying on whatever location the owner had selected.
  if(state.activeLocationId===undefined) state.activeLocationId = null;
  // Завдання ("Дашборд" заготівельника): ручні доручення від власника або автоматичні запити від
  // касирів на додаткову позицію в поставці. assignedToStaffId=null означає "будь-який заготівельник".
  if(!state.tasks) state.tasks = [];
  // Оцінки прийому зміни ("Прийняти зміну"): коли касир виходить на точку після ІНШОЇ людини, він
  // перед відкриттям своєї зміни оцінює 5 пунктів того, як попередник залишив точку (добре/погано,

  if(!state.glovo) state.glovo = {};
  { const gv = state.glovo; if(!Array.isArray(gv.items)) gv.items = []; if(gv.commissionPct===undefined) gv.commissionPct = 36; }
  if(!state.checkbox) state.checkbox = {};
  { const cb = state.checkbox;
    if(!cb.registerMap) cb.registerMap = {};

// Все в `state`, КРІМ LOCAL_ONLY_KEYS, — те, що зберігається на сервері.
function syncedSubset(){
  const copy = Object.assign({}, state);
  LOCAL_ONLY_KEYS.forEach(k=> delete copy[k]);
  return copy;
}
// Замінює спільні дані свіжими з сервера, зберігаючи локальні (per-device) ключі як були.
function applySyncedData(data){
  const local = {};
  LOCAL_ONLY_KEYS.forEach(k=> local[k]=state[k]);
  state = Object.assign({}, data, local);
  runMigrations();
  // Ціни закупівлі могли змінитись після створення страв — перераховуємо й, якщо щось змінилось, зберігаємо.
  try{ if(fixCheckboxConsumptionWarehouses() && authToken) saveState(); }catch(e){ console.error('consumption fix', e); }
  try{ if(recalcMenuCosts() && authToken) saveState(); }catch(e){}
}
// Одноразово: списання за чеками Checkbox/Glovo, що сьогодні (08.10.2026) потрапили на «Базу» замість складу точки,
// переносимо на склад точки: повертаємо кількість на Базу, знімаємо зі складу точки, переписуємо рядки історії.
function fixCheckboxConsumptionWarehouses(){
  if(!state.stockItems || !state.history || !state.orders) return false;
  const since = new Date(2026, 9, 8, 0, 0, 0).getTime(), until = new Date(2026, 9, 9, 0, 0, 0).getTime(); // лише сьогодні; ідемпотентно
  const norm = x=>String(x||'').trim().toLowerCase();
  const byRef = {};
  state.orders.forEach(o=>{ const ref = o.checkboxId || o.glovoId; if(ref) byRef[ref] = o; });
  let moved = 0;
  state.history.forEach(h=>{
    if(!(h.tsMs>=since && h.tsMs<until)) return;
    const o = h.orderRef ? byRef[h.orderRef] : null;
    if(!o && !(h.reason==='Продаж' && h.who==='Checkbox')) return; // лише списання за чеками Checkbox / продажами Glovo
    // Склад точки чека; якщо його не вдалося визначити — склад «ЦУМ» (за назвою).
    const cumWh = (state.warehouses||[]).find(w=>norm(w.name).includes('цум'));
    const target = (o && warehouseForLocationOrNull(o.locationId)) || cumWh || null;
    if(!target || target.id===h.warehouseId) return;
    if(h.warehouseId!==baseWarehouseId()) return; // чіпаємо лише помилкові списання з Бази
    const fromWh = h.warehouseId;
    if(h.stockItemId){
      const src = state.stockItems.find(i=>i.id===h.stockItemId);
      if(!src) return;
      let dst = state.stockItems.find(i=>i.warehouseId===target.id && norm(i.name)===norm(src.name));
      if(!dst){ dst = { id: uid(), warehouseId: target.id, name: src.name, unit: src.unit, qty: 0, min: 0, costPerUnit: src.costPerUnit||0, category: src.category||'meat' }; state.stockItems.push(dst); }
      src.qty = Number((src.qty - h.delta).toFixed(3));
      dst.qty = Number((dst.qty + h.delta).toFixed(3));
      h.stockItemId = dst.id;
    } else if(h.ingredientId){
      const mv = (wh, d)=>{ let r = state.ingredientStock.find(x=>x.ingredientId===h.ingredientId && x.warehouseId===wh); if(!r){ r = {id:uid(), warehouseId:wh, ingredientId:h.ingredientId, qty:0}; state.ingredientStock.push(r); } r.qty = Number((r.qty + d).toFixed(3)); };
      mv(fromWh, -h.delta); mv(target.id, h.delta);
    } else return;
    h.warehouseId = target.id;
    moved++;
  });
  if(moved) logEvent('fix', 'Перенесено списання за чеками з Бази на склад точки: '+moved+' рядків');
  return moved>0;
}

  stopPolling();

    const r = await api('/api/state');

async function flushStateToServer(){
  saveDebounceTimer = null;
  const payload = syncedSubset();
  const json = JSON.stringify(payload);
  if(json === lastSyncedJSON){ return; } // нічого спільного не змінилось (напр. лише свій перемикач локації)
  if(saveInFlight){ saveQueuedAgain = true; return; }
  saveInFlight = true;
  const r = await api('/api/state', { method:'PUT', body: JSON.stringify({ version: stateVersion, data: payload }) });
  saveInFlight = false;
  if(r.ok){
    stateVersion = r.body.version;
    lastSyncedJSON = json;
    lastSyncError = null;
    // Відкритий пін пішов на сервер лише раз — там він захешований; з пам'яті клієнта прибираємо.
    if((payload.staff||[]).some(x=>x && x.pin) && !saveDebounceTimer && !saveQueuedAgain){
      if(await fetchStateFromServer()) render();
    }
  } else if(r.status===400 && r.body && (r.body.error==='pin_taken' || r.body.error==='pin_format')){
    const msg = r.body.error==='pin_taken' ? 'Такий пін вже зайнятий — оберіть інший. Зміни пін-коду не збережено.' : 'Пін має складатися з 4-6 цифр.';
    if(await fetchStateFromServer()) render();
    appAlert(msg);
  } else if(r.status===409){
    // Хтось інший зберіг зміни раніше нас — підтягуємо свіжі дані й перемальовуємо.
    stateVersion = r.body.version;
    applySyncedData(r.body.data);
    lastSyncedJSON = JSON.stringify(r.body.data);
    lastSyncError = null;
    appAlert('Дані щойно оновив інший пристрій — синхронізовано, перевірте останню дію.');
    render();
  } else if(r.status===401){
    handleAuthExpired();
  } else {
    lastSyncError = r.networkError ? 'Немає з’єднання з сервером. Зміни збережено локально, спробуємо ще раз.' : 'Не вдалося зберегти дані на сервері.';
    updateSyncBanner();
  }
  if(saveQueuedAgain){ saveQueuedAgain = false; saveState(); }
}
// Викликається з ~200 місць по всьому коду як `saveState(); render();` — лишається синхронною: одразу

// ---- Автоперерахунок собівартості меню ----
// Собівартість страви зберігається в самій страві (ingredients[].cost + costPrice), тому якщо закупівельну
// ціну продукту вказали/змінили вже після створення страви — вона лишалась старою. recalcMenuCosts() заново
// рахує все з поточних цін; викликається при кожному збереженні і при підвантаженні даних з сервера.
// Ціну продукту беремо детерміновано (перший рядок складу з ціною > 0), щоб різні пристрої з різним
// «поточним складом» рахували однаково і не перезаписували одне одного. Історичні продажі й
// recipeHistory не чіпаємо — вони тримають власні знімки.
function stableProductCost(name){
  const key = String(name||'').trim().toLowerCase();
  const row = (state.stockItems||[]).find(i=>String(i.name||'').trim().toLowerCase()===key && (Number(i.costPerUnit)||0)>0);
  return row ? Number(row.costPerUnit) : 0;
}
function stableIngredientUnitCost(ing){
  const total = (ing.components||[]).reduce((s,c)=>s + (Number(c.amount)||0) * stableProductCost(c.productName), 0);
  const y = Number(ing.yieldAmount)||1;
  return y>0 ? total/y : 0;
}
function recalcMenuCosts(){
  let changed = false;
  const r4 = x=>Number((Number(x)||0).toFixed(4));
  const set = (obj, key, val)=>{ val = r4(val); if(Math.abs((Number(obj[key])||0)-val) > 0.00005){ obj[key] = val; changed = true; } };
  (state.products||[]).forEach(p=>{
    if(p.type!=='dish') return;
    let sum = 0;
    (p.ingredients||[]).forEach(line=>{
      const ing = (state.recipeIngredients||[]).find(i=>i.id===line.ingredientId);
      if(ing){
        const unitCost = stableIngredientUnitCost(ing);
        set(line, 'costPerUnit', unitCost);
        set(line, 'cost', (Number(line.amount)||0) * unitCost);
      }
      sum += Number(line.cost)||0;
    });
    set(p, 'costPrice', sum);
  });
  // Комбо: орієнтовна собівартість = сума середніх по слотах (після страв, бо залежить від них).
  (state.products||[]).forEach(p=>{
    if(p.type!=='combo') return;
    const total = (p.comboSlots||[]).reduce((sum, sl)=>{
      const costs = (sl.productIds||[]).map(id=>{ const x = state.products.find(q=>q.id===id); return x ? (Number(x.costPrice)||0) : 0; });
      return sum + (costs.length ? costs.reduce((a,b)=>a+b,0)/costs.length : 0);
    }, 0);
    set(p, 'costPrice', total);
  });
  return changed;
}

// ---- On-hand ingredient stock per warehouse (see state.ingredientStock above) ----
// «Інгредієнт 1:1» (7up, Борошно…) — не окремий залишок, а той самий продукт зі stockItems: його кількість
// читається й змінюється просто в рядку продукту на цьому складі. Тому закупівля, готовка, інвентаризація,
// списання й продаж страви працюють з ОДНИМ лічильником. Окремий ingredientStock — лише для справжніх
// рецептів (соуси, заготовки), які виробляються «Заготовкою».
function linkedProductName(ing){
  if(!ing || ing.isRecipe) return null;
  const c = ing.components||[];
  if(c.length!==1 || Number(c[0].amount)!==1 || (Number(ing.yieldAmount)||1)!==1) return null;
  return c[0].productName || null;
}
function linkedStockRow(ing, warehouseId, create){
  const name = linkedProductName(ing);
  if(!name) return null;
  let row = stockRowByName(name, warehouseId);
  if(!row && create){
    const sib = stockRowsForProduct(name)[0];
    row = { id: uid(), warehouseId, name, unit: (sib&&sib.unit)||ing.unit, qty: 0, min: 0, costPerUnit: sib?(sib.costPerUnit||0):0, category: (sib&&sib.category)||'meat' };
    state.stockItems.push(row);
  }
  return row;
}
function ingredientQtyAt(ingredientId, warehouseId){
  const lingr = state.recipeIngredients.find(i=>i.id===ingredientId);
  if(linkedProductName(lingr)){ const row = linkedStockRow(lingr, warehouseId, false); return row ? row.qty : 0; }
  const rec = state.ingredientStock.find(r=>r.ingredientId===ingredientId && r.warehouseId===warehouseId);
  return rec ? rec.qty : 0;
}
function ingredientBaseWarehouseId(){ return state.currentWarehouse; }
function curIngredientQty(ing){ return ingredientQtyAt(ing.id, ingredientBaseWarehouseId()); }
// Sets the on-hand quantity outright (used when the qty is edited directly on the ingredient form).
function setIngredientQty(ingredientId, warehouseId, qty){
  const lingr = state.recipeIngredients.find(i=>i.id===ingredientId);
  if(linkedProductName(lingr)){ linkedStockRow(lingr, warehouseId, true).qty = Math.max(0, Number(qty)||0); return; }
  let rec = state.ingredientStock.find(r=>r.ingredientId===ingredientId && r.warehouseId===warehouseId);
  if(!rec){
    rec = { id: uid(), warehouseId, ingredientId, qty: 0 };
    state.ingredientStock.push(rec);
  }
  rec.qty = Math.max(0, Number(qty)||0);
}
// Mutates the on-hand qty by delta and logs it into the shared history feed (reused from products'
// history so it shows up in the existing "Історія" tab without a separate view). No save/render here,
// so callers that touch several ingredients (like a transfer) can batch one save+render at the end.
function recordIngredientChange(ing, warehouseId, delta, reason){
  if(linkedProductName(ing)){ recordStockChange(linkedStockRow(ing, warehouseId, true), delta, reason); return; }
  let rec = state.ingredientStock.find(r=>r.ingredientId===ing.id && r.warehouseId===warehouseId);
  if(!rec){
    rec = { id: uid(), warehouseId, ingredientId: ing.id, qty: 0 };
    state.ingredientStock.push(rec);
  }
  { const next = Number((rec.qty + delta).toFixed(3)); rec.qty = allowNegativeStock() ? next : Math.max(0, next); }
  const u = curUser();
  state.history.unshift({
    id: uid(), ingredientId: ing.id, name: ing.name, unit: ing.unit,
    delta, reason, ts: nowStr(), tsMs: Date.now(), warehouseId, who: historyWhoOverride || (u ? u.name : '-'),
    orderRef: historyRefOverride || undefined
  });
  if(historyCapture) historyCapture.push({ name: ing.name, unit: ing.unit, delta });
  if(state.history.length>300) state.history.pop();
}

// ---- Заготовка: приготування інгредієнта (напр. «Соус сирний») з кількох продуктів ----
// Рядок складу продукту на потрібному складі (збіг за назвою без урахування регістру/пробілів).
function stockRowByName(name, warehouseId){
  const key = String(name||'').trim().toLowerCase();
  return state.stockItems.find(i=>i.warehouseId===warehouseId && String(i.name||'').trim().toLowerCase()===key) || null;
}
// used: [{productName, unit, amount}] — що реально взято; outQty — скільки вийшло готового.
// Повертає {ok:true} або {ok:false, error}. Нічого не змінює, якщо на складі не вистачає.
function recordPreparation(ing, outQty, used, warehouseId){
  outQty = Number(outQty)||0;
  if(outQty<=0) return {ok:false, error:'Вкажіть, скільки вийшло готового'};
  const lines = (used||[]).filter(u=>Number(u.amount)>0);
  if(lines.length===0) return {ok:false, error:'Вкажіть, скільки чого взято'};
  const short = [];
  lines.forEach(u=>{
    const row = stockRowByName(u.productName, warehouseId);
    const have = row ? row.qty : 0;
    if(have+1e-9 < u.amount) short.push(u.productName+': є '+fmt(have)+' '+u.unit+', потрібно '+fmt(u.amount));
  });
  if(short.length && !allowNegativeStock()) return {ok:false, error:'Не вистачає на складі:\n'+short.join('\n')};
  const reason = 'Заготовка: '+ing.name;
  const costTotal = lines.reduce((s,u)=>{
    const row = stockRowByName(u.productName, warehouseId);
    return s + u.amount*(row ? (row.costPerUnit||0) : 0);
  }, 0);
  lines.forEach(u=>{
    const row = stockRowByName(u.productName, warehouseId);
    recordStockChange(row, -u.amount, reason);
  });
  recordIngredientChange(ing, warehouseId, outQty, 'Заготовка: приготовлено');
  const u0 = curUser();
  if(!state.preparations) state.preparations = [];
  state.preparations.unshift({
    id: uid(), ingredientId: ing.id, name: ing.name, unit: ing.unit, outQty, warehouseId,
    used: lines.map(u=>({productName:u.productName, unit:u.unit, amount:Number(u.amount)})),
    cost: costTotal, ts: nowStr(), tsMs: Date.now(), who: u0 ? u0.name : '-'
  });
  if(state.preparations.length>300) state.preparations.pop();
  logEvent('preparation', 'Заготовка «'+ing.name+'»: '+fmt(outQty)+' '+ing.unit+' (з '+lines.map(u=>u.productName+' '+fmt(u.amount)+' '+u.unit).join(', ')+')');
  return {ok:true};
}

async function login(pin){
  // Пін більше не звіряється на клієнті (до логіну клієнт взагалі не бачить чужих даних) — сервер сам
  // перевіряє пін проти свого штату і видає токен сесії.
  const loginRes = await api('/api/auth/login', { method:'POST', body: JSON.stringify({ pin }) });
  if(!loginRes.ok || !loginRes.body || !loginRes.body.staffId) return false;
  authToken = true; // сесія тримається в HttpOnly-cookie
  const staffId = loginRes.body.staffId;
  const loaded = await fetchStateFromServer();
  if(!loaded){ authToken = null; return false; }
  const staff = state.staff.find(s=>s.id===staffId);
  if(!staff){ authToken = null; return false; }
  state.currentUserId = staff.id;
  if(staff.role==='owner'){
    view = 'dashboard';
  } else {
    // Якщо власник призначив цього співробітника в «Графіку змін» на сьогодні — це має пріоритет
    // над його типовою точкою (напр. касира тимчасово перекинули на іншу точку).
    const todaySched = todayScheduleFor(staff.id);
    if(staff.role==='cook' || staff.role==='prep'){
      // Кухар/Заготівельник always work off the central "База" warehouse — no other склад is visible to them.
      state.currentWarehouse = baseWarehouseId();
      state.activeLocationId = todaySched ? todaySched.locationId : (staff.locationId || null); // informational only (shown in header)
    } else {
      // Касир (or a legacy "staff" record) — locked to their own точка, unless reassigned for today.
      // Warehouses were originally seeded 1:1 with locations, so the warehouse of the same id is that point's stock.
      // Stored in activeLocationId (this worker's own point), NOT state.currentLocation — that field is
      // the owner's browsing selection in Налаштування/Дашборд and must not follow whoever last logged in.
      const effectiveLocationId = todaySched ? todaySched.locationId : staff.locationId;
      state.activeLocationId = effectiveLocationId;
      state.currentWarehouse = warehouseForLocation(effectiveLocationId);
    }
    view = (staff.role==='prep') ? 'prepDashboard' : 'stock';
  }
  saveState();
  startPolling();
  render();
  return true;
}
function logout(){
  stopPolling();
  api('/api/auth/logout', { method:'POST' }).catch(()=>{});
  authToken = null;
  state.currentUserId = null;
  saveState();
  render();
}

function deleteWarehouse(id){

  const wh = state.warehouses.find(w=>w.id===id);

}

// everywhere=true duplicates the product onto every warehouse (starting qty applies only to the
// current one, others start at 0 since each warehouse then tracks its own real count independently).
// `min` is either a plain number (same minimum for every склад the product lands on) or an object
// { [warehouseId]: number } to give each склад its own minimum (e.g. Лаваш: База 50, ЦУМ 15).
function addStockItem(name, unit, qty, min, costPerUnit, everywhere, category){
  category = category==='fastfood' ? 'fastfood' : 'meat';
  const minFor = (whId)=> (min && typeof min==='object') ? (Number(min[whId])||0) : (Number(min)||0);
  if(everywhere && state.warehouses.length>1){
    state.warehouses.forEach(w=>{
      state.stockItems.push({
        id: uid(), warehouseId: w.id, name, unit, category,
        qty: w.id===state.currentWarehouse ? (Number(qty)||0) : 0,
        min: minFor(w.id), costPerUnit: Number(costPerUnit)||0
      });
    });
  } else {
    state.stockItems.push({
      id: uid(), warehouseId: state.currentWarehouse,
      name, unit, category, qty: Number(qty)||0, min: minFor(state.currentWarehouse), costPerUnit: Number(costPerUnit)||0
    });
  }
  saveState(); render();
}
// All stockItems rows that are the same product on different складах (same name, case/space-insensitive —
// the same matching findOrCreateStockItemForPurchase uses). Used to edit the per-склад minimum in one place.
function stockRowsForProduct(name){
  const key = String(name||'').trim().toLowerCase();
  return state.stockItems.filter(i=>String(i.name||'').trim().toLowerCase()===key);
}
// Sets item.min for several rows at once ({ [stockItemId]: min }) WITHOUT saving/rendering — caller saves once.
function applyStockMins(map){
  Object.keys(map||{}).forEach(id=>{
    const it = state.stockItems.find(i=>i.id===id);
    if(it) it.min = Number(map[id])||0;
  });
}
function deleteStockItem(id){
  state.stockItems = state.stockItems.filter(i=>i.id!==id);
  saveState(); render();
}
// Mutates item.qty and logs a history entry, WITHOUT saving/rendering (caller does that once, so bulk
// corrections like an inventory don't re-render per line).
function recordStockChange(item, delta, reason){
  { const next = Number((item.qty + delta).toFixed(3)); item.qty = allowNegativeStock() ? next : Math.max(0, next); }
  const u = curUser();
  state.history.unshift({
    // item.warehouseId (not state.currentWarehouse) — this item always belongs to its own склад,
    // which matters once an operation (e.g. "Закупівля") can touch a склад other than the one
    // currently open in "Залишки".
    id: uid(), stockItemId: item.id, name: item.name, unit: item.unit,
    delta, reason, ts: nowStr(), tsMs: Date.now(), warehouseId: item.warehouseId,
    who: historyWhoOverride || (u ? u.name : '-'),
    orderRef: historyRefOverride || undefined
  });
  if(historyCapture) historyCapture.push({ name: item.name, unit: item.unit, delta });
  if(state.history.length>300) state.history.pop();
}
function updateStockItem(id, data){
  const item = state.stockItems.find(i=>i.id===id);
  if(!item) return;
  const newQty = Number(data.qty)||0;
  if(newQty !== item.qty){
    recordStockChange(item, newQty-item.qty, 'Редагування вручну');
  }
  item.name = data.name;
  item.unit = data.unit;
  item.min = Number(data.min)||0;
  item.costPerUnit = Number(data.costPerUnit)||0;
  item.category = data.category==='fastfood' ? 'fastfood' : 'meat';
  saveState(); render();
}
// warehouseId: null means available on every warehouse (default); a specific id restricts it to that one.
function addRecipeIngredient(data){
  const ing = {
    id: uid(), name: data.name, unit: data.unit,
    yieldAmount: Number(data.yieldAmount)||1,
    components: data.components,
    warehouseId: data.warehouseId || null
  };
  if(data.isRecipe) ing.isRecipe = true;
  state.recipeIngredients.push(ing);
  if(data.qty!==undefined && Number(data.qty)>0) setIngredientQty(ing.id, data.qtyWarehouseId || ingredientBaseWarehouseId(), data.qty);
  saveState(); render();
}
function deleteRecipeIngredient(id){
  state.recipeIngredients = state.recipeIngredients.filter(i=>i.id!==id);
  state.ingredientStock = state.ingredientStock.filter(r=>r.ingredientId!==id);
  saveState(); render();
}
function updateRecipeIngredient(id, data){
  const ing = state.recipeIngredients.find(i=>i.id===id);
  if(!ing) return;
  ing.name = data.name;
  ing.unit = data.unit;
  ing.yieldAmount = Number(data.yieldAmount)||1;
  ing.components = data.components;
  ing.warehouseId = data.warehouseId || null;
  if(data.isRecipe) ing.isRecipe = true;
  if(data.qty!==undefined){
    const newQty = Number(data.qty)||0;
    const curQty = curIngredientQty(ing);
    if(newQty!==curQty) recordIngredientChange(ing, state.currentWarehouse, newQty-curQty, 'Редагування вручну');
  }
  saveState(); render();
}
// Ingredients visible from the current warehouse: shared ones (no warehouseId) plus ones assigned to it.
function availableRecipeIngredients(){
  return state.recipeIngredients.filter(i=>!i.warehouseId || i.warehouseId===state.currentWarehouse);
}

// Рецепт — тільки те, що створено в розділі «Рецепти» (прапорець isRecipe). Інгредієнти 1:1 з продуктів
// (7up, Борошно…) — це просто продукти для страв, у «Рецептах» їх не показуємо.
function isRealRecipe(ing){ return !!ing.isRecipe && (ing.components||[]).length>0; }
function availableRecipes(){ return availableRecipeIngredients().filter(isRealRecipe); }

// ---- Закупівля: поповнення складу ззовні (не з іншого складу, як поставка, а "з нуля"), для
// продуктів (М'ясо/Фастфуд) і готових інгредієнтів разом. ----
// Унікальний каталог того, що можна закупити: продукти (за унікальною назвою — незалежно від того,
// на якому складі вони вже заведені) + всі готові інгредієнти (вони й так глобальні).
function purchaseCandidates(){
  const seen = new Set();
  const products = [];
  state.stockItems.forEach(i=>{
    if(seen.has(i.name)) return;
    seen.add(i.name);
    products.push({ kind:'product', name:i.name, unit:i.unit, category:i.category||'meat', costPerUnit:i.costPerUnit||0, min:i.min||0 });
  });
  const ingredients = state.recipeIngredients.filter(i=>!linkedProductName(i)).map(i=>({ kind:'ingredient', id:i.id, name:i.name, unit:i.unit }));
  return products.concat(ingredients);
}
// Знаходить (або, якщо на цьому складі товару з такою назвою ще нема, створює) рядок stockItems
// саме для цього складу — продукти заведені окремим рядком на кожному складі.
function findOrCreateStockItemForPurchase(name, whId, template){
  let item = state.stockItems.find(i=>i.warehouseId===whId && i.name.trim().toLowerCase()===name.trim().toLowerCase());
  if(!item){
    item = { id: uid(), warehouseId: whId, name, unit: template.unit, qty: 0, min: template.min||0, costPerUnit: template.costPerUnit||0, category: template.category||'meat' };
    state.stockItems.push(item);
  }
  return item;
}
// lines: [{kind:'product', name, unit, category, costPerUnit, min, qty} | {kind:'ingredient', id, name, unit, qty}]
function recordPurchase(whId, lines){
  lines.forEach(l=>{
    if(l.kind==='product'){
      const item = findOrCreateStockItemForPurchase(l.name, whId, l);
      recordStockChange(item, l.qty, 'Закупівля');
    } else {
      const ing = state.recipeIngredients.find(i=>i.id===l.id);
      if(ing) recordIngredientChange(ing, whId, l.qty, 'Закупівля');
    }
  });
  const whName = (state.warehouses.find(w=>w.id===whId)||{}).name || '';
  logEvent('purchase', `Закупівля: ${lines.length} поз. на склад «${whName}»`);
  saveState(); render();
}

// ---- Поставка (two-step transfer: SENT — stock already left the sender, not yet credited to the
// receiver — then RECEIVED once the receiver confirms actual quantity, logging any розбіжність). ----
// lines: [{ingredientId, name, unit, qty}]
function createTransfer(fromWhId, toWhId, lines){
  const u = curUser();
  lines.forEach(l=> transferLineChange(l, fromWhId, -l.qty, 'Поставка (відправлено)'));
  const transfer = {
    id: uid(), fromWarehouseId: fromWhId, toWarehouseId: toWhId, status: 'SENT',
    createdBy: u ? u.name : '-', createdAt: nowStr(), createdMs: Date.now(), receivedBy: null, receivedAt: null,
    lines: lines.map(l=>({ kind: l.kind==='product' ? 'product' : 'ingredient', ingredientId: l.ingredientId||null, stockName: l.stockName||null,
      name: l.name, unit: l.unit, sentQty: l.qty, receivedQty: null }))
  };
  state.transfers.unshift(transfer);
  const fromName = (state.warehouses.find(w=>w.id===fromWhId)||{}).name || '';
  const toName = (state.warehouses.find(w=>w.id===toWhId)||{}).name || '';
  logEvent('transfer', `Відправлено поставку: ${fromName} → ${toName} (${lines.length} поз.)`);
  saveState(); render();
  return transfer;
}
// received: [{key, qty}] — фактично пораховано на складі-отримувачі (за замовчуванням = відправлено; розбіжність логуємо).
function receiveTransfer(transferId, received){
  const t = state.transfers.find(x=>x.id===transferId);
  if(!t || t.status!=='SENT') return;
  const u = curUser();
  const toName = (state.warehouses.find(w=>w.id===t.toWarehouseId)||{}).name || '';
  t.lines.forEach(line=>{
    const rec = received.find(r=> r.key ? r.key===lineKey(line) : r.ingredientId===line.ingredientId);
    const qty = rec ? Number(rec.qty)||0 : line.sentQty;
    line.receivedQty = qty;
    if(qty>0) transferLineChange(line, t.toWarehouseId, qty, 'Поставка (прийнято)');
  });
  t.status = 'RECEIVED';
  t.receivedBy = u ? u.name : '-';
  t.receivedAt = nowStr();
  const hasDiscrepancy = t.lines.some(l=>l.receivedQty!==l.sentQty);
  logEvent('transfer', `Прийнято поставку на «${toName}»${hasDiscrepancy?' (з розбіжністю)':''}`);
  saveState(); render();
}
// Лише поки SENT (ще не прийнята) — повертає відправлене на склад-відправник. Може власник або той, хто відправляв зі свого складу.
function canCancelTransfer(t){ return isOwner() || (canTransfer() && t.fromWarehouseId===state.currentWarehouse); }
function cancelTransfer(transferId){
  const t = state.transfers.find(x=>x.id===transferId);
  if(!t || t.status!=='SENT') return;
  t.lines.forEach(line=> transferLineChange(line, t.fromWarehouseId, line.sentQty, 'Поставка скасована'));
  t.status = 'CANCELLED';
  const fromName = (state.warehouses.find(w=>w.id===t.fromWarehouseId)||{}).name || '';
  logEvent('transfer', `Скасовано поставку зі складу «${fromName}»`);
  saveState(); render();
}
// ---- Що можна відправляти поставкою: готові інгредієнти (рецепти) + сирі продукти складу, які не є «1:1-інгредієнтом»
// (їх і так видно як інгредієнт, обидва шляхи рухають той самий залишок).
function lineKey(l){ return l.kind==='product' ? 'p:'+String(l.stockName||l.name).trim().toLowerCase() : 'i:'+l.ingredientId; }
function transferCatalog(whId){
  const norm = x=>String(x||'').trim().toLowerCase();
  const ings = state.recipeIngredients.filter(i=>!i.warehouseId || i.warehouseId===whId);
  const covered = new Set(ings.map(i=>linkedProductName(i)).filter(Boolean).map(norm));
  const out = ings.map(i=>({ kind:'ingredient', ing:i, name:i.name, unit:i.unit }));
  state.stockItems.filter(x=>x.warehouseId===whId && !covered.has(norm(x.name))).forEach(x=> out.push({ kind:'product', name:x.name, unit:x.unit }));
  return out.sort((a,b)=>a.name.localeCompare(b.name,'uk'));
}
function catalogQty(c, whId){
  return c.kind==='ingredient' ? ingredientQtyAt(c.ing.id, whId) : ((stockRowByName(c.name, whId)||{}).qty || 0);
}
function catalogMin(c, whId){
  const row = c.kind==='product' ? stockRowByName(c.name, whId) : (c.ing ? linkedStockRow(c.ing, whId, false) : null);
  return row ? (Number(row.min)||0) : 0;
}
function transferLineChange(line, whId, delta, reason){
  if(line.kind==='product'){
    const name = line.stockName || line.name;
    const sib = stockRowsForProduct(name)[0];
    const row = findOrCreateStockItemForPurchase(name, whId, { unit: sib?sib.unit:line.unit, min:0, costPerUnit: sib?(sib.costPerUnit||0):0, category: sib?(sib.category||'meat'):'meat' });
    recordStockChange(row, delta, reason);
  } else {
    const ing = state.recipeIngredients.find(i=>i.id===line.ingredientId);
    if(ing) recordIngredientChange(ing, whId, delta, reason);
  }
}
function pendingTransfersFor(warehouseId){
  return state.transfers.filter(t=>t.toWarehouseId===warehouseId && t.status==='SENT');
}

// ---- Виробництво ("Нова готовка" / "Нова заготовка") ----
// Двоетапний процес:
// 1) startProduction(items) — сировина одразу списується зі складу (вона вже "в роботі"),
//    запис створюється в статусі 'in_process'. Вихідна вага ще невідома.
//    items: [{ inputId, inputName, inputUnit, inputWeight, hasLoss, lossWeight, netWeight, outputName }]
// 2) finishProduction(productionId, weights) — коли готовка завершена, для кожної позиції
//    вказується фактична вихідна вага; готовий продукт оприбутковується на склад, рахується усушка,
//    запис переходить у статус 'done'. weights: { [itemId]: outputWeight }
// outputWarehouseId: де оприбуткується ГОТОВИЙ продукт після завершення готовки — може відрізнятись
// від складу, звідки береться сировина (завжди state.currentWarehouse, для кухаря/заготівельника це
// «База»). Якщо не вказано (кухар цей вибір не бачить), оприбуткування йде на той самий склад.
function startProduction(items, outputWarehouseId){
  const inputWhId = state.currentWarehouse;
  const outputWhId = outputWarehouseId || inputWhId;
  const u = curUser();
  const savedItems = items.map(it=>{
    const inputItem = state.stockItems.find(p=>p.id===it.inputId);
    if(inputItem) recordStockChange(inputItem, -it.inputWeight, 'Виробництво: сировина взята в роботу');
    return {
      id: uid(),
      inputName: it.inputName, inputUnit: it.inputUnit, inputWeight: it.inputWeight,
      inputCostPerUnit: inputItem ? (inputItem.costPerUnit||0) : 0,
      category: inputItem ? (inputItem.category||'meat') : 'meat',
      hasLoss: it.hasLoss, lossWeight: it.lossWeight, netWeight: it.netWeight,
      outputName: it.outputName,
      outputWeight: null, shrinkagePercent: null, processingLossPercent: null, yieldPercent: null
    };
  });
  const production = {
    id: uid(), warehouseId: outputWhId, inputWarehouseId: inputWhId, employeeId: u ? u.id : null, employeeName: u ? u.name : '-',
    status: 'in_process', startTs: nowStr(), endTs: null, ts: nowStr(), items: savedItems
  };
  state.productions.unshift(production);
  const inputWhName = (state.warehouses.find(w=>w.id===inputWhId)||{}).name||'';
  const outputWhName = (state.warehouses.find(w=>w.id===outputWhId)||{}).name||'';
  logEvent('production', `Готовка почата: ${savedItems.length} поз. (сировина зі складу «${inputWhName}»${outputWhId!==inputWhId ? ', оприбуткування на «'+outputWhName+'»' : ''})`);
  saveState(); render();
  return production;
}
function finishProduction(productionId, weights){
  const production = state.productions.find(p=>p.id===productionId);
  if(!production) return null;
  const whId = production.warehouseId;
  production.items.forEach(it=>{
    const outputWeight = Number(weights[it.id]) || 0;
    let outItem = state.stockItems.find(p=>p.warehouseId===whId && p.name.trim().toLowerCase()===it.outputName.trim().toLowerCase());
    if(!outItem){
      const outCost = outputWeight>0 ? ((it.inputCostPerUnit||0) * it.inputWeight) / outputWeight : 0;
      outItem = { id: uid(), warehouseId: whId, name: it.outputName, unit: it.inputUnit, qty: 0, min: 0, costPerUnit: outCost, category: it.category||'meat' };
      state.stockItems.push(outItem);
    }
    if(outputWeight>0) recordStockChange(outItem, outputWeight, 'Виробництво: готовий продукт');

    it.outputWeight = outputWeight;
    it.shrinkagePercent = it.netWeight>0 ? ((it.netWeight - outputWeight) / it.netWeight) * 100 : 0;
    it.processingLossPercent = it.inputWeight>0 ? (it.lossWeight / it.inputWeight) * 100 : 0;
    it.yieldPercent = it.inputWeight>0 ? (outputWeight / it.inputWeight) * 100 : 0;
  });
  production.status = 'done';
  production.endTs = nowStr();
  production.ts = production.endTs;
  logEvent('production', `Готовка завершена: ${production.items.length} поз. (склад «${(state.warehouses.find(w=>w.id===whId)||{}).name||''}»)`);
  saveState(); render();
  return production;
}

// ---- Інвентаризація ----
function startInventory(){
  editingInventoryId = null;
  view = 'inventoryStart';
  render();
}
// entries: [{stockItemId, name, unit, before, after}] for every product on the current warehouse.
// Applies each difference to actual stock, logs it in history, and saves a standalone inventory record.
// entries: [{kind:'product'|'ingredient', stockItemId? , ingredientId?, name, unit, before, after}].
// kind defaults to 'product' when omitted, so older call sites (and inventoryStartView's product rows)
// keep working unchanged.
function saveInventory(entries){
  const withStatus = entries.map(e=>{
    const diff = Number((e.after - e.before).toFixed(3));
    const kind = e.kind || 'product';
    let costPerUnit = 0;
    if(kind==='ingredient'){
      const ing = state.recipeIngredients.find(i=>i.id===e.ingredientId);
      costPerUnit = ing ? ingredientCostPerUnit(ing) : 0;
    } else {
      const item = state.stockItems.find(i=>i.id===e.stockItemId);
      costPerUnit = item ? (item.costPerUnit||0) : 0;
    }
    const diffValue = Number((diff * costPerUnit).toFixed(2));
    return { ...e, kind, diff, costPerUnit, diffValue, status: diff>0 ? 'more' : (diff<0 ? 'less' : 'match') };
  });
  withStatus.forEach(e=>{
    if(e.diff===0) return;
    if(e.kind==='ingredient'){
      const ing = state.recipeIngredients.find(i=>i.id===e.ingredientId);
      if(ing) recordIngredientChange(ing, state.currentWarehouse, e.diff, 'Інвентаризація');
    } else {
      const item = state.stockItems.find(i=>i.id===e.stockItemId);
      if(item) recordStockChange(item, e.diff, 'Інвентаризація');
    }
  });
  const u = curUser();
  state.inventories.unshift({
    id: uid(), warehouseId: state.currentWarehouse, ts: nowStr(), who: u?u.name:'-',
    items: withStatus
  });
  if(state.inventories.length>200) state.inventories.pop();
  const changed = withStatus.filter(e=>e.diff!==0).length;
  logEvent('inventory', `Інвентаризація складу «${(state.warehouses.find(w=>w.id===state.currentWarehouse)||{}).name||''}»: ${changed} з ${withStatus.length} позицій з розбіжністю`);
  view = 'stock';
  stockSubview = 'inventory';
  saveState(); render();
}
// Write-offs are deliberate, reasoned removals (spoilage, expiry, breakage) — distinct from an
// inventory shortfall, which reflects an unexplained gap discovered during a count.
// kind: 'product' (default, writes off a state.stockItems row) or 'ingredient' (writes off a
// ready-made recipe ingredient — a soup/sauce batch — tracked in state.ingredientStock instead).
function saveWriteOff(kind, refId, qty, reason, comment){
  if(qty<=0) return;
  const warehouseId = state.currentWarehouse;
  let name, unit, costPerUnit, q;
  if(kind==='ingredient'){
    const ing = state.recipeIngredients.find(i=>i.id===refId);
    if(!ing) return;
    const have = ingredientQtyAt(ing.id, warehouseId);
    q = Math.min(qty, have>0?have:qty);
    costPerUnit = ingredientCostPerUnit(ing);
    recordIngredientChange(ing, warehouseId, -q, 'Списання: '+reason);
    name = ing.name; unit = ing.unit;
  } else {
    const item = state.stockItems.find(i=>i.id===refId);
    if(!item) return;
    q = Math.min(qty, item.qty>0?item.qty:qty);
    costPerUnit = item.costPerUnit||0;
    recordStockChange(item, -q, 'Списання: '+reason);
    name = item.name; unit = item.unit;
  }
  const u = curUser();
  const value = Number((q * costPerUnit).toFixed(2));
  state.writeOffs.unshift({
    id: uid(), warehouseId, kind, stockItemId: kind==='product'?refId:undefined, ingredientId: kind==='ingredient'?refId:undefined,
    name, unit, qty: q, reason, comment: comment||'', costPerUnit, value,
    who: u?u.name:'-', ts: nowStr()
  });
  if(state.writeOffs.length>300) state.writeOffs.pop();
  logEvent('writeoff', `Списано: ${name}, ${fmt(q)} ${unit} (${reason})`);
  view = 'stock';
  stockSubview = 'writeoffs';
  saveState(); render();
}
// ---- Графік змін (work schedule) — the owner assigns, per calendar date, which staff member works
// at which точка. Separate from the cash-register "Зміни" above: this is a roster planned in advance,
// not a record of an actual opened/closed till. Один запис = один співробітник на один день.
function scheduleEntriesForDate(dateKey){
  return state.shiftSchedule.filter(e=>e.dateKey===dateKey);
}
// All planned shifts for one точка, earliest first — used by "Графік змін" location drill-down so the
// owner can see, per location, which dates are already covered and by whom.
function scheduleEntriesForLocation(locationId){
  return state.shiftSchedule.filter(e=>e.locationId===locationId).slice().sort((a,b)=> a.dateKey<b.dateKey?-1:(a.dateKey>b.dateKey?1:0));
}
function scheduleEntryFor(staffId, dateKey){
  return state.shiftSchedule.find(e=>e.staffId===staffId && e.dateKey===dateKey) || null;
}
function todayScheduleFor(staffId){
  return scheduleEntryFor(staffId, dateKeyFromOffset(0));
}
// Замінює собою вимогу «спершу відкрийте зміну»: касир бачить повний функціонал (замовлення, запит
// поставки, перелік товарів) лише в ті дні, коли власник призначив його в «Графіку змін» на сьогодні.
// Для будь-якої іншої ролі це завжди true — обмеження стосується лише касира.
function isScheduledToday(){
  const u = curUser();
  if(!u || u.role!=='cashier') return true;
  return !!todayScheduleFor(u.id);
}
// Assigns (or reassigns) one staff member to one location on one date — a staff member can only be
// in one place per day, so an existing entry for that pair is overwritten rather than duplicated.
function setScheduleEntry(dateKey, staffId, locationId){
  let entry = scheduleEntryFor(staffId, dateKey);
  if(entry){ entry.locationId = locationId; }
  else { state.shiftSchedule.push({ id: uid(), dateKey, staffId, locationId }); }
  saveState();
}
function removeScheduleEntry(id){
  state.shiftSchedule = state.shiftSchedule.filter(e=>e.id!==id);
  saveState();
}

// ---- Завдання: будь-хто (переважно власник) доручає щось конкретному співробітнику будь-якої ролі,
// або всім співробітникам певної ролі одразу (assignedToStaffId не вказано — тоді дивляться на
// assignedToRole), або касир автоматично створює запит на додаткову позицію в поставці ("cashier_request").
function addTask({title, description, dueDate, assignedToRole, assignedToStaffId, createdBy, source}){
  const task = {
    id: uid(), title, description: description||'', dueDate: dueDate||'',
    createdBy: createdBy || (curUser()?curUser().name:'-'), createdAt: nowStr(),
    status: 'pending', source: source || 'manual',
    assignedToRole: assignedToRole || 'prep', assignedToStaffId: assignedToStaffId || null
  };
  state.tasks.unshift(task);
  logEvent('task', `Створено завдання: ${title}`);
  saveState(); render();
  return task;
}
// Завдання, які бачить цей конкретний співробітник (будь-якої ролі): призначені особисто йому,
// або відкриті для будь-кого з його ролі (assignedToStaffId не вказано). Виконані/відхилені йому
// вже не потрібні.
function tasksForStaff(staffId){
  const staff = state.staff.find(s=>s.id===staffId);
  if(!staff) return [];
  return state.tasks.filter(t=>
    (t.assignedToStaffId===staffId || (!t.assignedToStaffId && t.assignedToRole===staff.role)) &&
    (t.status==='pending' || t.status==='postponed')
  );
}
function setTaskStatus(id, status){
  const t = state.tasks.find(x=>x.id===id);
  if(!t) return;
  t.status = status;
  t.statusChangedAt = nowStr();
  t.statusChangedBy = curUser() ? curUser().name : '-';
  saveState();
}
// Касир просить додаткову позицію в наступній поставці — це автоматично стає завданням для
// заготівельника (assignedToStaffId не вказано, бачить будь-який заготівельник).
// Повноекранна вкладка «Запросити поставку» для касира (замінила собою модалку) — прохання про
// додаткову позицію автоматично стає завданням для заготівельника (assignedToStaffId не вказано,
// бачить будь-який заготівельник).
// «Запросити поставку» — касир може одним запитом попросити одразу кілька позицій (як у формі
// «Закупівля»/«Нова заготовка»): додає позиції в чернетку, і лише тоді надсилає — все стає ОДНИМ
// завданням для заготівельника з переліком усіх позицій, а не окремим завданням на кожну.
function cashierRequestView(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`<div class="font-bold mb-4" style="font-size:1.2rem">Запросити поставку</div>`));

  if(!isScheduledToday()){
    wrap.appendChild(el(`<div class="sub text-sm py-10 text-center">Функція доступна лише в дні, коли вас призначено на зміну в «Графіку змін».</div>`));
    return wrap;
  }

  const items = state.recipeIngredients;
  if(items.length===0){
    wrap.appendChild(el(`<div class="sub text-sm py-10 text-center">Поки немає жодного інгредієнта в довіднику — запит нема на що оформити.</div>`));
    return wrap;
  }

  let draftItems = [];
  wrap.appendChild(el(`<div class="font-semibold text-sm mb-2">Позиції запиту</div>`));
  const itemsHost = el(`<div class="mb-2"></div>`);
  wrap.appendChild(itemsHost);
  function renderDraftItems(){
    itemsHost.innerHTML = '';
    if(draftItems.length===0){
      itemsHost.appendChild(el(`<div class="sub text-xs mb-2">Ще не додано жодної позиції</div>`));
    }
    draftItems.forEach((it,idx)=>{
      const row = el(`
        <div class="card p-3 mb-2 flex items-center justify-between">
          <div class="font-medium text-sm">${escapeHtml(it.name)}: ${fmt(it.qty)} ${escapeHtml(it.unit)}</div>
          <button data-rm style="background:none;border:none;color:var(--danger);font-size:1.1rem;padding:0 4px;cursor:pointer">&times;</button>
        </div>
      `);
      row.querySelector('[data-rm]').onclick = ()=>{ draftItems = draftItems.filter((x,i)=>i!==idx); renderDraftItems(); };
      itemsHost.appendChild(row);
    });
  }
  renderDraftItems();

  const formCard = el(`<div class="card p-3 mb-4" style="background:var(--card3)"></div>`);
  formCard.appendChild(el(`<div class="font-semibold text-sm mb-2">Додати позицію</div>`));

  formCard.appendChild(el(`<div class="sub text-xs mb-1.5">Що потрібно</div>`));
  const selHost = el(`<div class="mb-2"></div>`);
  let selectedId = items[0].id;
  const sel = customSelect(items.map(i=>({value:i.id, label:i.name})), selectedId, (v)=>{ selectedId = v; });
  selHost.appendChild(sel);
  formCard.appendChild(selHost);

  formCard.appendChild(el(`<div class="sub text-xs mb-1">Скільки потрібно</div>`));
  const qtyInput = el(`<input type="text" inputmode="decimal" class="w-full py-2.5 px-3 mb-2" style="border-radius:10px;background:var(--card2);color:var(--text);border:1px solid rgba(47,65,114,.25)" placeholder="0">`);
  formCard.appendChild(qtyInput);

  const formErr = el(`<div class="text-sm mb-2" style="color:var(--danger);min-height:1.2em"></div>`);
  formCard.appendChild(formErr);

  const addItemBtn = el(`<button class="w-full btn-solid py-2.5">Додати позицію</button>`);
  addItemBtn.onclick = ()=>{
    const qty = parseFloat((qtyInput.value||'').replace(',','.')) || 0;
    if(qty<=0){ formErr.textContent = 'Вкажіть кількість більше нуля'; return; }
    const ing = items.find(i=>i.id===selectedId);
    formErr.textContent = '';
    const existing = draftItems.find(x=>x.ingredientId===ing.id);
    if(existing) existing.qty += qty;
    else draftItems.push({ ingredientId: ing.id, name: ing.name, unit: ing.unit, qty });
    qtyInput.value = '';
    renderDraftItems();
  };
  formCard.appendChild(addItemBtn);
  wrap.appendChild(formCard);

  wrap.appendChild(el(`<div class="sub text-xs mb-1">Коментар (необов'язково)</div>`));
  const noteInput = el(`<input type="text" class="w-full py-2.5 px-3 mb-3" style="border-radius:10px;background:var(--card2);color:var(--text);border:1px solid rgba(47,65,114,.25)" placeholder="Наприклад, терміново">`);
  wrap.appendChild(noteInput);

  const err = el(`<div class="text-sm mb-2" style="color:var(--danger);min-height:1.2em"></div>`);
  wrap.appendChild(err);

  const okBtn = el(`<button class="w-full btn-solid py-3">Надіслати</button>`);
  okBtn.onclick = ()=>{
    if(draftItems.length===0){ err.textContent = 'Додайте хоча б одну позицію'; return; }
    const u = curUser();
    const locName = (state.locations.find(l=>l.id===state.activeLocationId)||{}).name || '';
    const title = draftItems.length===1
      ? `Запит поставки: ${draftItems[0].name} (${fmt(draftItems[0].qty)} ${draftItems[0].unit})${locName?' → '+locName:''}`
      : `Запит поставки: ${draftItems.length} поз.${locName?' → '+locName:''}`;
    const itemsList = draftItems.map(it=> `${it.name}: ${fmt(it.qty)} ${it.unit}`).join('\n');
    const note = noteInput.value.trim();
    addTask({
      title,
      description: note ? `${itemsList}\n\n${note}` : itemsList,
      createdBy: u ? u.name : '-',
      source: 'cashier_request'
    });
    draftItems = []; renderDraftItems();
    noteInput.value = ''; err.textContent = '';
    appAlert('Запит надіслано заготівельнику.');
  };
  wrap.appendChild(okBtn);

  return wrap;
}
// ---- Оцінка прийому зміни ("Прийняти зміну") ----
// Зміна більше НЕ відкривається/закривається вручну — хто сьогодні працює на точці, визначає лише
// «Графік змін». Коли за графіком на точку виходить ІНША людина, ніж та, що працювала там
// попереднього робочого дня, новий касир перед початком роботи оцінює 5 пунктів того, як точку
// залишив попередник. Тільки 2 варіанти відповіді — "Добре" (+0.2 до рейтингу) чи "Погано" (+0).
// Максимум 1.0, коли всі 5 пунктів добре.
const SHIFT_RATING_QUESTIONS = [
  { key:'cleanliness', label:'Чистота' },
  { key:'prep', label:'Заготовки' },
  { key:'stickers', label:'Стикери' },
  { key:'display', label:'Викладання товару' },
  { key:'tasks', label:'Виконання задач' }
];
// Найближчий ПОПЕРЕДНІЙ (строго раніше beforeDateKey) запис у Графіку змін на цій точці — людина,
// що працювала там останнього разу перед цим днем.
function priorScheduleEntryFor(locationId, beforeDateKey){
  const entries = state.shiftSchedule.filter(e=>e.locationId===locationId && e.dateKey<beforeDateKey);
  if(entries.length===0) return null;
  return entries.reduce((latest,e)=> (!latest || e.dateKey>latest.dateKey) ? e : latest, null);
}
// "Прийняти зміну" з'являється лише коли: сьогодні касира призначено на цю точку за графіком, і
// попереднього робочого дня там за графіком був ІНШИЙ працівник, і цю передачу (для цього касира й
// цього дня) він ще не оцінив.
function pendingScheduleHandover(locationId){
  const u = curUser();
  if(!u) return null;
  const todayKey = localDateKey(new Date());
  const todayEntry = scheduleEntryFor(u.id, todayKey);
  if(!todayEntry || todayEntry.locationId!==locationId) return null;
  const prior = priorScheduleEntryFor(locationId, todayKey);
  if(!prior || prior.staffId===u.id) return null;
  const alreadyRated = state.shiftRatings.some(r=>r.locationId===locationId && r.forDateKey===todayKey && r.byStaffId===u.id);
  if(alreadyRated) return null;
  return prior;
}
function addShiftRating(priorEntry, answers){
  const u = curUser();
  const ratedStaff = state.staff.find(s=>s.id===priorEntry.staffId);
  const score = SHIFT_RATING_QUESTIONS.reduce((sum,q)=> sum + (answers[q.key]==='good' ? 0.2 : 0), 0);
  const forDateKey = localDateKey(new Date());
  const rating = {
    id: uid(), locationId: priorEntry.locationId,
    ratedStaffId: priorEntry.staffId, ratedStaffName: ratedStaff ? ratedStaff.name : '-',
    priorDateKey: priorEntry.dateKey,
    byStaffId: u?u.id:null, byStaffName: u?u.name:'-',
    forDateKey,
    answers: Object.assign({}, answers),
    score: Number(score.toFixed(2)),
    dateKey: forDateKey, tsMs: Date.now(), periodKey: periodKeyForDateKey(forDateKey)
  };
  state.shiftRatings.unshift(rating);
  logEvent('shiftRating', `Оцінка зміни: ${rating.ratedStaffName} — ${Math.round(rating.score*100)}% (від ${rating.byStaffName})`);
  saveState();
  return rating;
}
// Періоди нарахування бонусу й зарплати: 11-25 включно, і 26-10 (наступного місяця) включно —
// рахуються окремо.
function periodKeyForDateKey(dateKey){
  const [y,m,d] = dateKey.split('-').map(Number);
  if(d>=11 && d<=25) return `${y}-${String(m).padStart(2,'0')}-A`;
  if(d>=26) return `${y}-${String(m).padStart(2,'0')}-B`;
  // d<=10 належить до "B" ПОПЕРЕДНЬОГО місяця (26 попереднього — 10 цього).
  let py=y, pm=m-1;
  if(pm===0){ pm=12; py=y-1; }
  return `${py}-${String(pm).padStart(2,'0')}-B`;
}
function periodLabel(periodKey){
  const [yStr, mStr, suffix] = periodKey.split('-');
  const y = Number(yStr), mNum = Number(mStr);
  const mName = SCHEDULE_MONTH_NAMES[mNum-1];
  if(suffix==='A') return `11–25 ${mName} ${y}`;
  let ny=y, nm=mNum+1;
  if(nm===13){ nm=1; ny=y+1; }
  return `26 ${mName} – 10 ${SCHEDULE_MONTH_NAMES[nm-1]} ${ny}`;
}
// Календарні межі [start, end] (dateKey) конкретного періоду — щоб пройтись по кожному дню періоду
// й порахувати зарплату наростаючим підсумком.
function periodDateRange(periodKey){
  const [yStr, mStr, suffix] = periodKey.split('-');
  const y = Number(yStr), m = Number(mStr);
  if(suffix==='A'){
    return { start: `${y}-${String(m).padStart(2,'0')}-11`, end: `${y}-${String(m).padStart(2,'0')}-25` };
  }
  let ny=y, nm=m+1;
  if(nm===13){ nm=1; ny=y+1; }
  return { start: `${y}-${String(m).padStart(2,'0')}-26`, end: `${ny}-${String(nm).padStart(2,'0')}-10` };
}
// Усі dateKey між startKey і endKey включно, по порядку.
function dateKeysInRange(startKey, endKey){
  const [sy,sm,sd] = startKey.split('-').map(Number);
  const [ey,em,ed] = endKey.split('-').map(Number);
  const start = new Date(sy, sm-1, sd);
  const end = new Date(ey, em-1, ed);
  const out = [];
  const cur = new Date(start);
  while(cur<=end){
    out.push(localDateKey(cur));
    cur.setDate(cur.getDate()+1);
  }
  return out;
}
// Поточний і попередній періоди (найновіший першим) — те, що власник найчастіше хоче бачити.
function recentPeriodKeys(n){
  const out = [];
  let d = new Date();
  let key = periodKeyForDateKey(localDateKey(d));
  out.push(key);
  while(out.length<n){
    const [y,m,suffix] = key.split('-');
    let py=Number(y), pm=Number(m), psuf;
    if(suffix==='A'){ psuf='B'; pm -= 1; if(pm===0){ pm=12; py-=1; } }
    else { psuf='A'; }
    key = `${py}-${String(pm).padStart(2,'0')}-${psuf}`;
    out.push(key);
  }
  return out;
}
// Середній бал працівника за конкретний період (0..1) — це і є множник бонусу. null, якщо за цей
// період ще не було жодної оцінки.
function staffRatingForPeriod(staffId, periodKey){
  const list = state.shiftRatings.filter(r=>r.ratedStaffId===staffId && r.periodKey===periodKey);
  if(list.length===0) return null;
  const avg = list.reduce((s,r)=>s+r.score,0) / list.length;
  return { avg: Number(avg.toFixed(2)), count: list.length };
}
function openInventoryDetail(id){
