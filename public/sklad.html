    glovoDraft = { locationId: glovoLocationForUser(), items: [], commissionPct: g.commissionPct, whenStr: '', comment: '' };
    view = 'glovoAdd'; render();
  };
  wrap.appendChild(addBtn);
  wrap.appendChild(segmentedPicker([[1,'Сьогодні'],[7,'7 днів'],[30,'30 днів']].map(x=>[String(x[0]),x[1]]), String(glovoPeriod), (k)=>{ glovoPeriod = Number(k); render(); }));
  const u = curUser();
  const orders = (state.orders||[]).filter(o=> o.source==='glovo' && dateKeyInRange(o.dateKey, glovoPeriod)
      && (owner || (u && o.locationId===glovoLocationForUser())))
    .sort((a,b)=>(b.tsMs||0)-(a.tsMs||0));
  const gross = orders.reduce((s,o)=>s+((o.glovo||{}).gross||0),0);
  const net = orders.reduce((s,o)=>s+o.total,0);
  const cost = orders.reduce((s,o)=> s + (o.items||[]).filter(l=>!l.unmapped).reduce((c,l)=>c+lineUnitCost(l)*l.qty,0), 0);
  wrap.appendChild(el(`
    <div class="card p-4 mb-4">
      <div class="flex items-center justify-between mb-2"><span class="sub text-xs">Замовлень: ${orders.length}</span></div>
      <div class="flex items-center justify-between text-sm mb-1"><span class="sub">Сума в Glovo</span><b>${fmtMoney(gross)}</b></div>
      <div class="flex items-center justify-between text-sm mb-1"><span class="sub">Комісія</span><b style="color:var(--danger)">−${fmtMoney(gross-net)}</b></div>
      <div class="flex items-center justify-between text-sm mb-1"><span class="sub">Чистий оборот</span><b>${fmtMoney(net)}</b></div>
      <div class="flex items-center justify-between text-sm"><span class="sub">Профіт (після собівартості)</span><b style="color:${net-cost<0?'var(--danger)':'var(--accent2)'}">${fmtMoney(net-cost)}</b></div>
    </div>
  `));
  if(!orders.length) wrap.appendChild(el(`<div class="sub text-center py-8">За цей період продажів Glovo немає</div>`));
  orders.forEach(o=>{
    const loc = (state.locations.find(l=>l.id===o.locationId)||{}).name || '';
    const oc = (o.items||[]).filter(l=>!l.unmapped).reduce((c,l)=>c+lineUnitCost(l)*l.qty,0);
    const card = el(`
      <div class="card p-3 mb-2" style="cursor:pointer">
        <div class="flex items-center justify-between">
          <div><div class="font-medium">🛵 Glovo${loc?' · '+escapeHtml(loc):''}</div><div class="sub text-xs">${escapeHtml(o.ts)} · ${escapeHtml(o.who||'')} · ${(o.items||[]).reduce((s,l)=>s+l.qty,0)} поз.</div></div>
          <div style="text-align:right"><div class="font-bold">${fmtMoney(o.total)}</div><div class="sub text-xs">Glovo ${fmtMoney((o.glovo||{}).gross||0)} · профіт ${fmtMoney(o.total-oc)}</div></div>
        </div>
        <div class="gv-lines" style="display:none;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)"></div>
      </div>
    `);
    const box = card.querySelector('.gv-lines');
    (o.items||[]).forEach(l=>{
      box.appendChild(el(`<div class="flex items-start justify-between" style="padding:3px 0"><div style="min-width:0"><div class="text-sm">${escapeHtml(l.glovoName||l.name)} × ${l.qty}</div>${l.glovoName&&l.glovoName!==l.name?`<div class="sub text-xs">меню: ${escapeHtml(l.name)}</div>`:''}</div><div class="text-sm" style="white-space:nowrap;margin-left:8px">${fmtMoney(l.glovoPrice*l.qty)} → <b>${fmtMoney(l.price*l.qty)}</b></div></div>`));
    });
    const cons = o.consumption||[];
    if(cons.length){
      box.appendChild(el(`<div class="font-semibold text-xs" style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)">Списано зі складу</div>`));
      cons.forEach(c=> box.appendChild(el(`<div class="flex items-center justify-between text-xs" style="padding:2px 0"><span>${escapeHtml(c.name)}</span><span class="font-semibold" style="color:var(--danger)">${fmt(c.delta)} ${escapeHtml(c.unit||'')}</span></div>`)));
    }
    if(o.comment) box.appendChild(el(`<div class="sub text-xs" style="margin-top:6px">${escapeHtml(o.comment)}</div>`));
    if(owner){
      const del = el(`<button class="btn-line w-full py-2 mt-3" style="color:var(--danger)">Видалити продаж (склад повернеться)</button>`);
      del.onclick = (e)=>{ e.stopPropagation(); appConfirm('Видалити цей продаж Glovo? Списання зі складу буде скасовано.', ()=>{ deleteGlovoOrder(o); saveState(); render(); }); };
      box.appendChild(del);
    }
    card.addEventListener('click', ()=>{ box.style.display = box.style.display==='none' ? 'block' : 'none'; });
    wrap.appendChild(card);
  });
  return wrap;
}

function openGlovoItemEdit(id){
  const g = glovoCfg();
  const editing = id ? g.items.find(x=>x.id===id) : null;
  showModal((card, close)=>{
    card.appendChild(el(`<div class="font-bold mb-3" style="font-size:1.05rem">${editing?'Редагувати':'Нова'} позиція Glovo</div>`));
    card.appendChild(el(`<div class="sub text-xs mb-1">Назва в Glovo</div>`));
    const nameIn = el(`<input type="text" class="w-full mb-3" placeholder="Як називається в Glovo">`); nameIn.value = editing?editing.name:''; card.appendChild(nameIn);
    card.appendChild(el(`<div class="sub text-xs mb-1">Ціна в Glovo, ₴</div>`));
    const priceIn = el(`<input type="number" step="0.01" min="0" class="w-full mb-1" placeholder="0">`); priceIn.value = editing?editing.price:''; card.appendChild(priceIn);
    const prev = el(`<div class="sub text-xs mb-3"></div>`); card.appendChild(prev);
    card.appendChild(el(`<div class="sub text-xs mb-1">Товар у меню (звідси собівартість і списання)</div>`));
    const sel = customSelect([{value:'',label:'— без зв\'язку —'}].concat(state.products.slice().sort((a,b)=>a.name.localeCompare(b.name,'uk')).map(p=>({value:p.id,label:p.name}))), editing?(editing.productId||''):'', ()=>paint());
    const selHost = el(`<div class="mb-4"></div>`); selHost.appendChild(sel); card.appendChild(selHost);
    function paint(){
      const pr = Number(priceIn.value)||0; const p = state.products.find(x=>x.id===sel.getValue());
      const net = glovoNet(pr, g.commissionPct);
      prev.textContent = pr ? ('Чисто після комісії '+g.commissionPct+'%: '+fmtMoney(net)+(p?(' · собівартість '+fmtMoney(Number(p.costPrice)||0)+' · профіт '+fmtMoney(net-(Number(p.costPrice)||0))):'')) : '';
    }
    priceIn.addEventListener('input', paint); paint();
    const err = el(`<div class="text-xs mb-2" style="color:var(--danger)"></div>`); card.appendChild(err);
    const row = el(`<div class="flex gap-2"></div>`);
    const save = el(`<button class="btn-solid flex-1 py-3">Зберегти</button>`);
    save.onclick = ()=>{
      const name = nameIn.value.trim(); const price = Number(priceIn.value);
      if(!name){ err.textContent='Вкажіть назву'; return; }
      if(!(price>0)){ err.textContent='Вкажіть ціну Glovo'; return; }
      const data = { name, price, productId: sel.getValue()||'' };
      if(editing) Object.assign(editing, data); else g.items.push(Object.assign({ id: uid() }, data));
      logEvent('glovo', (editing?'Змінено':'Додано')+' позицію Glovo: '+name);
      saveState(); close(); render();
    };
    row.appendChild(save);
    if(editing){
      const del = el(`<button class="btn-line py-3 px-4" style="color:var(--danger)">Видалити</button>`);
      del.onclick = ()=>{ g.items = g.items.filter(x=>x.id!==editing.id); saveState(); close(); render(); };
      row.appendChild(del);
    }
    card.appendChild(row);
  });
}

function glovoAddView(){
  const wrap = el(`<div></div>`);
  const g = glovoCfg(); const d = glovoDraft;
  if(!d){ view='glovo'; return glovoView(); }
  const topBar = el(`
    <div class="flex items-center gap-3 mb-4">
      <button id="gaBack" class="navicon-btn" style="background:var(--card3)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="font-bold" style="font-size:1.1rem">Новий продаж Glovo</div>
    </div>`);
  topBar.querySelector('#gaBack').onclick = ()=>{ glovoDraft=null; view='glovo'; render(); };
  wrap.appendChild(topBar);

  const owner = isOwner();
  wrap.appendChild(el(`<div class="sub text-xs mb-1">Точка</div>`));
  if(owner && state.locations.length>1){
    const ls = customSelect(state.locations.map(l=>({value:l.id,label:l.name})), d.locationId, (v)=>{ d.locationId = v; });
    const h = el(`<div class="mb-3"></div>`); h.appendChild(ls); wrap.appendChild(h);
  } else {
    wrap.appendChild(el(`<div class="card p-3 mb-3" style="font-weight:700">${escapeHtml((state.locations.find(l=>l.id===d.locationId)||{}).name||'')}</div>`));
  }
  wrap.appendChild(el(`<div class="sub text-xs mb-1">Дата й час замовлення</div>`));
  const dt = el(`<input type="datetime-local" class="w-full mb-3">`);
  const now = new Date(); now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
  dt.value = d.whenStr || now.toISOString().slice(0,16);
  dt.addEventListener('change', ()=>{ d.whenStr = dt.value; });
  wrap.appendChild(dt);

  wrap.appendChild(el(`<div class="sub text-xs mb-1">Додати позицію</div>`));
  const opts = g.items.slice().sort((a,b)=>a.name.localeCompare(b.name,'uk')).map(i=>({value:i.id,label:i.name+' — '+fmtMoney(i.price)}));
  const pick = customSelect(opts, opts[0].value, ()=>{});
  const addRow = el(`<div class="flex gap-2 mb-3"></div>`);
  const pickHost = el(`<div style="flex:1;min-width:0"></div>`); pickHost.appendChild(pick);
  const qtyIn = el(`<input type="number" min="1" step="1" value="1" style="width:70px">`);
  const addB = el(`<button class="btn-solid px-4">+</button>`);
  addB.onclick = ()=>{
    const q = Math.max(1, Math.floor(Number(qtyIn.value)||1)); const id = pick.getValue();
    const ex = d.items.find(x=>x.itemId===id); if(ex) ex.qty += q; else d.items.push({ itemId:id, qty:q });
    paintList();
  };
  addRow.appendChild(pickHost); addRow.appendChild(qtyIn); addRow.appendChild(addB); wrap.appendChild(addRow);

  const listHost = el(`<div class="mb-3"></div>`); wrap.appendChild(listHost);
  wrap.appendChild(el(`<div class="sub text-xs mb-1">Комісія Glovo, %</div>`));
  const cin = el(`<input type="number" step="0.1" min="0" max="100" class="w-full mb-3">`); cin.value = d.commissionPct; wrap.appendChild(cin);
  const sumHost = el(`<div class="card p-4 mb-3"></div>`); wrap.appendChild(sumHost);
  wrap.appendChild(el(`<div class="sub text-xs mb-1">Коментар (необов'язково)</div>`));
  const cm = el(`<input type="text" class="w-full mb-4" placeholder="Наприклад, номер замовлення Glovo">`); cm.value = d.comment; cm.addEventListener('input', ()=>{ d.comment = cm.value; }); wrap.appendChild(cm);
  const err = el(`<div class="text-xs mb-2" style="color:var(--danger)"></div>`); wrap.appendChild(err);

  function paintList(){
    listHost.innerHTML = '';
    d.items.forEach(it=>{
      const gi = g.items.find(x=>x.id===it.itemId); if(!gi) return;
      const row = el(`<div class="card p-3 mb-2 flex items-center justify-between gap-2"><div style="min-width:0"><div class="font-semibold text-sm">${escapeHtml(gi.name)}</div><div class="sub text-xs">${fmtMoney(gi.price)} × ${it.qty}</div></div><div class="flex items-center gap-2"><button data-m class="w-9 h-9 rounded-full font-bold" style="background:var(--card3);border:none;color:var(--text)">−</button><span class="font-semibold">${it.qty}</span><button data-p class="w-9 h-9 rounded-full font-bold" style="background:var(--card3);border:none;color:var(--text)">+</button></div></div>`);
      row.querySelector('[data-m]').onclick = ()=>{ it.qty--; if(it.qty<=0) d.items = d.items.filter(x=>x!==it); paintList(); };
      row.querySelector('[data-p]').onclick = ()=>{ it.qty++; paintList(); };
      listHost.appendChild(row);
    });
    paintSum();
  }
  function paintSum(){
    const pct = Number(cin.value); d.commissionPct = isFinite(pct) ? pct : g.commissionPct;
    let gross=0, net=0, cost=0;
    d.items.forEach(it=>{ const gi=g.items.find(x=>x.id===it.itemId); if(!gi) return; gross += gi.price*it.qty; net += glovoNet(gi.price,d.commissionPct)*it.qty;
      const p = gi.productId ? state.products.find(x=>x.id===gi.productId) : null; if(p) cost += (Number(p.costPrice)||0)*it.qty; });
    sumHost.innerHTML = `<div class="flex items-center justify-between text-sm mb-1"><span class="sub">Сума в Glovo</span><b>${fmtMoney(gross)}</b></div>
      <div class="flex items-center justify-between text-sm mb-1"><span class="sub">Комісія ${fmt(d.commissionPct)}%</span><b style="color:var(--danger)">−${fmtMoney(gross-net)}</b></div>
      <div class="flex items-center justify-between text-sm mb-1"><span class="sub">Чистий оборот</span><b>${fmtMoney(net)}</b></div>
      <div class="flex items-center justify-between text-sm"><span class="sub">Профіт</span><b style="color:${net-cost<0?'var(--danger)':'var(--accent2)'}">${fmtMoney(net-cost)}</b></div>`;
  }
  cin.addEventListener('input', paintSum);
  paintList();

  const save = el(`<button class="btn-solid w-full py-3.5 mb-4">Зберегти продаж</button>`);
  save.onclick = ()=>{
    if(!d.items.length){ err.textContent = 'Додайте хоча б одну позицію'; return; }
    const ms = new Date(dt.value).getTime();
    if(!isFinite(ms)){ err.textContent = 'Вкажіть дату й час'; return; }
    const pct = Number(cin.value);
    if(!(pct>=0 && pct<=100)){ err.textContent = 'Комісія має бути від 0 до 100%'; return; }
    d.commissionPct = pct; d.ms = ms;
    applyGlovoOrder(d);
    glovoDraft = null; saveState();
    showToast('Продаж Glovo збережено', 'success');
    view = 'glovo'; render();
  };
  wrap.appendChild(save);
  return wrap;
}

function staffEditView(){
  const wrap = el(`<div></div>`);

  }

  const topBar = el(`
    <div class="flex items-center gap-3 mb-5">
      <button id="seBack" class="navicon-btn" style="background:var(--card3)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="font-bold" style="font-size:1.1rem">Редагування співробітника</div>
    </div>
  `);
  topBar.querySelector('#seBack').onclick = ()=>{ editingStaffId=null; view='settings'; render(); };
  wrap.appendChild(topBar);

  const avatarVal = s.avatar || '';
  const avatarWrap = el(`
    <div class="flex flex-col items-center mb-6">
      <div id="seAvatar" class="flex items-center justify-center mb-2" style="width:80px;height:80px;border-radius:999px;background:var(--card3);font-size:${avatarVal?'2.2rem':'1.3rem'};font-weight:700">${avatarVal?escapeHtml(avatarVal):escapeHtml(initials(s.name))}</div>
      <input id="seAvatarInput" type="text" maxlength="4" placeholder="Емодзі (необов'язково)" class="text-center py-2 px-3" style="width:200px;border-radius:12px;background:var(--card3);color:var(--text);border:none">
    </div>
  `);
  const avatarCircle = avatarWrap.querySelector('#seAvatar');
  const avatarInput = avatarWrap.querySelector('#seAvatarInput');
  avatarInput.value = avatarVal;
  wrap.appendChild(avatarWrap);

  function field(label, value, placeholder){
    const f = el(`
      <div class="mb-4">
        <div class="sub text-xs mb-1.5">${escapeHtml(label)}</div>
        <input type="text" class="w-full py-3 px-3" style="border-radius:14px;background:var(--card3);color:var(--text);border:none" placeholder="${escapeHtml(placeholder||'')}">
      </div>
    `);
    f.querySelector('input').value = value||'';
    return f;
  }

  const nameField = field("Ім'я", s.name);
  const nameInput = nameField.querySelector('input');
  wrap.appendChild(nameField);

  avatarInput.addEventListener('input', ()=>{
    const v = avatarInput.value.trim();
    avatarCircle.textContent = v ? v : initials(nameInput.value || s.name);
    avatarCircle.style.fontSize = v ? '2.2rem' : '1.3rem';
  });

  const posField = field('Посада', s.position, 'Наприклад, Касир, Кухар');
  const posInput = posField.querySelector('input');
  wrap.appendChild(posField);

  let draftRole = s.role;
  let draftLocationId = s.locationId;
  const locWrap = el(`<div class="mb-4" style="display:none"></div>`);
  function refreshLocPicker(){
    locWrap.innerHTML = '';
    if(draftRole==='cashier'){
      locWrap.style.display = '';
      locWrap.appendChild(el(`<div class="sub text-xs mb-1.5">Точка за замовчуванням (без призначення в Графіку змін)</div>`));
      const locSel = customSelect(
        state.locations.map(l=>({value:l.id, label:l.name})),
        draftLocationId || state.currentLocation,
        (val)=>{ draftLocationId = val; }
      );
      locWrap.appendChild(locSel);
    } else {
      locWrap.style.display = 'none';
    }
  }
  const otherOwnersCount = state.staff.filter(x=>x.id!==s.id && x.role==='owner').length;
  const roleLocked = s.role==='owner' && otherOwnersCount===0;
  if(!roleLocked){
    wrap.appendChild(el(`<div class="sub text-xs mb-1.5">Роль</div>`));
    const roleRow = el(`<div class="flex flex-wrap gap-2 mb-4"></div>`);
    const roleBtns = {};
    [['owner','Власник'],['cook','Кухар'],['prep','Заготівельник'],['cashier','Касир']].forEach(([key,label])=>{
      const active = key===draftRole;
      const b = el(`<button class="py-2.5 px-3.5" style="border-radius:999px;font-weight:600;font-size:.8rem;border:none;background:${active?'var(--accent)':'var(--card3)'};color:${active?'#fff':'var(--text)'}">${label}</button>`);
      b.onclick = ()=>{
        draftRole = key;
        Object.entries(roleBtns).forEach(([k,btn])=>{
          const on = k===draftRole;
          btn.style.background = on ? 'var(--accent)' : 'var(--card3)';
          btn.style.color = on ? '#fff' : 'var(--text)';
        });
        refreshLocPicker();
      };
      roleBtns[key] = b;
      roleRow.appendChild(b);
    });
    wrap.appendChild(roleRow);
    wrap.appendChild(locWrap);
    refreshLocPicker();
  } else {
    wrap.appendChild(el(`<div class="sub text-xs mb-4">Роль: Власник · це єдиний власник, роль не можна змінити</div>`));
  }

  const pinField = field('Новий пін-код', '', s.hasPin ? 'Залиште порожнім, щоб не змінювати' : '4-6 цифр');
  const pinInput = pinField.querySelector('input');
  pinInput.setAttribute('inputmode','numeric');
  wrap.appendChild(pinField);

  const err = el(`<div class="text-sm mb-3" style="color:var(--danger);min-height:1.2em"></div>`);
  wrap.appendChild(err);

  const saveBtn = el(`<button class="w-full btn-solid py-3 mb-3">Зберегти</button>`);
  saveBtn.onclick = ()=>{
    const name = nameInput.value.trim();
    if(!name){ err.textContent = "Введіть ім'я"; return; }
    const pin = pinInput.value.trim();
    if(!pin && !s.hasPin){ err.textContent = 'Введіть пін-код'; return; }
    if(pin && !/^\d{4,6}$/.test(pin)){ err.textContent = 'Пін — 4-6 цифр'; return; }
    s.name = name;
    s.position = posInput.value.trim();
    if(pin){ s.pin = pin; s.hasPin = true; delete s.pinDefault; } // відкритий пін йде на сервер один раз і там хешується
    s.avatar = avatarInput.value.trim();
    if(!roleLocked){
      s.role = draftRole;
      if(draftRole==='cashier') s.locationId = draftLocationId || state.currentLocation;
    }
    logEvent('staff', `Редаговано співробітника: ${s.name} (${roleLabel(s.role)})`);
    saveState();
    editingStaffId = null;
    view = 'settings';
    render();
  };
  wrap.appendChild(saveBtn);

  if(!roleLocked){
    const delBtn = el(`<button class="w-full btn-line py-3" style="color:var(--danger)">Видалити співробітника</button>`);
    delBtn.onclick = ()=>{
      appConfirm('Видалити '+s.name+'?', ()=>{
        deleteStaff(s.id);
        editingStaffId = null;
        view = 'settings';
        render();
      });
    };
    wrap.appendChild(delBtn);
  }

  return wrap;
}

  `);
  topBar.querySelector('#mBack').onclick = ()=>{ view='settings'; render(); };
  wrap.appendChild(topBar);

  const addProductBtn = el(`<button class="w-full btn-line py-3 mb-4">+ Додати товар</button>`);
  // Новий товар додається одразу в категорію активного таба (якщо жоден не обраний — за
  // замовчуванням Фастфуд, як і раніше).
  addProductBtn.onclick = ()=>{ editingProductId=null; menuAddDefaultCategory = menuCategoryFilter || 'fastfood'; view='productAdd'; render(); };
  wrap.appendChild(addProductBtn);

  wrap.appendChild(categoryTabsAndSearch(
    menuCategoryFilter,
    (key)=>{ menuCategoryFilter = key; render(); },
    menuSearchQuery,
    (val)=>{ menuSearchQuery = val; render(); },
    'Пошук товару'
  ));

  if(state.products.length===0){
    wrap.appendChild(el(`<div class="sub text-sm text-center py-4">Меню поки порожнє</div>`));
  } else {
    const items = productsFiltered(menuCategoryFilter, menuSearchQuery);
    if(items.length===0){
      wrap.appendChild(el(`<div class="sub text-sm text-center py-4">Нічого не знайдено</div>`));
    }
    items.forEach(p=>{
      const margin = p.price - (p.costPrice||0);
      const catTag = p.category==='fastfood' ? 'Фастфуд' : "М'ясо з Техасу";
      const row = el(`
        <div class="card p-3 mb-2 flex items-center justify-between">
          <div>
            <div class="font-medium">${escapeHtml(p.name)} ${p.type==='dish'?'<span class="sub" style="font-size:.65rem">· страва</span>':(p.type==='combo'?'<span class="sub" style="font-size:.65rem">· комбо</span>':'')}</div>
            ${p.type==='combo'?(p.comboSlots||[]).map(sl=>`<div class="sub text-xs">${escapeHtml(sl.label)}: ${(sl.productIds||[]).map(id=>{const x=state.products.find(q=>q.id===id);return escapeHtml(x?x.name:'?');}).join(', ')}</div>`).join(''):''}
            <div class="sub text-xs">Ціна: ${fmtMoney(p.price)} · Собівартість: ${fmtMoney(p.costPrice||0)} · Маржа: ${fmtMoney(margin)}${!menuCategoryFilter?' · '+escapeHtml(catTag):''}</div>
            ${p.modifier?`<div class="sub text-xs">${escapeHtml(p.modifier.label)}: ${p.modifier.options.map(o=>escapeHtml(o.name)).join(', ')}</div>`:''}
            ${(p.optionGroups||[]).map(g=>`<div class="sub text-xs">${escapeHtml(g.label)}: ${(g.options||[]).map(o=>escapeHtml(o.name)).join(', ')}</div>`).join('')}
          </div>
          <div class="flex items-center gap-2">
            <button data-edit class="navicon-btn" style="background:var(--card3);width:32px;height:32px">${ICONS.edit}</button>
            <button data-del class="navicon-btn" style="background:var(--card3);width:32px;height:32px">${ICONS.trash}</button>
          </div>
        </div>
      `);
      const editBtn = row.querySelector('[data-edit]');
      const editSvg = editBtn.querySelector('svg');
      editSvg.style.width = '15px'; editSvg.style.height = '15px'; editSvg.style.stroke = 'var(--accent)';
      editBtn.onclick = ()=>{ editingProductId = p.id; view='productAdd'; render(); };
      const delBtn = row.querySelector('[data-del]');
      const delSvg = delBtn.querySelector('svg');
      delSvg.style.width = '15px'; delSvg.style.height = '15px'; delSvg.style.stroke = 'var(--danger)';
      delBtn.onclick = ()=>{ appConfirm('Видалити "'+p.name+'"?', ()=> deleteProduct(p.id)); };
      wrap.appendChild(row);
    });
  }
  return wrap;
}

function productAddView(){
  const editing = editingProductId ? state.products.find(p=>p.id===editingProductId) : null;
  const wrap = el(`<div></div>`);
  const topBar = el(`
    <div class="flex items-center gap-3 mb-5">
      <button id="paBack" class="navicon-btn" style="background:var(--card3)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="font-bold" style="font-size:1.1rem">${editing?'Редагування товару':'Новий товар'}</div>
    </div>
  `);
  topBar.querySelector('#paBack').onclick = ()=>{ editingProductId=null; view='menu'; render(); };
  wrap.appendChild(topBar);

  let draftType = editing ? editing.type : 'product'; // 'product' | 'dish'
  let draftIngredients = editing ? (editing.ingredients||[]).map(i=>({...i})) : []; // {id, ingredientId, name, unit, amount, costPerUnit, cost}

  function field(label, placeholder){
    const f = el(`
      <div class="mb-4">
        <div class="sub text-xs mb-1.5">${escapeHtml(label)}</div>
        <input type="text" class="w-full py-3 px-3" style="border-radius:14px;background:var(--card3);color:var(--text);border:none" placeholder="${escapeHtml(placeholder||'')}">
      </div>
    `);
    return f;
  }

  const nameField = field('Назва товару', 'Наприклад, Шаурма класична');
  const nameInput = nameField.querySelector('input');
  if(editing) nameInput.value = editing.name;
  wrap.appendChild(nameField);

  // --- Категорія ---
  wrap.appendChild(el(`<div class="sub text-xs mb-1.5">Категорія</div>`));
  let draftCategory = editing ? editing.category : menuAddDefaultCategory;
  const catRow = segmentedPicker(
    [['meat',"М'ясо з Техасу",'🥩'],['fastfood','Фастфуд','🌯']],
    draftCategory,
    (key)=>{ draftCategory = key; }
  );
  wrap.appendChild(catRow);

  // --- Тип: товар / страва ---
  wrap.appendChild(el(`<div class="sub text-xs mb-1.5">Тип</div>`));
  const dishSection = el(`<div></div>`);
  const costPriceField = field('Собівартість, ' + String.fromCharCode(8372));
  const costPriceInput = costPriceField.querySelector('input');
  costPriceInput.setAttribute('inputmode','decimal');

  const comboSection = el(`<div></div>`);
  let draftSlots = editing ? (editing.comboSlots||[]).map(sl=>({ ...sl, productIds:(sl.productIds||[]).slice() })) : [];
  function comboAvgCost(){
    return draftSlots.reduce((sum, sl)=>{
      const costs = (sl.productIds||[]).map(id=>{ const x = state.products.find(q=>q.id===id); return x ? (Number(x.costPrice)||0) : 0; });
      return sum + (costs.length ? costs.reduce((a,b)=>a+b,0)/costs.length : 0);
    }, 0);
  }
  function refreshTypeUI(){
    dishSection.style.display = draftType==='dish' ? '' : 'none';
    comboSection.style.display = draftType==='combo' ? '' : 'none';
    if(draftType==='combo'){
      costPriceInput.disabled = true;
      costPriceInput.style.opacity = '.6';
      costPriceInput.value = comboAvgCost().toFixed(2);
    } else if(draftType==='dish'){
      costPriceInput.disabled = true;
      costPriceInput.style.opacity = '.6';
      recalcCost();
    } else {
      costPriceInput.disabled = false;
      costPriceInput.style.opacity = '1';
    }
  }

  const typeRow = segmentedPicker(
    [['product','Товар','📦'],['dish','Страва','🍲'],['combo','Комбо','🍔']],
    draftType,
    (key)=>{ draftType = key; refreshTypeUI(); }
  );
  wrap.appendChild(typeRow);

  // --- Інгредієнти (тільки для страви) ---
  const ingHeader = el(`<div class="flex items-center justify-between mb-2"><div class="font-semibold text-sm">Інгредієнти</div></div>`);
  dishSection.appendChild(ingHeader);
  const ingList = el(`<div class="mb-2"></div>`);
  dishSection.appendChild(ingList);

  function recalcCost(){
    const sum = draftIngredients.reduce((s,i)=>s+i.cost,0);
    costPriceInput.value = sum ? sum.toFixed(2) : '0';
  }

  function renderIngList(){
    ingList.innerHTML = '';
    const available = state.recipeIngredients;
    if(draftIngredients.length===0){
      ingList.appendChild(el(`<div class="sub text-xs mb-2">Ще не додано жодного інгредієнта</div>`));
    }
    draftIngredients.forEach(line=>{
      const row = el(`
        <div class="card p-3 mb-2 flex items-center justify-between">
          <div>
            <div class="font-medium text-sm">${escapeHtml(line.name)}</div>
            <div class="sub text-xs">${fmt(line.amount)} ${escapeHtml(line.unit)} · ${fmtMoney(line.cost)}</div>
          </div>
          <button data-rm style="background:none;border:none;color:var(--danger);font-size:1.1rem;padding:0 4px;cursor:pointer">&times;</button>
        </div>
      `);
      row.querySelector('[data-rm]').onclick = ()=>{
        draftIngredients = draftIngredients.filter(x=>x.id!==line.id);
        renderIngList();
        recalcCost();
      };
      ingList.appendChild(row);
    });

    if(available.length===0){
      dishSection.querySelector('[data-addingpanel]')?.remove();
      const noIng = el(`<div data-addingpanel class="sub text-xs mb-4">Ще немає жодного інгредієнта. Додайте їх у розділі «Рецепти» в налаштуваннях.</div>`);
      ingList.after(noIng);
      return;
    }
  }
  renderIngList();

  const addIngRow = el(`
    <div class="card p-3 mb-4" style="background:var(--card3)">
      <div data-selhost class="mb-2"></div>
      <div class="flex gap-2">
        <input type="text" inputmode="decimal" placeholder="Кількість" class="flex-1 py-2.5 px-3" style="border-radius:10px;background:var(--card2);color:var(--text);border:none">
        <button class="btn-solid" style="padding:0 20px">Додати</button>
      </div>
    </div>
  `);
  const ingSelectHost = addIngRow.querySelector('[data-selhost]');
  const ingAmountInput = addIngRow.querySelector('input');
  const ingAddBtn = addIngRow.querySelector('button');
  let ingSelect = customSelect(
    availableRecipeIngredients().map(ing=>({value:ing.id, label:ing.name+' ('+ing.unit+')'})),
    null, null
  );
  ingSelectHost.appendChild(ingSelect);
  ingAddBtn.onclick = ()=>{
    const ingId = ingSelect.getValue();
    const ing = availableRecipeIngredients().find(i=>i.id===ingId);
    if(!ing){ appAlert('Ще немає жодного інгредієнта. Додайте їх у розділі «Рецепти».'); return; }
    const amount = parseFloat((ingAmountInput.value||'').replace(',','.'));
    if(!amount || amount<=0){ appAlert('Вкажіть кількість інгредієнта'); return; }
    const costPerUnit = ingredientCostPerUnit(ing);
    const cost = amount * costPerUnit;
    draftIngredients.push({ id: uid(), ingredientId: ing.id, name: ing.name, unit: ing.unit, amount, costPerUnit, cost });
    ingAmountInput.value = '';
    renderIngList();
    recalcCost();
  };
  dishSection.appendChild(addIngRow);

  wrap.appendChild(dishSection);

  // --- Комбо: слоти з готових позицій меню (бургер, картопля фрі, напій…) ---
  comboSection.appendChild(el(`<div class="font-semibold text-sm mb-1">З чого складається комбо</div>`));
  comboSection.appendChild(el(`<div class="sub text-xs mb-2"><span style="opacity:.6">v${APP_VERSION}</span> · Оберіть зі списку позиції меню (бургер, картопля, напій…) і додайте в комбо. Якщо касир має обирати між кількома (напр. різні напої) — додайте у слот ще варіанти. Собівартість — орієнтовна, а в продажу рахується за реально обраним.</div>`));
  const slotsHost = el(`<div class="mb-2"></div>`);
  comboSection.appendChild(slotsHost);
  const comboCandidates = ()=> state.products.filter(x=>x.type!=='combo' && (!editing || x.id!==editing.id)).sort((a,b)=>a.name.localeCompare(b.name,'uk'));
  function renderSlots(){
    slotsHost.innerHTML = '';
    draftSlots.forEach((sl, idx)=>{
      const card = el(`<div class="card p-3 mb-3"></div>`);
      const head = el(`<div class="flex items-center gap-2 mb-2"><input data-lbl type="text" placeholder="Назва слота (бачить касир)" class="flex-1 py-2 px-3" style="border-radius:10px;background:var(--card3);color:var(--text);border:none;font-weight:600"><button data-rms style="background:none;border:none;color:var(--danger);font-size:1.2rem;padding:0 4px;cursor:pointer">&times;</button></div>`);
      const lbl = head.querySelector('[data-lbl]');
      lbl.value = sl.label || '';
      lbl.addEventListener('input', ()=>{ sl.label = lbl.value; });
      head.querySelector('[data-rms]').onclick = ()=>{ draftSlots = draftSlots.filter(x=>x.id!==sl.id); renderSlots(); costPriceInput.value = comboAvgCost().toFixed(2); };
      card.appendChild(head);
      card.appendChild(el(`<div class="sub text-xs mb-1">${sl.productIds.length>1?'Касир обере одну з позицій:':'Позиція в комбо:'}</div>`));
      sl.productIds.forEach(pid=>{
        const pr = state.products.find(x=>x.id===pid);
        const r = el(`<div class="flex items-center justify-between mb-1"><div class="text-sm">${escapeHtml(pr?pr.name:'(видалено)')}</div><button data-rmp style="background:none;border:none;color:var(--danger);font-size:1rem;padding:0 4px;cursor:pointer">&times;</button></div>`);
        r.querySelector('[data-rmp]').onclick = ()=>{ sl.productIds = sl.productIds.filter(x=>x!==pid); renderSlots(); costPriceInput.value = comboAvgCost().toFixed(2); };
        card.appendChild(r);
      });
      // ще варіант у цей слот (напр. інший напій) — вибір зі списку всіх позицій меню
      const cands = comboCandidates().filter(x=>!sl.productIds.includes(x.id));
      if(cands.length){
        const addBox = el(`<div class="mt-2 pt-2" style="border-top:1px solid rgba(47,65,114,.12)"><div class="sub text-xs mb-1.5">Додати ще варіант на вибір</div><div data-sel class="mb-2"></div></div>`);
        const sel = customSelect(cands.map(x=>({value:x.id, label:x.name})), null, null);
        addBox.querySelector('[data-sel]').appendChild(sel);
        const addBtn = el(`<button type="button" class="btn-line w-full py-2">+ Додати варіант</button>`);
        addBtn.onclick = ()=>{ const id = sel.getValue(); if(!id) return; sl.productIds.push(id); renderSlots(); costPriceInput.value = comboAvgCost().toFixed(2); };
        addBox.appendChild(addBtn);
        card.appendChild(addBox);
      }
      slotsHost.appendChild(card);
    });
  }
  renderSlots();
  const addSlotRow = el(`<div class="mb-4"><div class="sub text-xs mb-1.5">Додати в комбо позицію з меню</div><div data-sel class="mb-2"></div></div>`);
  const slotCands = comboCandidates();
  if(slotCands.length===0){
    addSlotRow.appendChild(el(`<div class="sub text-xs">У меню ще немає позицій — спершу додайте страви чи товари.</div>`));
  } else {
    const topSel = customSelect(slotCands.map(x=>({value:x.id, label:x.name})), null, null);
    addSlotRow.querySelector('[data-sel]').appendChild(topSel);
    const addSlotBtn = el(`<button type="button" class="btn-solid w-full py-2.5">+ Додати в комбо</button>`);
    addSlotBtn.onclick = ()=>{
      const id = topSel.getValue(); const pr = state.products.find(x=>x.id===id);
      if(!pr) return;
      draftSlots.push({ id: uid(), label: pr.name, productIds: [id] });
      renderSlots(); costPriceInput.value = comboAvgCost().toFixed(2);
    };
    addSlotRow.appendChild(addSlotBtn);
  }
  comboSection.appendChild(addSlotRow);
  wrap.appendChild(comboSection);
  wrap.appendChild(costPriceField);

  const priceField = field('Ціна продажу, ' + String.fromCharCode(8372));
  const priceInput = priceField.querySelector('input');
  priceInput.setAttribute('inputmode','decimal');
  if(editing){ priceInput.value = fmt(editing.price); if(editing.type!=='dish') costPriceInput.value = fmt(editing.costPrice||0); }
  wrap.appendChild(priceField);

  refreshTypeUI();

  // --- Опції (вибір): групи на кшталт «Соус», «Напій» — касир обирає одну опцію з кожної групи ---
  let draftGroups = editing ? (editing.optionGroups||[]).map(g=>({ ...g, options:(g.options||[]).map(o=>({...o})) })) : [];
  wrap.appendChild(el(`<div class="font-semibold text-sm mb-1 mt-2">Опції на вибір</div>`));
  wrap.appendChild(el(`<div class="sub text-xs mb-2">Наприклад, група «Соус»: сирний / часниковий, або «Напій» для комбо. Опція може списувати рецепт (соус) чи продукт зі складу (напій) і мати доплату.</div>`));
  const groupsHost = el(`<div class="mb-2"></div>`);
  wrap.appendChild(groupsHost);
  const unitOfProduct = (name)=>{ const pr = allProductNames().find(x=>x.name===name); return pr ? pr.unit : ''; };
  function renderGroups(){
    groupsHost.innerHTML = '';
    draftGroups.forEach(g=>{
      const card = el(`<div class="card p-3 mb-3"></div>`);
      const head = el(`<div class="flex items-center justify-between mb-2"><div class="font-semibold text-sm">${escapeHtml(g.label)}</div><button data-rmg style="background:none;border:none;color:var(--danger);font-size:1.1rem;padding:0 4px;cursor:pointer">&times;</button></div>`);
      head.querySelector('[data-rmg]').onclick = ()=>{ draftGroups = draftGroups.filter(x=>x.id!==g.id); renderGroups(); };
      card.appendChild(head);
      if(g.options.length===0) card.appendChild(el(`<div class="sub text-xs mb-2">Ще немає варіантів</div>`));
      g.options.forEach(o=>{
        const eff = o.kind==='none' ? 'без списання' : ('спише '+fmt(o.amount)+' '+escapeHtml(o.unit||'')+' '+escapeHtml(o.kind==='ingredient'?o.name:(o.productName||'')));
        const orow = el(`<div class="flex items-center justify-between mb-1"><div><div class="text-sm">${escapeHtml(o.name)}${o.priceDelta?' <span class="sub">+'+fmtMoney(o.priceDelta)+'</span>':''}</div><div class="sub text-xs">${eff}</div></div><button data-rmo style="background:none;border:none;color:var(--danger);font-size:1rem;padding:0 4px;cursor:pointer">&times;</button></div>`);
        orow.querySelector('[data-rmo]').onclick = ()=>{ g.options = g.options.filter(x=>x.id!==o.id); renderGroups(); };
        card.appendChild(orow);
      });
      // додавання варіанта
      let kind = 'ingredient';
      const addBox = el(`<div class="mt-2 pt-2" style="border-top:1px solid rgba(47,65,114,.12)"></div>`);
      const kindHost = el(`<div></div>`);
      const refHost = el(`<div class="mb-2"></div>`);
      const inpStyle = 'width:100%;min-width:0;box-sizing:border-box;border-radius:10px;background:var(--card2);color:var(--text);border:none;padding:10px 12px;font-size:.9rem';
      const nameWrap = el(`<div class="mb-2"><div class="sub text-xs mb-1">Назва варіанта (необов'язково)</div><input type="text" placeholder="Як у списку, якщо порожньо" style="${inpStyle}"></div>`);
      const nameIn = nameWrap.querySelector('input');
      const row2 = el(`<div class="mb-2" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div data-amtbox><div class="sub text-xs mb-1">Скільки списати</div><input data-amt type="text" inputmode="decimal" placeholder="0" style="${inpStyle}"></div><div><div class="sub text-xs mb-1">Доплата, ₴</div><input data-dl type="text" inputmode="decimal" placeholder="0" style="${inpStyle}"></div></div>`);
      const addO = el(`<button class="btn-line w-full py-2">+ Додати варіант</button>`);
      let refSel = null;
      const buildRef = ()=>{
        refHost.innerHTML = '';
        row2.querySelector('[data-amtbox]').style.visibility = kind==='none' ? 'hidden' : 'visible';
        if(kind==='none'){ refSel = null; return; }
        const opts = kind==='ingredient'
          ? availableRecipes().map(r=>({value:r.id, label:r.name+' ('+r.unit+')'}))
          : allProductNames().map(x=>({value:x.name, label:x.name+' ('+x.unit+')'}));
        if(opts.length===0){ refSel = null; refHost.appendChild(el(`<div class="sub text-xs">${kind==='ingredient'?'Ще немає рецептів — створіть у «Рецептах».':'Ще немає продуктів на складі.'}</div>`)); return; }
        refSel = customSelect(opts, null, null);
        refHost.appendChild(refSel);
      };
      const kindRow = segmentedPicker([['ingredient','Рецепт','🥣'],['product','Продукт','📦'],['none','Без списання','➖']], kind, (k)=>{ kind = k; buildRef(); });
      kindHost.appendChild(kindRow);
      buildRef();
      addO.onclick = ()=>{
        const amount = parseFloat((row2.querySelector('[data-amt]').value||'').replace(',','.')) || 0;
        const priceDelta = parseFloat((row2.querySelector('[data-dl]').value||'').replace(',','.')) || 0;
        let opt = { id: uid(), name: nameIn.value.trim(), kind, refId:null, productName:null, unit:'', amount:0, priceDelta };
        if(kind==='ingredient'){
          const ing = refSel && availableRecipes().find(r=>r.id===refSel.getValue());
          if(!ing){ appAlert('Оберіть рецепт'); return; }
          if(amount<=0){ appAlert('Вкажіть, скільки списувати'); return; }
          opt.refId = ing.id; opt.unit = ing.unit; opt.amount = amount; if(!opt.name) opt.name = ing.name;
        } else if(kind==='product'){
          const pn = refSel && refSel.getValue();
          if(!pn){ appAlert('Оберіть продукт'); return; }
          if(amount<=0){ appAlert('Вкажіть, скільки списувати'); return; }
          opt.productName = pn; opt.unit = unitOfProduct(pn); opt.amount = amount; if(!opt.name) opt.name = pn;
        } else if(!opt.name){ appAlert('Вкажіть назву варіанта'); return; }
        g.options.push(opt);
        renderGroups();
      };
      addBox.appendChild(kindHost); addBox.appendChild(refHost); addBox.appendChild(nameWrap); addBox.appendChild(row2); addBox.appendChild(addO);
      card.appendChild(addBox);
      groupsHost.appendChild(card);
    });
  }
  renderGroups();
  const addGroupRow = el(`<div class="flex gap-2 mb-5"><input type="text" placeholder="Нова група, напр. Соус або Напій" class="flex-1 py-2.5 px-3" style="border-radius:10px;background:var(--card3);color:var(--text);border:none"><button class="btn-line" style="padding:0 16px">+ Група</button></div>`);
  addGroupRow.querySelector('button').onclick = ()=>{
    const inp = addGroupRow.querySelector('input');
    const label = inp.value.trim();
    if(!label){ appAlert('Вкажіть назву групи'); return; }
    draftGroups.push({ id: uid(), label, options: [] });
    inp.value = '';
    renderGroups();
  };
  wrap.appendChild(addGroupRow);

  const err = el(`<div class="text-sm mb-3" style="color:var(--danger);min-height:1.2em"></div>`);
  wrap.appendChild(err);

  // --- Історія рецепту (тільки для страви, що вже редагувалась) ---
  if(editing && editing.type==='dish' && (editing.recipeHistory||[]).length>0){
    wrap.appendChild(el(`<div class="font-semibold text-sm mb-2 mt-1">Історія рецепту (версія ${editing.recipeVersion})</div>`));
    editing.recipeHistory.forEach(h=>{
      wrap.appendChild(el(`
        <div class="card p-3 mb-2" style="background:var(--card3)">
          <div class="sub text-xs mb-1">Версія ${h.version} · ${escapeHtml(h.changedAt)} · ${escapeHtml(h.changedBy)}</div>
          <div class="text-xs">${h.ingredients.map(i=>escapeHtml(i.name)+' '+fmt(i.amount)+' '+escapeHtml(i.unit)).join(', ')}</div>
          <div class="sub text-xs mt-1">Ціна тоді: ${fmtMoney(h.price)} · Собівартість тоді: ${fmtMoney(h.costPrice)}</div>
        </div>
      `));
    });
  }

  const saveBtn = el(`<button class="w-full btn-solid py-3 mb-5">${editing?'Зберегти зміни':'Зберегти товар'}</button>`);
  saveBtn.onclick = ()=>{
    const name = nameInput.value.trim();
    if(!name){ err.textContent = "Введіть назву товару"; return; }
    const price = parseFloat((priceInput.value||'').replace(',','.')) || 0;
    if(price<=0){ err.textContent = 'Вкажіть ціну продажу'; return; }
    let costPrice = 0;
    if(draftType==='combo'){
      if(draftSlots.length===0){ err.textContent = 'Додайте в комбо хоча б одну позицію'; return; }
      draftSlots.forEach(sl=>{ if(!String(sl.label||'').trim()){ const f = state.products.find(x=>x.id===sl.productIds[0]); sl.label = f ? f.name : 'Позиція'; } });
      const emptySlot = draftSlots.find(sl=>sl.productIds.length===0);
      if(emptySlot){ err.textContent = 'У слоті «'+emptySlot.label+'» немає жодної позиції'; return; }
      costPrice = comboAvgCost();
    } else if(draftType==='dish'){
      if(draftIngredients.length===0){ err.textContent = 'Додайте хоча б один інгредієнт'; return; }
      costPrice = draftIngredients.reduce((s,i)=>s+i.cost,0);
    } else {
      costPrice = parseFloat((costPriceInput.value||'').replace(',','.')) || 0;
    }
    const emptyG = draftGroups.find(g=>g.options.length===0);
    if(emptyG){ err.textContent = 'У групі «'+emptyG.label+'» немає жодного варіанта — додайте або видаліть її'; return; }
    const data = { name, category: draftCategory, type: draftType, ingredients: draftIngredients, costPrice, price, modifier: null, optionGroups: draftGroups, comboSlots: draftSlots };
    if(editing) updateProduct(editing.id, data);
    else addProduct(data);
    editingProductId = null;
    view = 'menu';
    render();
  };
  wrap.appendChild(saveBtn);

  if(editing){
    const delBtn = el(`<button class="w-full btn-line py-3 mb-5" style="color:var(--danger)">Видалити товар</button>`);
    delBtn.onclick = ()=>{
      appConfirm('Видалити "'+editing.name+'"?', ()=>{
        deleteProduct(editing.id);
        editingProductId = null;
        view = 'menu';
        render();
      });
    };
    wrap.appendChild(delBtn);
  }

  return wrap;
}

// ---- Старт застосунку ----
// Замість миттєвого localStorage-читання тепер: підхопити токен попередньої сесії (якщо є) з
// localStorage, і якщо він є — підвантажити спільні дані з сервера, перш ніж щось показувати. Поки
// це триває — короткий екран "Завантаження…" (render() сам його покаже, доки stateLoaded===false).
async function boot(){
  render(); // "Завантаження…" одразу, поки йде запит
  const sess = loadLocalSession();
  authToken = !!sess.s;
  LOCAL_ONLY_KEYS.forEach(k=>{ if(sess[k]!==undefined) state[k] = sess[k]; });

  if(!authToken){
    stateLoaded = true;
    render();
    return;
  }
  const ok = await fetchStateFromServer();
  if(!ok || !state.staff.find(s=>s.id===state.currentUserId)){
    // Токен помер/недійсний, або залогінений раніше співробітник більше не існує — назад на логін.
    authToken = null;
    state.currentUserId = null;
    saveLocalSession();
  } else {
    startPolling();
  }
  stateLoaded = true;
  render();
}
boot();
</script>
</body>
</html>
