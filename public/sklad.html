  }
  // Кілька касирів можуть вийти на одну й ту саму дату — групуємо по даті й показуємо одну картку
  // "дата" з усіма іменами під нею через " / ", а не окрему картку на кожного співробітника.
  const byDate = {};
  entries.forEach(e=>{ (byDate[e.dateKey] = byDate[e.dateKey] || []).push(e); });
  const todayKey = dateKeyFromOffset(0);
  Object.keys(byDate).sort().forEach(dateKey=>{
    const group = byDate[dateKey];
    const names = group.map(e=>{
      const staff = state.staff.find(s=>s.id===e.staffId);
      return staff ? staff.name : 'Співробітник видалений';
    }).join(' / ');
    const isPast = dateKey < todayKey;
    const row = el(`
      <div class="card p-3 mb-2" style="cursor:pointer;${isPast?'opacity:.55':''}">
        <div class="flex items-center justify-between mb-1">
          <div class="font-semibold text-sm">${formatScheduleDate(dateKey)}</div>
          ${dateKey===todayKey ? `<div class="text-xs font-semibold" style="color:var(--accent2)">Сьогодні</div>` : ''}
        </div>
        <div class="sub text-xs">${escapeHtml(names)}</div>
      </div>
    `);
    row.onclick = ()=>{ scheduleDayKey = dateKey; scheduleDayReturnTo = 'scheduleLocation'; view='scheduleDay'; render(); };
    wrap.appendChild(row);
  });
  return wrap;
}

function scheduleDayView(){
  const wrap = el(`<div></div>`);
  const key = scheduleDayKey || dateKeyFromOffset(0);
  const topBar = el(`
    <div class="flex items-center gap-3 mb-4">
      <button id="sdBack" class="navicon-btn" style="background:var(--card3)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="font-bold" style="font-size:1.1rem">${formatScheduleDate(key)}</div>
    </div>
  `);
  topBar.querySelector('#sdBack').onclick = ()=>{ view=scheduleDayReturnTo; render(); };
  wrap.appendChild(topBar);

  const canEdit = isOwner();

  // Графік змін призначає ЛОКАЦІЮ (точку продажів) — це стосується тільки касирів; кухар і
  // заготівельник завжди прив'язані до центрального складу «База» й у цьому списку не потрібні.
  const eligibleStaff = state.staff.filter(s=>s.role==='cashier');
  if(canEdit && eligibleStaff.length===0){
    wrap.appendChild(el(`<div class="sub text-center py-6">Спершу додайте касира у Налаштуваннях.</div>`));
    return wrap;
  }
  if(canEdit && state.locations.length===0){
    wrap.appendChild(el(`<div class="sub text-center py-6">Спершу додайте точку в Налаштуваннях.</div>`));
    return wrap;
  }

  wrap.appendChild(el(`<div class="font-semibold text-sm mb-2">Призначено на цей день</div>`));
  const listHost = el(`<div class="mb-4"></div>`);
  wrap.appendChild(listHost);
  function renderList(){
    listHost.innerHTML = '';
    const entries = scheduleEntriesForDate(key);
    if(entries.length===0){
      listHost.appendChild(el(`<div class="sub text-xs mb-2">Ще нікого не призначено</div>`));
      return;
    }
    entries.forEach(e=>{
      const staff = state.staff.find(s=>s.id===e.staffId);
      const locName = (state.locations.find(l=>l.id===e.locationId)||{}).name || '';
      const row = el(`
        <div class="card p-3 mb-2 flex items-center justify-between">
          <div>
            <div class="font-medium text-sm">${escapeHtml(staff ? staff.name : 'Співробітник видалений')}</div>
            <div class="sub text-xs">${escapeHtml(staff ? roleLabel(staff.role) : '')} · ${escapeHtml(locName)}</div>
          </div>
          ${canEdit ? `<button data-rm style="background:none;border:none;color:var(--danger);padding:0 4px;cursor:pointer">&times;</button>` : ''}
        </div>
      `);
      if(canEdit) row.querySelector('[data-rm]').onclick = ()=>{ removeScheduleEntry(e.id); renderList(); };
      listHost.appendChild(row);
    });
  }
  renderList();

  // Касир бачить графік лише для перегляду — форма призначення/видалення доступна тільки власнику.
  if(!canEdit) return wrap;

  const formCard = el(`<div class="card p-3" style="background:var(--card3)"></div>`);
  formCard.appendChild(el(`<div class="font-semibold text-sm mb-2">Призначити працівника</div>`));

  formCard.appendChild(el(`<div class="sub text-xs mb-1.5">Співробітник</div>`));
  const staffSelHost = el(`<div class="mb-2"></div>`);
  formCard.appendChild(staffSelHost);
  let selectedStaffId = eligibleStaff[0].id;
  const staffSel = customSelect(
    eligibleStaff.map(s=>({value:s.id, label: s.name+' · '+roleLabel(s.role)})),
    selectedStaffId,
    (val)=>{ selectedStaffId = val; }
  );
  staffSelHost.appendChild(staffSel);

  formCard.appendChild(el(`<div class="sub text-xs mb-1.5">Точка</div>`));
  const locSelHost = el(`<div class="mb-3"></div>`);
  formCard.appendChild(locSelHost);
  let selectedLocationId = state.locations[0].id;
  const locSel = customSelect(
    state.locations.map(l=>({value:l.id, label:l.name})),
    selectedLocationId,
    (val)=>{ selectedLocationId = val; }
  );
  locSelHost.appendChild(locSel);

  const assignBtn = el(`<button class="w-full btn-solid py-2.5">Призначити</button>`);
  assignBtn.onclick = ()=>{
    if(!selectedStaffId || !selectedLocationId) return;
    setScheduleEntry(key, selectedStaffId, selectedLocationId);
    render();
  };
  formCard.appendChild(assignBtn);
  wrap.appendChild(formCard);

  return wrap;
}

function inventoryListView(){
  const wrap = el(`<div></div>`);
  const startBtn = el(`<button class="w-full btn-line py-3 mb-4">+ Почати інвентаризацію</button>`);
  startBtn.onclick = startInventory;
  wrap.appendChild(startBtn);

  const list = state.inventories.filter(inv=>inv.warehouseId===state.currentWarehouse);
  if(list.length===0){
    wrap.appendChild(el(`<div class="sub text-center py-10">Інвентаризацій ще не було</div>`));
    return wrap;
  }
  list.forEach(inv=>{
    const more = inv.items.filter(i=>i.status==='more').length;
    const less = inv.items.filter(i=>i.status==='less').length;
    const match = inv.items.filter(i=>i.status==='match').length;
    const totalValue = (inv.items||[]).reduce((s,i)=>s+(i.diffValue||0),0);
    const valueLine = canSeeCost() ? `<div class="sub text-xs mt-0.5">Різниця по грошах: <span style="color:${totalValue<0?'var(--danger)':(totalValue>0?'var(--accent2)':'var(--sub)')}">${totalValue>0?'+':''}${fmt(totalValue)} ₴</span></div>` : '';
    const row = el(`
      <div class="card p-3 mb-2" style="cursor:pointer">
        <div class="flex items-center justify-between mb-1">
          <div class="font-semibold">${escapeHtml(inv.ts)}</div>
          <div class="sub text-xs">${escapeHtml(inv.who)}</div>
        </div>
        <div class="sub text-xs">${inv.items.length} позицій · <span style="color:var(--accent2)">${more} більше</span> · <span style="color:var(--danger)">${less} менше</span> · ${match} збіг</div>
        ${valueLine}
      </div>
    `);
    row.onclick = ()=> openInventoryDetail(inv.id);
    wrap.appendChild(row);
  });
  return wrap;
}

function inventoryStartView(){
  const wrap = el(`<div></div>`);
  const topBar = el(`
    <div class="flex items-center gap-3 mb-4">
      <button id="ivBack" class="navicon-btn" style="background:var(--card3)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="font-bold" style="font-size:1.1rem">Інвентаризація</div>
    </div>
  `);
  topBar.querySelector('#ivBack').onclick = ()=>{ view='stock'; stockSubview='inventory'; render(); };
  wrap.appendChild(topBar);

  const productList = curStockItems();
  const ingredientList = curIngredientRows();
  if(productList.length===0 && ingredientList.length===0){
    wrap.appendChild(el(`<div class="sub text-center py-10">На цьому складі ще немає позицій для перерахунку</div>`));
    return wrap;
  }

  let blindMode = true;
  const toggleWrap = el(`
    <div class="card p-3 mb-3 flex items-center justify-between">
      <div>
        <div class="font-semibold text-sm">Сліпий режим</div>
        <div class="sub text-xs mt-0.5">Облікові залишки приховані під час підрахунку</div>
      </div>
      <button id="ivBlindToggle" class="btn-line" style="padding:8px 14px;min-width:56px">Так</button>
    </div>
  `);
  wrap.appendChild(toggleWrap);
  const hintEl = el(`<div class="sub text-xs mb-4">Введіть фактичний залишок для кожної позиції. Те, що ви не зміните, залишиться як в обліку.</div>`);
  wrap.appendChild(hintEl);

  const rowInputs = [];
  const bookQtyEls = [];
  function addRow(kind, item){
    const row = el(`
      <div class="card p-3 mb-2 flex items-center justify-between gap-3">
        <div>
          <div class="font-semibold">${escapeHtml(item.name)}</div>
          <div class="sub text-xs book-qty" style="visibility:hidden">Облік: ${fmt(item.qty)} ${escapeHtml(item.unit)}</div>
        </div>
        <input type="text" inputmode="decimal" placeholder="0" style="width:88px;text-align:right;border-radius:12px;background:var(--card3);color:var(--text);border:none;padding:10px 12px;font-weight:700">
      </div>
    `);
    const input = row.querySelector('input');
    // Blind mode: start empty so the count isn't anchored to the book qty. Non-blind: prefill it.
    input.value = '';
    rowInputs.push({ kind, item, input });
    bookQtyEls.push(row.querySelector('.book-qty'));
    wrap.appendChild(row);
  }
  if(productList.length>0){
    wrap.appendChild(el(`<div class="sub text-xs font-semibold mb-2">Товари</div>`));
    productList.slice().sort((a,b)=>a.name.localeCompare(b.name,'uk')).forEach(item=> addRow('product', item));
  }
  if(ingredientList.length>0){
    wrap.appendChild(el(`<div class="sub text-xs font-semibold mb-2 mt-3">Готові інгредієнти</div>`));
    ingredientList.slice().sort((a,b)=>a.name.localeCompare(b.name,'uk')).forEach(item=> addRow('ingredient', item));
  }

  function applyBlindMode(){
    bookQtyEls.forEach(elx=> elx.style.visibility = blindMode ? 'hidden' : 'visible');
    toggleWrap.querySelector('#ivBlindToggle').textContent = blindMode ? 'Так' : 'Ні';
    if(!blindMode){
      rowInputs.forEach(({item,input})=>{ if(input.value==='') input.value = fmt(item.qty); });
    }
  }
  toggleWrap.querySelector('#ivBlindToggle').onclick = ()=>{ blindMode = !blindMode; applyBlindMode(); };
  applyBlindMode();

  const saveBtn = el(`<button class="w-full btn-solid py-3">Зберегти інвентаризацію</button>`);
  saveBtn.onclick = ()=>{
    const entries = rowInputs.map(({kind,item,input})=>({
      kind, stockItemId: kind==='product' ? item.id : undefined, ingredientId: kind==='ingredient' ? item.ingredientId : undefined,
      name: item.name, unit: item.unit,
      before: item.qty,
      after: parseFloat((input.value||'').replace(',','.')) || 0
    }));
    saveInventory(entries);
  };
  wrap.appendChild(saveBtn);
  return wrap;
}

function transferStartView(){
  // "Поставка": moves on-hand ingredient stock from one warehouse to another (e.g. sauces prepared
  // at "База" that then get sent out to a location) — products/raw materials aren't part of this,
  // only the already-made ingredients.
  const wrap = el(`<div></div>`);
  const topBar = el(`
    <div class="flex items-center gap-3 mb-4">
      <button id="trBack" class="navicon-btn" style="background:var(--card3)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="font-bold" style="font-size:1.1rem">Поставка</div>
    </div>
  `);
  const returnTo = transferReturnTo;
  topBar.querySelector('#trBack').onclick = ()=>{
    transferReturnTo = null;
    view = returnTo || (isOwner() ? 'purchase' : 'stock');
    render();
  };
  wrap.appendChild(topBar);
  wrap.appendChild(el(`<div class="sub text-xs mb-4">Переміщення готових інгредієнтів (соуси тощо) і продуктів з одного складу на інший.</div>`));

  let fromWhId = state.defaultWarehouseId || state.currentWarehouse;
  const viewedWh = (returnTo && viewingLocationId) ? warehouseForLocationOrNull(viewingLocationId) : null;
  if(!isOwner()) fromWhId = state.currentWarehouse;
  let toWhId = (viewedWh && viewedWh.id!==fromWhId)
    ? viewedWh.id
    : (state.warehouses.find(w=>w.id!==fromWhId) || state.warehouses[0]).id;

  wrap.appendChild(el(`<div class="sub text-xs mb-1.5">Звідки</div>`));
  const fromWrap = el(`<div class="mb-3"></div>`);
  if(isOwner()){
    const fromSel = customSelect(
      state.warehouses.map(w=>({value:w.id, label:w.name})),
      fromWhId,
      (val)=>{ fromWhId = val; renderItems(); }
    );
    fromWrap.appendChild(fromSel);
  } else {
    // Non-owner roles (Заготівельник) can only ship from their own fixed склад ("База").
    fromWhId = state.currentWarehouse;
    const fixedWhName = (state.warehouses.find(w=>w.id===fromWhId)||{}).name || '';
    fromWrap.appendChild(el(`<div class="card p-3" style="font-weight:700">${escapeHtml(fixedWhName)}</div>`));
  }
  wrap.appendChild(fromWrap);

  wrap.appendChild(el(`<div class="sub text-xs mb-1.5">Куди</div>`));
  const toWrap = el(`<div class="mb-4"></div>`);
  const toSel = customSelect(
    state.warehouses.map(w=>({value:w.id, label:w.name})),
    toWhId,
    (val)=>{ toWhId = val; renderItems(); }
  );
  toWrap.appendChild(toSel);
  wrap.appendChild(toWrap);

  wrap.appendChild(el(`<div class="font-semibold text-sm mb-2">Що відправляємо</div>`));
  const itemsHost = el(`<div></div>`);
  wrap.appendChild(itemsHost);

  const err = el(`<div class="text-sm mb-3" style="color:var(--danger);min-height:1.2em"></div>`);

  let rowInputs = [];
  function renderItems(){
    itemsHost.innerHTML = '';
    rowInputs = [];
    const items = transferCatalog(fromWhId);
    if(items.length===0){
      itemsHost.appendChild(el(`<div class="sub text-xs mb-2">На цьому складі ще немає що відправляти</div>`));
      return;
    }
    const fillBtn = el(`<button class="btn-line mb-3" style="padding:8px 14px;font-size:.8rem">Дозаповнити до мінімуму</button>`);
    fillBtn.onclick = ()=>{
      rowInputs.forEach(({c,input,available,atDest,min})=>{
        const need = Number((min - atDest).toFixed(3));
        if(min>0 && need>0) input.value = String(Math.min(need, available>0?available:need));
      });
    };
    itemsHost.appendChild(fillBtn);
    items.forEach(c=>{
      const available = catalogQty(c, fromWhId);
      const atDest = catalogQty(c, toWhId);
      const min = catalogMin(c, toWhId);
      const row = el(`
        <div class="card p-3 mb-2 flex items-center justify-between gap-3">
          <div>
            <div class="font-semibold">${escapeHtml(c.name)}</div>
            <div class="sub text-xs">На точці: ${fmt(atDest)} ${escapeHtml(c.unit)}${min>0?' (мін '+fmt(min)+')':''} · Доступно: ${fmt(available)} ${escapeHtml(c.unit)}</div>
          </div>
          <input type="text" inputmode="decimal" placeholder="0" style="width:88px;text-align:right;border-radius:12px;background:var(--card3);color:var(--text);border:none;padding:10px 12px;font-weight:700">
        </div>
      `);
      const input = row.querySelector('input');
      rowInputs.push({ c, input, available, atDest, min });
      itemsHost.appendChild(row);
    });
  }
  renderItems();

  wrap.appendChild(err);

  const saveBtn = el(`<button class="w-full btn-solid py-3">Відправити поставку</button>`);
  saveBtn.onclick = ()=>{
    if(fromWhId===toWhId){ err.textContent = 'Оберіть різні склади для «звідки» і «куди»'; return; }
    const lines = rowInputs.map(({c,input,available})=>({
      c, available,
      qty: parseFloat((input.value||'').replace(',','.')) || 0
    })).filter(l=>l.qty>0);
    if(lines.length===0){ err.textContent = 'Вкажіть кількість хоча б для однієї позиції'; return; }
    const over = lines.find(l=>l.qty>l.available);
    if(over && !allowNegativeStock()){ err.textContent = 'Недостатньо «'+over.c.name+'» на складі-відправнику (є '+fmt(over.available)+' '+over.c.unit+')'; return; }

    const fromName = (state.warehouses.find(w=>w.id===fromWhId)||{}).name || '';
    const toName = (state.warehouses.find(w=>w.id===toWhId)||{}).name || '';
    createTransfer(fromWhId, toWhId, lines.map(({c,qty})=>({ kind:c.kind, ingredientId: c.ing?c.ing.id:null, stockName: c.name, name: c.name, unit: c.unit, qty })));
    transferReturnTo = null;
    view = 'transferList';
    render();
    appAlert('Поставку відправлено: '+lines.length+' поз. ('+fromName+' → '+toName+'). Вона зʼявиться на складі-отримувачі як «В дорозі», поки її там не приймуть.');
  };
  wrap.appendChild(saveBtn);
  return wrap;
}

function transferListView(){
  const wrap = el(`<div></div>`);
  const topBar = el(`
    <div class="flex items-center gap-3 mb-4">
      <button id="tlBack" class="navicon-btn" style="background:var(--card3)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="font-bold" style="font-size:1.1rem">Поставки</div>
    </div>
  `);
  topBar.querySelector('#tlBack').onclick = ()=>{ view = isOwner() ? 'settings' : (curUser() && curUser().role==='prep' ? 'prepTransferLocations' : 'stock'); render(); };
  wrap.appendChild(topBar);

  const whName = id => (state.warehouses.find(w=>w.id===id)||{}).name || '';

  // Everything relevant to this user: for the owner — every поставка; for everyone else —
  // only the ones touching their own fixed склад (as sender or receiver).
  const relevant = isOwner()
    ? state.transfers
    : state.transfers.filter(t=>t.fromWarehouseId===state.currentWarehouse || t.toWarehouseId===state.currentWarehouse);

  const pending = relevant.filter(t=>t.status==='SENT' && (isOwner() || canReceiveAt(t.toWarehouseId)));
  wrap.appendChild(el(`<div class="font-semibold text-sm mb-2">Очікують прийому</div>`));
  if(pending.length===0){
    wrap.appendChild(el(`<div class="sub text-xs mb-4">Немає поставок, що очікують прийому</div>`));
  } else {
    pending.forEach(t=>{
      const lines = t.lines.map(l=>escapeHtml(l.name)+' · '+fmt(l.sentQty)+' '+escapeHtml(l.unit)).join(', ');
      const card = el(`
        <div class="card p-3 mb-2">
          <div class="font-semibold">${escapeHtml(whName(t.fromWarehouseId))} → ${escapeHtml(whName(t.toWarehouseId))}</div>
          <div class="sub text-xs mt-0.5">${lines}</div>
          <div class="sub text-xs mt-0.5">Відправлено: ${escapeHtml(t.createdAt)} · ${escapeHtml(t.createdBy)}</div>
        </div>
      `);
      if(canReceiveAt(t.toWarehouseId)){
        const acceptBtn = el(`<button class="w-full btn-solid py-2.5 mt-2" style="font-size:.85rem">Прийняти поставку</button>`);
        acceptBtn.onclick = ()=>{ editingTransferId = t.id; view = 'transferReceive'; render(); };
        card.appendChild(acceptBtn);
      }
      if(canCancelTransfer(t)){
        const cancelBtn = el(`<button class="w-full btn-line py-2 mt-2" style="font-size:.8rem;color:var(--danger)">Скасувати поставку</button>`);
        cancelBtn.onclick = ()=> appConfirm('Скасувати цю поставку? Товар повернеться на склад-відправник.', ()=> cancelTransfer(t.id));
        card.appendChild(cancelBtn);
      }
      wrap.appendChild(card);
    });
  }

  // Відправлені мною поставки, які ще їдуть (отримувач — не я): видно в дорозі й можна скасувати.
  const outgoing = relevant.filter(t=>t.status==='SENT' && !isOwner() && !canReceiveAt(t.toWarehouseId));
  if(outgoing.length>0){
    wrap.appendChild(el(`<div class="font-semibold text-sm mb-2 mt-4">В дорозі (відправлено)</div>`));
    outgoing.forEach(t=>{
      const lines = t.lines.map(l=>escapeHtml(l.name)+' · '+fmt(l.sentQty)+' '+escapeHtml(l.unit)).join(', ');
      const card = el(`
        <div class="card p-3 mb-2">
          <div class="font-semibold">${escapeHtml(whName(t.fromWarehouseId))} → ${escapeHtml(whName(t.toWarehouseId))}</div>
          <div class="sub text-xs mt-0.5">${lines}</div>
          <div class="sub text-xs mt-0.5">Відправлено: ${escapeHtml(t.createdAt)} · ${escapeHtml(t.createdBy)} · чекає підтвердження отримувача</div>
        </div>
      `);
      if(canCancelTransfer(t)){
        const cancelBtn = el(`<button class="w-full btn-line py-2 mt-2" style="font-size:.8rem;color:var(--danger)">Скасувати поставку</button>`);
        cancelBtn.onclick = ()=> appConfirm('Скасувати цю поставку? Товар повернеться на склад-відправник.', ()=> cancelTransfer(t.id));
        card.appendChild(cancelBtn);
      }
      wrap.appendChild(card);
    });
  }

  const done = relevant.filter(t=>t.status!=='SENT');
  wrap.appendChild(el(`<div class="font-semibold text-sm mb-2 mt-4">Історія</div>`));
  if(done.length===0){
    wrap.appendChild(el(`<div class="sub text-xs">Поки немає завершених поставок</div>`));
  } else {
    done.forEach(t=>{
      const statusLabel = t.status==='RECEIVED' ? 'Прийнято' : 'Скасовано';
      const statusColor = t.status==='RECEIVED' ? 'var(--ok)' : 'var(--danger)';
      const hasDiff = t.status==='RECEIVED' && t.lines.some(l=>l.receivedQty!==l.sentQty);
      const lines = t.lines.map(l=>{
        const diff = l.receivedQty!==null ? Number((l.receivedQty - l.sentQty).toFixed(3)) : 0;
        const diffLabel = diff!==0 ? ' <span style="color:var(--danger)">('+(diff>0?'+':'')+fmt(diff)+')</span>' : '';
        return escapeHtml(l.name)+' · '+fmt(l.sentQty)+' '+escapeHtml(l.unit)+diffLabel;
      }).join(', ');
      wrap.appendChild(el(`
        <div class="card p-3 mb-2">
          <div class="flex items-center justify-between">
            <div class="font-semibold">${escapeHtml(whName(t.fromWarehouseId))} → ${escapeHtml(whName(t.toWarehouseId))}</div>
            <div class="text-xs font-bold" style="color:${statusColor}">${statusLabel}${hasDiff?' · розбіжність':''}</div>
          </div>
          <div class="sub text-xs mt-0.5">${lines}</div>
          <div class="sub text-xs mt-0.5">${escapeHtml(t.createdAt)} · ${escapeHtml(t.createdBy)}${t.receivedAt?' → '+escapeHtml(t.receivedAt)+' · '+escapeHtml(t.receivedBy):''}</div>
        </div>
      `));
    });
  }
  return wrap;
}

function transferReceiveView(){
  const t = state.transfers.find(x=>x.id===editingTransferId);
  const wrap = el(`<div></div>`);
  if(!t){
    view = 'transferList';
    setTimeout(render, 0);
    return wrap;
  }
  const fromName = (state.warehouses.find(w=>w.id===t.fromWarehouseId)||{}).name || '';
  const toName = (state.warehouses.find(w=>w.id===t.toWarehouseId)||{}).name || '';
  const topBar = el(`
    <div class="flex items-center gap-3 mb-4">
      <button id="trvBack" class="navicon-btn" style="background:var(--card3)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="font-bold" style="font-size:1.1rem">Прийом поставки</div>
    </div>
  `);
  topBar.querySelector('#trvBack').onclick = ()=>{ editingTransferId=null; view='transferList'; render(); };
  wrap.appendChild(topBar);
  wrap.appendChild(el(`<div class="sub text-sm mb-4">${escapeHtml(fromName)} → ${escapeHtml(toName)} · відправлено ${escapeHtml(t.createdAt)}</div>`));
  wrap.appendChild(el(`<div class="sub text-xs mb-4">Порахуйте фактично отриману кількість — якщо вона відрізняється від відправленої, це зафіксується як розбіжність поставки.</div>`));

  const rowInputs = [];
  t.lines.forEach(line=>{
    const row = el(`
      <div class="card p-3 mb-2 flex items-center justify-between gap-3">
        <div>
          <div class="font-semibold">${escapeHtml(line.name)}</div>
          <div class="sub text-xs">Відправлено: ${fmt(line.sentQty)} ${escapeHtml(line.unit)}</div>
        </div>
        <input type="text" inputmode="decimal" style="width:88px;text-align:right;border-radius:12px;background:var(--card3);color:var(--text);border:none;padding:10px 12px;font-weight:700">
      </div>
    `);
    const input = row.querySelector('input');
    input.value = fmt(line.sentQty);
    rowInputs.push({ line, input });
    wrap.appendChild(row);
  });

  const confirmBtn = el(`<button class="w-full btn-solid py-3 mt-2">Підтвердити прийом</button>`);
  confirmBtn.onclick = ()=>{
    const received = rowInputs.map(({line,input})=>({
      key: lineKey(line),
      qty: parseFloat((input.value||'').replace(',','.')) || 0
    }));
    receiveTransfer(t.id, received);
    editingTransferId = null;
    view = 'transferList';
    render();
    const anyDiff = received.some((r,i)=>r.qty!==t.lines[i].sentQty);
    appAlert(anyDiff ? 'Поставку прийнято з розбіжністю — власник побачить це в історії.' : 'Поставку прийнято повністю.');
  };
  wrap.appendChild(confirmBtn);
  return wrap;
}

function productionStartView(){
  const u = curUser();
  const title = (u && u.role==='prep') ? 'Нова заготовка' : 'Нова готовка';
  const wrap = el(`<div></div>`);
  const topBar = el(`
    <div class="flex items-center gap-3 mb-4">
      <button id="prBack" class="navicon-btn" style="background:var(--card3)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="font-bold" style="font-size:1.1rem">${escapeHtml(title)}</div>
    </div>
  `);
  topBar.querySelector('#prBack').onclick = ()=>{ backFromProduction(); render(); };
  wrap.appendChild(topBar);
  wrap.appendChild(el(`<div class="sub text-xs mb-4">Візьміть сировину зі складу «${escapeHtml((state.warehouses.find(w=>w.id===state.currentWarehouse)||{}).name||'')}», вкажіть втрати при обробці (якщо були) і який продукт отримаєте. Вагу готового продукту вкажете, коли готовка буде завершена.</div>`));

  // Готовка за рецептом: обираємо рецепт зі списку «Рецепти» — продукти підтягуються самі.
  if(canProduce() && availableRecipes().length>0){
    const recipeBtn = el(`<button class="w-full btn-solid py-3 mb-2">Приготувати за рецептом</button>`);
    recipeBtn.onclick = ()=> openPrepare(null, 'productionStart');
    wrap.appendChild(recipeBtn);
    wrap.appendChild(el(`<div class="sub text-xs mb-4">або нижче — готовка з однієї сировини зі втратами.</div>`));
  }

  // Кухар завжди оприбутковує на той самий склад, звідки бере сировину (спрощений сценарій).
  // Заготівельник і власник можуть одразу відправити готовий продукт на конкретну точку.
  let selectedOutputWarehouseId = state.currentWarehouse;
  const canPickOutputWarehouse = u && (u.role==='prep' || u.role==='owner') && state.warehouses.length>1;
  if(canPickOutputWarehouse){
    wrap.appendChild(el(`<div class="sub text-xs mb-1.5">Склад оприбуткування готового продукту</div>`));
    const outWhSelHost = el(`<div class="mb-4"></div>`);
    const outWhSel = customSelect(
      state.warehouses.map(w=>({value:w.id, label:w.name})),
      selectedOutputWarehouseId,
      (val)=>{ selectedOutputWarehouseId = val; }
    );
    outWhSelHost.appendChild(outWhSel);
    wrap.appendChild(outWhSelHost);
  }

  const rawProducts = productionRawProducts(); // кухар бачить тільки "М'ясо з Техасу", власник/заготівельник — увесь склад
  let draftItems = [];

  wrap.appendChild(el(`<div class="font-semibold text-sm mb-2">Позиції цієї готовки</div>`));
  const itemsHost = el(`<div class="mb-2"></div>`);
  wrap.appendChild(itemsHost);
  function renderDraftItems(){
    itemsHost.innerHTML = '';
    if(draftItems.length===0){
      itemsHost.appendChild(el(`<div class="sub text-xs mb-2">Ще не додано жодної позиції</div>`));
    }
    draftItems.forEach((it,idx)=>{
      const row = el(`
        <div class="card p-3 mb-2 flex items-center justify-between">
          <div>
            <div class="font-medium text-sm">${escapeHtml(it.inputName)}: ${fmt(it.inputWeight)} ${escapeHtml(it.inputUnit)} → ${escapeHtml(it.outputName)}</div>
            ${it.hasLoss ? `<div class="sub text-xs">Втрати обробки: ${fmt(it.lossWeight)} ${escapeHtml(it.inputUnit)}</div>` : ''}
          </div>
          <button data-rm style="background:none;border:none;color:var(--danger);font-size:1.1rem;padding:0 4px;cursor:pointer">&times;</button>
        </div>
      `);
      row.querySelector('[data-rm]').onclick = ()=>{ draftItems = draftItems.filter((x,i)=>i!==idx); renderDraftItems(); };
      itemsHost.appendChild(row);
    });
  }
  renderDraftItems();

  if(rawProducts.length===0){
    wrap.appendChild(el(`<div class="sub text-sm py-6 text-center">На цьому складі поки немає сировини для готовки.</div>`));
    return wrap;
  }

  const formCard = el(`<div class="card p-3 mb-4" style="background:var(--card3)"></div>`);
  formCard.appendChild(el(`<div class="font-semibold text-sm mb-2">Додати позицію</div>`));

  formCard.appendChild(el(`<div class="sub text-xs mb-1.5">Що готуємо (сировина)</div>`));
  const inputSelectHost = el(`<div class="mb-2"></div>`);
  formCard.appendChild(inputSelectHost);
  let selectedInput = rawProducts[0];
  const availLabel = el(`<div class="sub text-xs mb-2">Доступно: ${fmt(selectedInput.qty)} ${escapeHtml(selectedInput.unit)}</div>`);
  formCard.appendChild(availLabel);
  const inputSelect = customSelect(
    rawProducts.map(p=>({value:p.id, label:p.name})),
    selectedInput.id,
    (val)=>{
      selectedInput = rawProducts.find(p=>p.id===val);
      availLabel.textContent = 'Доступно: '+fmt(selectedInput.qty)+' '+selectedInput.unit;
      updateOutputOptions();
    }
  );
  inputSelectHost.appendChild(inputSelect);

  function miniField(label, placeholder){
    const f = el(`
      <div class="mb-2">
        <div class="sub text-xs mb-1">${escapeHtml(label)}</div>
        <input type="text" inputmode="decimal" class="w-full py-2.5 px-3" style="border-radius:10px;background:var(--card2);color:var(--text);border:none" placeholder="${escapeHtml(placeholder||'')}">
      </div>
    `);
    return f;
  }

  const takenField = miniField('Взято', '0');
  const takenInput = takenField.querySelector('input');
  formCard.appendChild(takenField);

  // Втрати при обробці — toggle
  let hasLoss = false;
  const lossToggleRow = el(`<div class="flex items-center justify-between mb-2"></div>`);
  lossToggleRow.appendChild(el(`<div class="text-sm font-medium">Є втрати при обробці</div>`));
  const lossToggle = el(`<button type="button" style="width:42px;height:24px;border-radius:999px;border:none;position:relative;background:var(--card2);flex-shrink:0"><span style="position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:999px;background:#fff;transition:left .15s"></span></button>`);
  const lossKnob = lossToggle.querySelector('span');
  lossToggleRow.appendChild(lossToggle);
  formCard.appendChild(lossToggleRow);
  const lossField = miniField('Втрати при обробці', '0');
  lossField.style.display = 'none';
  const lossInput = lossField.querySelector('input');
  formCard.appendChild(lossField);
  const netLabel = el(`<div class="sub text-xs mb-2">Чистий вага: 0</div>`);
  formCard.appendChild(netLabel);
  lossToggle.onclick = ()=>{
    hasLoss = !hasLoss;
    lossToggle.style.background = hasLoss ? 'var(--accent)' : 'var(--card2)';
    lossKnob.style.left = hasLoss ? '20px' : '2px';
    lossField.style.display = hasLoss ? '' : 'none';
    updateNet();
  };
  function updateNet(){
    const taken = parseFloat((takenInput.value||'').replace(',','.')) || 0;
    const loss = hasLoss ? (parseFloat((lossInput.value||'').replace(',','.')) || 0) : 0;
    const net = Math.max(0, taken - loss);
    const unit = selectedInput ? selectedInput.unit : '';
    netLabel.textContent = 'Чистий вага: ' + fmt(net) + ' ' + unit;
  }
  takenInput.addEventListener('input', updateNet);
  lossInput.addEventListener('input', updateNet);

  // Готовий продукт — список залежить від того, яку сировину обрали: показуємо тільки продукти,
  // явно пов'язані з цією сировиною в Налаштуваннях (Зв'язки готовки). Якщо для сировини ще
  // немає жодного зв'язку, лишається тільки «+ Новий продукт», щоб не пропонувати зайве.
  const NEW_OUTPUT = '__new__';
  formCard.appendChild(el(`<div class="sub text-xs mb-1.5">Що отримаємо (готовий продукт)</div>`));
  const outSelectHost = el(`<div class="mb-2"></div>`);
  formCard.appendChild(outSelectHost);
  const outNameField = miniField('Назва нового продукту', 'Наприклад, Ошеек BBQ');
  outNameField.querySelector('input').type = 'text';
  outNameField.querySelector('input').removeAttribute('inputmode');
  const outNameInput = outNameField.querySelector('input');
  let selectedOutputName = NEW_OUTPUT;
  const outSelect = customSelect(
    [{value:NEW_OUTPUT, label:'+ Новий продукт'}],
    NEW_OUTPUT,
    (val)=>{ selectedOutputName = val; outNameField.style.display = val===NEW_OUTPUT ? '' : 'none'; }
  );
  outSelectHost.appendChild(outSelect);
  formCard.appendChild(outNameField);
  const noLinksHint = el(`<div class="sub text-xs mb-2" style="display:none">Для «${''}» ще не налаштовано зв'язаних продуктів — додайте їх у Налаштуваннях → «Зв'язки готовки», або вкажіть назву нового продукту нижче.</div>`);
  formCard.insertBefore(noLinksHint, outNameField);
  function updateOutputOptions(){
    const linked = selectedInput ? linkedOutputsFor(selectedInput.name) : [];
    const opts = [...linked.map(n=>({value:n, label:n})), {value:NEW_OUTPUT, label:'+ Новий продукт'}];
    selectedOutputName = linked[0] || NEW_OUTPUT;
    outSelect.setOptions(opts);
    outSelect.setValue(selectedOutputName);
    outNameField.style.display = selectedOutputName===NEW_OUTPUT ? '' : 'none';
    noLinksHint.style.display = linked.length===0 ? '' : 'none';
    noLinksHint.textContent = `Для «${selectedInput ? selectedInput.name : ''}» ще не налаштовано зв'язаних продуктів — додайте їх у Налаштуваннях → «Зв'язки готовки», або вкажіть назву нового продукту нижче.`;
  }
  updateOutputOptions();

  const formErr = el(`<div class="text-sm mb-2" style="color:var(--danger);min-height:1.2em"></div>`);
  formCard.appendChild(formErr);

  const addItemBtn = el(`<button class="w-full btn-solid py-2.5">Додати позицію</button>`);
  addItemBtn.onclick = ()=>{
    const taken = parseFloat((takenInput.value||'').replace(',','.')) || 0;
    if(taken<=0){ formErr.textContent = 'Вкажіть скільки взято'; return; }
    if(taken>selectedInput.qty && !allowNegativeStock()){ formErr.textContent = 'Недостатньо «'+selectedInput.name+'» на складі (доступно '+fmt(selectedInput.qty)+' '+selectedInput.unit+')'; return; }
    const loss = hasLoss ? (parseFloat((lossInput.value||'').replace(',','.')) || 0) : 0;
    if(loss<0 || loss>taken){ formErr.textContent = 'Втрати не можуть перевищувати взяту кількість'; return; }
    const net = taken - loss;
    const outputName = selectedOutputName===NEW_OUTPUT ? outNameInput.value.trim() : selectedOutputName;
    if(!outputName){ formErr.textContent = 'Вкажіть назву готового продукту'; return; }
    formErr.textContent = '';
    draftItems.push({
      inputId: selectedInput.id, inputName: selectedInput.name, inputUnit: selectedInput.unit,
      inputWeight: taken, hasLoss, lossWeight: loss, netWeight: net,
      outputName
    });
    takenInput.value = ''; lossInput.value = ''; outNameInput.value = '';
    hasLoss = false; lossToggle.style.background='var(--card2)'; lossKnob.style.left='2px'; lossField.style.display='none';
    updateNet();
    renderDraftItems();
  };
  formCard.appendChild(addItemBtn);
  wrap.appendChild(formCard);

  const err = el(`<div class="text-sm mb-3" style="color:var(--danger);min-height:1.2em"></div>`);
  wrap.appendChild(err);

  const doneBtn = el(`<button class="w-full btn-solid py-3">Почати готовку</button>`);
  doneBtn.onclick = ()=>{
    if(draftItems.length===0){ err.textContent = 'Додайте хоча б одну позицію'; return; }
    const production = startProduction(draftItems, selectedOutputWarehouseId);
    editingProductionId = production.id;
    view = 'productionDetail';
    render();
  };
  wrap.appendChild(doneBtn);
  return wrap;
}

// Кухар: власна вкладка "Виробництво" в нижньому меню (замість того, щоб ховати цей екран у Складі,
// як для власника) — це і є друга з двох речей, які кухарю взагалі потрібні.
function cookProductionView(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`<div class="font-bold mb-4" style="font-size:1.2rem">Виробництво</div>`));
  const prodBtn = el(`<button class="w-full btn-solid py-3 mb-4">+ Нова готовка</button>`);
  prodBtn.onclick = ()=>{ view='productionStart'; render(); };
  wrap.appendChild(prodBtn);
  wrap.appendChild(productionListContent());
  return wrap;
}

function productionListContent(){
  const wrap = el(`<div></div>`);
  const list = state.productions.filter(p=>p.warehouseId===state.currentWarehouse);

  if(list.length===0){
    wrap.appendChild(el(`<div class="sub text-center py-10">Поки немає жодної готовки</div>`));
    return wrap;
  }
  list.forEach(p=>{
    const inProcess = p.status==='in_process';
    const summary = inProcess
      ? p.items.map(it=>`${escapeHtml(it.inputName)} ${fmt(it.inputWeight)}${escapeHtml(it.inputUnit)} → ${escapeHtml(it.outputName)}`).join(', ')
      : p.items.map(it=>`${escapeHtml(it.inputName)} ${fmt(it.inputWeight)}${escapeHtml(it.inputUnit)} → ${fmt(it.outputWeight)}${escapeHtml(it.inputUnit)}`).join(', ');
    const statusBadge = inProcess
      ? `<span style="color:var(--warn);font-weight:700">● В процесі</span>`
      : `<span style="color:var(--accent2);font-weight:700">✓ Готово</span>`;
    const avgShrinkage = (!inProcess && p.items.length) ? (p.items.reduce((s,it)=>s+(it.shrinkagePercent||0),0)/p.items.length) : null;
    const row = el(`
      <div class="card p-3 mb-2" style="cursor:pointer">
        <div class="flex items-center justify-between mb-1">
          <div class="sub text-xs">${escapeHtml(p.startTs||p.ts)} · ${escapeHtml(p.employeeName)}</div>
          <div class="text-xs">${statusBadge}</div>
        </div>
        <div class="font-medium text-sm mb-1">${summary}</div>
        ${avgShrinkage!==null ? `<div class="sub text-xs">Середня усушка: ${fmt(avgShrinkage)}%</div>` : ''}
      </div>
    `);
    row.onclick = ()=>{ editingProductionId = p.id; view='productionDetail'; render(); };
    wrap.appendChild(row);
  });
  return wrap;
}

// Власник налаштовує тут, які готові продукти можна отримати з якої сировини (напр.
// "М'ясо курка" -> "М'ясо курка BBQ"). Ці зв'язки керують списком варіантів у «Новій готовці» —
// вибравши сировину, кухар/заготівельник бачить тільки пов'язані з нею продукти.
function productionLinksView(){
  const wrap = el(`<div></div>`);
  const topBar = el(`
    <div class="flex items-center gap-3 mb-4">
      <button id="plBack" class="navicon-btn" style="background:var(--card3)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="font-bold" style="font-size:1.1rem">Зв'язки готовки</div>
    </div>
  `);
  topBar.querySelector('#plBack').onclick = ()=>{ view='settings'; render(); };
  wrap.appendChild(topBar);
  wrap.appendChild(el(`<div class="sub text-xs mb-4">Зв'яжіть сировину з готовим продуктом (наприклад, «М'ясо курка» → «М'ясо курка BBQ»). У «Новій готовці» після вибору сировини буде запропоновано тільки пов'язані з нею продукти.</div>`));

  // Унікальні назви позицій складу (по всіх складах), щоб зв'язки не прив'язувались до конкретного складу.
  const allNames = Array.from(new Set(state.stockItems.map(i=>i.name))).sort((a,b)=>a.localeCompare(b,'uk'));

  wrap.appendChild(el(`<div class="font-semibold text-sm mb-2">Наявні зв'язки</div>`));
  if(state.productionLinks.length===0){
    wrap.appendChild(el(`<div class="sub text-xs mb-4">Ще не додано жодного зв'язку</div>`));
  } else {
    state.productionLinks.slice().sort((a,b)=>a.rawName.localeCompare(b.rawName,'uk')).forEach(link=>{
      const row = el(`
        <div class="card p-3 mb-2 flex items-center justify-between">
          <div class="font-medium text-sm">${escapeHtml(link.rawName)} → ${escapeHtml(link.outputName)}</div>
          <button data-del style="background:none;border:none;color:var(--danger);font-size:1.3rem;padding:0 4px;cursor:pointer">&times;</button>
        </div>
      `);
      row.querySelector('[data-del]').onclick = ()=>{ removeProductionLink(link.id); render(); };
      wrap.appendChild(row);
    });
  }

  if(allNames.length===0){
    wrap.appendChild(el(`<div class="sub text-sm py-4 text-center">Спершу додайте хоча б один продукт на склад.</div>`));
    return wrap;
  }

  const formCard = el(`<div class="card p-3 mb-4" style="background:var(--card3)"></div>`);
  formCard.appendChild(el(`<div class="font-semibold text-sm mb-2">Додати зв'язок</div>`));

  formCard.appendChild(el(`<div class="sub text-xs mb-1.5">Сировина</div>`));
  const rawSelectHost = el(`<div class="mb-2"></div>`);
  formCard.appendChild(rawSelectHost);
  let draftRaw = allNames[0];
  const rawSelect = customSelect(
    allNames.map(n=>({value:n, label:n})),
    draftRaw,
    (val)=>{ draftRaw = val; }
  );
  rawSelectHost.appendChild(rawSelect);

  formCard.appendChild(el(`<div class="sub text-xs mb-1.5">Готовий продукт</div>`));
  const NEW_NAME = '__new__';
  const outSelectHost = el(`<div class="mb-2"></div>`);
  formCard.appendChild(outSelectHost);
  let draftOutput = allNames[0];
  const newNameField = el(`
    <div class="mb-2">
      <input type="text" class="w-full py-2.5 px-3" style="border-radius:10px;background:var(--card2);color:var(--text);border:none" placeholder="Назва готового продукту">
    </div>
  `);
  newNameField.style.display = 'none';
  const newNameInput = newNameField.querySelector('input');
  const outSelect = customSelect(
    [...allNames.map(n=>({value:n, label:n})), {value:NEW_NAME, label:'+ Інша назва'}],
    draftOutput,
    (val)=>{ draftOutput = val; newNameField.style.display = val===NEW_NAME ? '' : 'none'; }
  );
  outSelectHost.appendChild(outSelect);
  formCard.appendChild(newNameField);

  const formErr = el(`<div class="text-sm mb-2" style="color:var(--danger);min-height:1.2em"></div>`);
  formCard.appendChild(formErr);

  const addBtn = el(`<button class="w-full btn-solid py-2.5">Додати зв'язок</button>`);
  addBtn.onclick = ()=>{
    const outputName = draftOutput===NEW_NAME ? newNameInput.value.trim() : draftOutput;
    if(!outputName){ formErr.textContent = 'Вкажіть назву готового продукту'; return; }
    if(outputName===draftRaw){ formErr.textContent = 'Сировина і готовий продукт мають відрізнятись'; return; }
    addProductionLink(draftRaw, outputName);
    render();
  };
  formCard.appendChild(addBtn);
  wrap.appendChild(formCard);

  return wrap;
}

function productionDetailView(){
  const p = state.productions.find(x=>x.id===editingProductionId);
  const wrap = el(`<div></div>`);
  const inProcess = p && p.status==='in_process';
  const topBar = el(`
    <div class="flex items-center gap-3 mb-4">
      <button id="pdBack" class="navicon-btn" style="background:var(--card3)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="font-bold" style="font-size:1.1rem">${inProcess ? 'Готовка в процесі' : (isOwner() ? 'Готовка' : 'Готовка завершена')}</div>
    </div>
  `);
  topBar.querySelector('#pdBack').onclick = ()=>{ editingProductionId=null; backFromProduction(); render(); };
  wrap.appendChild(topBar);

  if(!p){
    wrap.appendChild(el(`<div class="sub text-center py-10">Запис не знайдено</div>`));

  }

  }

  wrap.appendChild(el(`<div class="sub text-sm mb-4">${escapeHtml(p.startTs||p.ts)} → ${escapeHtml(p.endTs||p.ts)} · ${escapeHtml(p.employeeName)}</div>`));

  const showShrinkage = canSeeShrinkage();
  p.items.forEach(it=>{
    const row = el(`<div class="card p-3 mb-2"></div>`);
    row.appendChild(el(`<div class="font-semibold mb-1">${escapeHtml(it.inputName)} → ${escapeHtml(it.outputName)}</div>`));
    row.appendChild(el(`<div class="sub text-sm">Взято: ${fmt(it.inputWeight)} ${escapeHtml(it.inputUnit)}</div>`));
    if(it.hasLoss) row.appendChild(el(`<div class="sub text-sm">Втрати при обробці: ${fmt(it.lossWeight)} ${escapeHtml(it.inputUnit)}</div>`));
    row.appendChild(el(`<div class="sub text-sm">Отримано: ${fmt(it.outputWeight)} ${escapeHtml(it.inputUnit)}</div>`));
    if(showShrinkage){
      row.appendChild(el(`<div class="sub text-xs mt-1">Чистий вага: ${fmt(it.netWeight)} ${escapeHtml(it.inputUnit)} · Втрати обробки: ${fmt(it.processingLossPercent)}% · Усушка: ${fmt(it.shrinkagePercent)}% · Вихід: ${fmt(it.yieldPercent)}%</div>`));

  });

    wrap.appendChild(el(`<div class="sub text-sm mt-2">Готовий продукт додано на склад «${escapeHtml((state.warehouses.find(w=>w.id===p.warehouseId)||{}).name||'')}».</div>`));
  }
  return wrap;
}

// Stage 2: готовка "в процесі" — оберіть кожну позицію і вкажіть скільки фактично приготувалось,
// потім одним натисканням оприбуткуйте все на склад і завершіть готовку.
function productionInProcessView(p, wrap, topBar){
  wrap.appendChild(el(`<div class="sub text-sm mb-4">Почато: ${escapeHtml(p.startTs||p.ts)} · ${escapeHtml(p.employeeName)}</div>`));
  wrap.appendChild(el(`<div class="sub text-xs mb-3">Натисніть на позицію, щоб вказати вагу готового продукту. Готові позиції позначені зеленою галочкою.</div>`));

  const weights = {}; // itemId -> entered weight (number) or undefined if not entered yet
  const err = el(`<div class="text-sm mb-3" style="color:var(--danger);min-height:1.2em"></div>`);

  function openWeightPrompt(it, valueLabel, badge){
    showModal((card, close)=>{
      card.appendChild(el(`<div class="font-semibold mb-1" style="font-size:1rem">${escapeHtml(it.inputName)} → ${escapeHtml(it.outputName)}</div>`));
      card.appendChild(el(`<div class="sub text-sm mb-3">Чиста вага сировини: ${fmt(it.netWeight)} ${escapeHtml(it.inputUnit)}</div>`));
      card.appendChild(el(`<div class="sub text-xs mb-1">Отримано готового продукту, ${escapeHtml(it.inputUnit)}</div>`));
      const input = el(`<input type="text" inputmode="decimal" class="w-full py-3 px-3 mb-4" style="border-radius:14px;background:var(--card3);color:var(--text);border:none" placeholder="0">`);
      if(weights[it.id]!==undefined) input.value = fmt(weights[it.id]);
      card.appendChild(input);
      const modalErr = el(`<div class="text-sm mb-2" style="color:var(--danger);min-height:1.2em"></div>`);
      card.appendChild(modalErr);
      const row = el(`<div class="flex gap-2"></div>`);
      const cancelBtn = el(`<button class="btn-line flex-1 py-3">Скасувати</button>`);
      const okBtn = el(`<button class="btn-solid flex-1 py-3">Зберегти</button>`);
      cancelBtn.onclick = close;
      okBtn.onclick = ()=>{
        const val = parseFloat((input.value||'').replace(',','.')) || 0;
        if(val<=0){ modalErr.textContent = 'Вкажіть вагу більше нуля'; return; }
        weights[it.id] = val;
        valueLabel.textContent = 'Отримано: ' + fmt(val) + ' ' + it.inputUnit;
        valueLabel.style.color = 'var(--accent2)';
        badge.style.display = '';
        err.textContent = '';
        close();
      };
      input.addEventListener('keydown', e=>{ if(e.key==='Enter') okBtn.onclick(); });
      row.appendChild(cancelBtn); row.appendChild(okBtn);
      card.appendChild(row);
      setTimeout(()=>input.focus(), 50);
    });
  }

  p.items.forEach(it=>{
    const row = el(`<div class="card p-3 mb-2" style="position:relative;cursor:pointer"></div>`);
    const badge = el(`
      <div style="position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:999px;background:var(--accent2);display:none;align-items:center;justify-content:center">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
      </div>
    `);
    row.appendChild(badge);
    row.appendChild(el(`<div class="font-semibold mb-1" style="padding-right:28px">${escapeHtml(it.inputName)} → ${escapeHtml(it.outputName)}</div>`));
    row.appendChild(el(`<div class="sub text-sm">Взято: ${fmt(it.inputWeight)} ${escapeHtml(it.inputUnit)}${it.hasLoss ? ' · Втрати обробки: '+fmt(it.lossWeight)+' '+escapeHtml(it.inputUnit) : ''}</div>`));
    row.appendChild(el(`<div class="sub text-sm mb-1">Чиста вага: ${fmt(it.netWeight)} ${escapeHtml(it.inputUnit)}</div>`));
    const valueLabel = el(`<div class="text-sm font-medium" style="color:var(--accent)">Натисніть, щоб вказати вагу</div>`);
    row.appendChild(valueLabel);
    row.onclick = ()=> openWeightPrompt(it, valueLabel, badge);
    wrap.appendChild(row);
  });

  wrap.appendChild(err);

  const finishBtn = el(`<button class="w-full btn-solid py-3">Додати на склад і завершити готовку</button>`);
  finishBtn.onclick = ()=>{
    for(const it of p.items){
      if(!(weights[it.id] > 0)){ err.textContent = 'Вкажіть вагу готового продукту для всіх позицій'; return; }
    }
    err.textContent = '';
    finishProduction(p.id, weights);
  };
  wrap.appendChild(finishBtn);
  return wrap;
}

function ingredientAddView(){
  // Builds a global recipe ingredient (e.g. "Соус часниковий") out of one or more purchased products.
  // If editingIngredientId is set, this edits that ingredient in place instead of creating a new one.
  const editing = editingIngredientId ? state.recipeIngredients.find(i=>i.id===editingIngredientId) : null;
  const wrap = el(`<div></div>`);
  const topBar = el(`
    <div class="flex items-center gap-3 mb-5">
      <button id="iaBack" class="navicon-btn" style="background:var(--card3)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="font-bold" style="font-size:1.1rem">${editing?'Редагування інгредієнта':'Новий інгредієнт'}</div>
    </div>
  `);
  topBar.querySelector('#iaBack').onclick = ()=>{ editingIngredientId=null; view='ingredients'; render(); };
  wrap.appendChild(topBar);

  function field(label, placeholder){
    const f = el(`
      <div class="mb-4">
        <div class="sub text-xs mb-1.5">${escapeHtml(label)}</div>
        <input type="text" class="w-full py-3 px-3" style="border-radius:14px;background:var(--card3);color:var(--text);border:none" placeholder="${escapeHtml(placeholder||'')}">
      </div>
    `);
    return f;
  }

  const nameField = field('Назва інгредієнта', 'Наприклад, Соус часниковий');
  const nameInput = nameField.querySelector('input');
  if(editing) nameInput.value = editing.name;
  wrap.appendChild(nameField);

  const availableProducts = allProductNames();
  let draftUnit = editing ? editing.unit : 'г';
  let draftComponents = editing ? (editing.components||[]).map(c=>({...c})) : [];

  wrap.appendChild(el(`<div class="sub text-xs mb-4">Собівартість інгредієнта рахується автоматично із закупівельної ціни продуктів, з яких він складається — навіть якщо це один продукт 1:1.</div>`));

  // --- Рецепт з одного чи кількох продуктів: кожен інгредієнт завжди прив'язаний до продукту(ів) на складі ---
  const prepSection = el(`<div></div>`);
  wrap.appendChild(prepSection);

  prepSection.appendChild(el(`<div class="sub text-xs mb-1.5">Одиниця виміру готового інгредієнта</div>`));
  const unitRow = segmentedPicker(
    [['г','Грами','⚖️'],['мл','Мілілітри','💧'],['шт','Штуки','#️⃣']],
    draftUnit,
    (key)=>{ draftUnit = key; }
  );
  prepSection.appendChild(unitRow);

  prepSection.appendChild(el(`<div class="font-semibold text-sm mb-2">З яких продуктів складається</div>`));
  const compList = el(`<div class="mb-2"></div>`);
  prepSection.appendChild(compList);

  function renderComps(){
    compList.innerHTML = '';
    if(draftComponents.length===0){
      compList.appendChild(el(`<div class="sub text-xs mb-2">Ще не додано жодного продукту</div>`));
    }
    draftComponents.forEach(c=>{
      const row = el(`
        <div class="card p-3 mb-2 flex items-center justify-between">
          <div class="font-medium text-sm">${escapeHtml(c.productName)} · ${fmt(c.amount)} ${escapeHtml(c.unit)}</div>
          <button data-rm style="background:none;border:none;color:var(--danger);font-size:1.1rem;padding:0 4px;cursor:pointer">&times;</button>
        </div>
      `);
      row.querySelector('[data-rm]').onclick = ()=>{
        draftComponents = draftComponents.filter(x=>x.id!==c.id);
        renderComps();
      };
      compList.appendChild(row);
    });
  }
  renderComps();

  const addCompRow = el(`
    <div class="card p-3 mb-4" style="background:var(--card3)">
      <div data-selhost class="mb-2"></div>
      <div class="flex gap-2">
        <input type="text" inputmode="decimal" placeholder="Кількість" class="flex-1 py-2.5 px-3" style="border-radius:10px;background:var(--card2);color:var(--text);border:none">
        <button class="btn-solid" style="padding:0 20px">Додати</button>
      </div>
    </div>
  `);
  const compSelectHost = addCompRow.querySelector('[data-selhost]');
  const compAmountInput = addCompRow.querySelector('input');
  const compAddBtn = addCompRow.querySelector('button');
  const compSelect = customSelect(
    availableProducts.map(p=>({value:p.name, label:p.name+' ('+p.unit+')'})),
    null, null
  );
  compSelectHost.appendChild(compSelect);
  compAddBtn.onclick = ()=>{
    if(availableProducts.length===0){ appAlert('Спочатку додайте продукти у розділі «Склади».'); return; }
    const productName = compSelect.getValue();
    const product = availableProducts.find(p=>p.name===productName);
    if(!product) return;
    const amount = parseFloat((compAmountInput.value||'').replace(',','.'));
    if(!amount || amount<=0){ appAlert('Вкажіть кількість продукту'); return; }
    draftComponents.push({ id: uid(), productName: product.name, unit: product.unit, amount });
    compAmountInput.value = '';
    renderComps();
  };
  prepSection.appendChild(addCompRow);

  const yieldField = field('Вихід готового інгредієнта з цього рецепту', '1');
  const yieldInput = yieldField.querySelector('input');
  yieldInput.setAttribute('inputmode','decimal');
  if(editing) yieldInput.value = editing.yieldAmount;
  prepSection.appendChild(yieldField);

  // Availability: shared across every warehouse by default, optionally restricted to one.
  let availOne = !!(editing && editing.warehouseId);
  let availWhId = editing && editing.warehouseId ? editing.warehouseId : state.currentWarehouse;
  wrap.appendChild(el(`<div class="sub text-xs mb-1.5">Доступність інгредієнта</div>`));
  const availRow = segmentedPicker(
    [['all','Усі склади'],['one','Один склад']],
    availOne ? 'one' : 'all',
    (key)=>{ availOne = key==='one'; whPickerWrap.style.display = availOne ? '' : 'none'; }
  );
  wrap.appendChild(availRow);
  const whPickerWrap = el(`<div class="mb-4"></div>`);
  whPickerWrap.style.display = availOne ? '' : 'none';
  const whPicker = customSelect(
    state.warehouses.map(w=>({value:w.id, label:w.name})),
    availWhId,
    (val)=>{ availWhId = val; }
  );
  whPickerWrap.appendChild(whPicker);
  wrap.appendChild(whPickerWrap);

  const curWhNameForQty = (state.warehouses.find(w=>w.id===ingredientBaseWarehouseId())||{}).name || '';
  const qtyField = field('Залишок на складі «'+curWhNameForQty+'»', '0');
  const qtyInput = qtyField.querySelector('input');
  qtyInput.setAttribute('inputmode','decimal');
  if(editing) qtyInput.value = fmt(curIngredientQty(editing));
  wrap.appendChild(qtyField);
  wrap.appendChild(el(`<div class="sub text-xs mb-4">Виставте тут кількість після приготування — далі її можна перемістити на іншу точку через «Поставку».</div>`));

  const err = el(`<div class="text-sm mb-3" style="color:var(--danger);min-height:1.2em"></div>`);
  wrap.appendChild(err);

  const saveBtn = el(`<button class="w-full btn-solid py-3 mb-3">Зберегти</button>`);
  saveBtn.onclick = ()=>{
    const name = nameInput.value.trim();
    if(!name){ err.textContent = 'Введіть назву інгредієнта'; return; }
    if(draftComponents.length===0){ err.textContent = 'Додайте хоча б один продукт — з нього рахується собівартість'; return; }
    const yieldAmount = parseFloat((yieldInput.value||'').replace(',','.')) || 1;
    const qty = parseFloat((qtyInput.value||'').replace(',','.')) || 0;
    const data = { name, unit: draftUnit, yieldAmount, components: draftComponents, warehouseId: availOne ? availWhId : null, qty, isRecipe: true };

    if(editing) updateRecipeIngredient(editing.id, data);
    else addRecipeIngredient(data);

    editingIngredientId = null;
    view = 'ingredients';
    render();
  };
  wrap.appendChild(saveBtn);

  if(editing){
    const delBtn = el(`<button class="w-full btn-line py-3" style="color:var(--danger)">Видалити інгредієнт</button>`);
    delBtn.onclick = ()=>{
      appConfirm('Видалити "'+editing.name+'"?', ()=>{
        deleteRecipeIngredient(editing.id);
        editingIngredientId = null;
        view = 'ingredients';
        render();
      });
    };
    wrap.appendChild(delBtn);
  }

  setTimeout(()=>nameInput.focus(), 50);
  return wrap;
}

function historyView(){
  const wrap = el(`<div></div>`);
  const items = state.history.filter(h=>h.warehouseId===state.currentWarehouse);
  if(items.length===0){
    wrap.appendChild(el(`<div class="sub text-center py-10">Пока нет операций</div>`));
    return wrap;
  }
  // Списання, що належать одному чеку Checkbox, показуємо однією карткою «Чек …» — вона розгортається
  // в перелік списаних продуктів. Решта операцій — як і раніше окремими рядками.
  const groups = new Map(); // orderRef -> { rows:[], host }
  items.forEach(h=>{
    if(h.orderRef){
      let g = groups.get(h.orderRef);
      if(!g){
        const ord = (state.orders||[]).find(o=>o.checkboxId===h.orderRef || o.glovoId===h.orderRef);
        const card = el(`
          <div class="card p-3 mb-2" style="cursor:pointer">
            <div class="flex items-center justify-between">
              <div>
                <div class="font-medium">${ord&&ord.source==='glovo'?'🛵 Glovo':(ord&&ord.isReturn?'↩ Повернення':'🧾 Чек')}${ord&&ord.cashierName?' · '+escapeHtml(ord.cashierName):''}</div>
                <div class="sub text-xs">Списання за продажем · ${escapeHtml(h.ts)}</div>
              </div>
              <div style="text-align:right"><div class="font-bold">${ord?fmtMoney(ord.total):''}</div><div class="sub text-xs rc-n"></div></div>
            </div>
            <div class="rc-rows" style="display:none;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)"></div>
          </div>
        `);
        const rowsBox = card.querySelector('.rc-rows');
        card.addEventListener('click', ()=>{ rowsBox.style.display = rowsBox.style.display==='none' ? 'block' : 'none'; });
        g = { rows:[], card, rowsBox, n: card.querySelector('.rc-n') };
        groups.set(h.orderRef, g);
        wrap.appendChild(card);
      }
      g.rows.push(h);
      g.rowsBox.appendChild(el(`
        <div class="flex items-center justify-between text-sm" style="padding:3px 0">
          <span>${escapeHtml(h.name)}</span>
          <span class="font-semibold" style="color:${h.delta>0?'var(--ok)':'var(--danger)'}">${h.delta>0?'+':''}${fmt(h.delta)} ${escapeHtml(h.unit)}</span>
        </div>
      `));
      g.n.textContent = g.rows.length + ' поз. списано';
      return;
    }
    const positive = h.delta>0;
    const row = el(`
      <div class="card p-3 mb-2 flex items-center justify-between">
        <div>
          <div class="font-medium">${escapeHtml(h.name)}</div>
          <div class="sub text-xs">${escapeHtml(h.reason)} · ${escapeHtml(h.who||'')} · ${h.ts}</div>
        </div>
        <div class="font-bold" style="color:${positive?'var(--ok)':'var(--danger)'}">
          ${positive?'+':''}${fmt(h.delta)} ${escapeHtml(h.unit)}
        </div>

    `);

  });
  return wrap;
}

// «Історія моїх дій» — той самий журнал операцій, але тільки те, що зробив саме цей співробітник
// (за будь-яким складом/точкою), а не все, що відбулось на поточному складі.
// «Історія моїх дій» об'єднує ДВА джерела: рух товару/інгредієнтів (state.history — з кількістю),
// і ширший журнал подій (state.auditLog — задачі, запити поставок тощо, без кількості), відфільтровані
// по цьому користувачу й відсортовані за часом (tsMs; старі записи без нього просто йдуть в кінець).
function actionLabelForReason(reason){
  const r = String(reason||'');
  if(r.startsWith('Списання')) return { label:'Списання', icon:'🗑', detail: r.replace(/^Списання:?\s*/,'') };
  if(r.startsWith('Заготовка')) return { label:'Заготовка', icon:'🥣', detail: r.replace(/^Заготовка:?\s*/,'') };
  if(r.startsWith('Закупівля')) return { label:'Закупівля', icon:'🛒', detail:'' };
  if(r.startsWith('Поставка')) return { label:'Поставка', icon:'🚚', detail: r.replace(/^Поставка\s*/,'').replace(/[()]/g,'') };
  if(r.startsWith('Виробництво')) return { label:'Виробництво', icon:'🏭', detail: r.replace(/^Виробництво:?\s*/,'') };
  if(r.startsWith('Інвентаризація')) return { label:'Інвентаризація', icon:'📋', detail:'' };
  if(r.startsWith('Редагування')) return { label:'Редагування залишку', icon:'✏️', detail:'вручну' };
  return { label: r||'Операція', icon:'•', detail:'' };
}
function orderLineDetails(l){
  const parts = [];
  if(l.productType==='combo' || (l.comboSelections && l.comboSelections.length)){
    (l.comboSelections||[]).forEach(c=>{
      parts.push(c.name+((c.selectedOptions&&c.selectedOptions.length)?' ('+c.selectedOptions.map(o=>o.name).join(', ')+')':''));
    });
    (l.selectedOptions||[]).forEach(o=> parts.push(o.name));
  } else {
    if(l.modifierName) parts.push(l.modifierName);
    (l.selectedOptions||[]).forEach(o=> parts.push(o.name));
  }
  return parts.join(' · ');
}

let cbAwaiting = new Set(); // id чеків, застосованих тут і ще не підтверджених серверу
let cbTickBusy = false;
function cbReceiptApplied(id){
  return (state.orders||[]).some(o=> o.checkboxId===id || String(o.checkboxId||'').startsWith(id+':'));
}
// Перетворює чек Checkbox на замовлення(я) + продаж(і) + списання зі складу. Повертає true, якщо щось застосовано.
// Поля рядка продажу, що залежать від товару меню (тип, рецепт-знімок, собівартість; для комбо — склад слотів).
function productLineFields(product){
  const f = { productId: product.id, productType: product.type, category: product.category,
    recipeSnapshot: product.type==='dish' ? (product.ingredients||[]).map(i=>({...i})) : [],
    costPriceSnapshot: Number(product.costPrice)||0 };
  if(product.type==='combo'){
    // Що саме обрано в комбо, зовнішнє джерело не знає — списуємо першу позицію кожного слота.
    f.comboSelections = (product.comboSlots||[]).map(sl=>{
      const sub = state.products.find(x=>x.id===(sl.productIds||[])[0]);
      return sub ? { slotId:sl.id, slotLabel:sl.label, productId:sub.id, name:sub.name, productType:sub.type,
        recipeSnapshot: sub.type==='dish' ? (sub.ingredients||[]).map(i=>({...i})) : [], selectedOptions:[] } : null;
    }).filter(Boolean);
  }
  return f;
}
// Спільна частина для чеків Checkbox і продажів Glovo: рядки → замовлення (по одному на категорію) + продаж
// + списання зі складу, прив'язане до замовлення (orderRef в історії складу, consumption в замовленні).
function recordSaleGroups(o){
  const { lines, locationId, ms, who, baseId, idKey, comment, source, extra } = o;
  const cats = {};
  lines.forEach(l=>{ if(l.category) cats[l.category] = (cats[l.category]||0) + Math.abs(l.price*l.qty); });
  const mainCat = Object.keys(cats).sort((a,b)=>cats[b]-cats[a])[0] || 'fastfood';
  const groups = {};
  lines.forEach(l=>{ const c = l.category || mainCat; (groups[c] = groups[c] || []).push(l); });
  const catKeys = Object.keys(groups);
  const d = new Date(ms || Date.now());
  const ts = d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  const dateKey = localDateKey(d);
  const made = [];
  historyWhoOverride = who;
  try{
    catKeys.forEach(cat=>{
      const items = groups[cat];
      const total = Number(items.reduce((s,l)=>s+l.price*l.qty,0).toFixed(2));
      const oid = catKeys.length>1 ? baseId+':'+cat : baseId;
      const ord = Object.assign({ id: uid(), [idKey]: oid, locationId, category: cat, items, comment: comment||'',
        total, ts, tsMs: ms||Date.now(), dateKey, who, consumption: [] }, JSON.parse(JSON.stringify(extra||{})));
      if(source) ord.source = source;
      state.orders.push(ord);
      const sale = { id: uid(), locationId, category: cat, amount: total, ts, tsMs: ms||Date.now(), dateKey, who, [idKey]: oid };
      if(source) sale.source = source;
      state.sales.push(sale);
      const consCart = items.filter(l=>!l.unmapped);
      if(consCart.length){
        historyRefOverride = oid; historyCapture = [];
        try{ applySaleConsumption(consCart, warehouseForLocation(locationId)); }
        finally{ ord.consumption = historyCapture; historyRefOverride = null; historyCapture = null; }
      }
      made.push(ord);
    });
  } finally { historyWhoOverride = null; }
  return made;
}
// Перетворює чек Checkbox на замовлення(я) + продаж(і) + списання зі складу. Повертає true, якщо щось застосовано.
function applyCheckboxReceipt(r){
  const cb = state.checkbox;
  if(cbReceiptApplied(r.id)) return false;
  let locationId = cb.registerMap[r.registerId];
  if(!locationId || !state.locations.find(l=>l.id===locationId)){
    locationId = state.locations[0] ? state.locations[0].id : null;
    cb.stats.unmappedRegisters++;
  }
  const sign = r.isReturn ? -1 : 1;
  const lines = r.goods.map(g=>{
    cb.goodsSeen[g.key] = { name:g.name, code:g.code, price:g.price };
    const pid = cb.itemMap[g.key];
    const product = pid ? state.products.find(p=>p.id===pid) : null;
    const base = { id: uid(), name: product ? product.name : g.name, checkboxName: g.name, price: g.price, qty: g.qty*sign,
      modifierId:null, modifierName:null, selectedOptions:[], optionsCostSnapshot:0, optionKey:'', comboSelections:[] };
    if(!product){ cb.stats.unmappedLines++; return Object.assign(base, { productId:null, productType:'unmapped', recipeSnapshot:[], costPriceSnapshot:0, unmapped:true, category:null }); }
    return Object.assign(base, productLineFields(product));
  });
  recordSaleGroups({ lines, locationId, ms: r.ms, who:'Checkbox', baseId: r.id, idKey:'checkboxId',
    comment: 'Checkbox'+(r.fiscalCode?' · '+r.fiscalCode:'')+(r.isReturn?' · ПОВЕРНЕННЯ':''),
    extra: { cashierName: r.cashier||'', isReturn: !!r.isReturn } });
  cb.stats.applied++;
  return true;
}
async function checkboxTick(){
  if(cbTickBusy || !authToken || !stateLoaded || saveInFlight || saveDebounceTimer) return;
  cbTickBusy = true;
  try{
    const st = await api('/api/checkbox/status');
    if(!st.ok || !st.body.enabled){ if(state.checkbox && state.checkbox.enabled){ state.checkbox.enabled = false; } return; }
    if(state.checkbox && !state.checkbox.enabled){ state.checkbox.enabled = true; }
    // Підтверджуємо серверу ті чеки, які вже бачимо у збереженому на сервері стані.
    if(cbAwaiting.size && lastSyncedJSON){
      const ready = [...cbAwaiting].filter(id=> lastSyncedJSON.includes(id));
      if(ready.length){ await api('/api/checkbox/confirm', { method:'POST', body: JSON.stringify({ ids: ready }) }); ready.forEach(id=>cbAwaiting.delete(id)); }
    }
    if(!st.body.pending) return;
    const cl = await api('/api/checkbox/claim', { method:'POST', body:'{}' });
    if(!cl.ok) return;
    let changed = false;
    (cl.body.receipts||[]).forEach(r=>{
      try{ if(applyCheckboxReceipt(r)) changed = true; }catch(e){ console.error('checkbox apply', e); return; }
      cbAwaiting.add(r.id);
    });
    if(changed){
      saveState();
      if(['dashboard','stock','myHistory','analytics','checkbox','locationStock','prepDashboard'].includes(view)) render();
    }
  } finally { cbTickBusy = false; }
}

// =====================================================================================
// Продажі Glovo: замовлення з Glovo вносяться вручну. Ціни в Glovo відрізняються від меню, а Glovo
// утримує комісію (за замовчуванням 36%). Тому для кожної позиції Glovo задається «ціна Glovo» і
// зв'язок із товаром меню; у виручку йде ЧИСТА сума (ціна Glovo мінус комісія), а собівартість і
// списання складу беруться з уже готового розрахунку зв'язаного товару меню.
// =====================================================================================
let glovoTab = 'sales';   // 'sales' | 'menu'
let glovoPeriod = 7;
let glovoDraft = null;
function glovoCfg(){ return state.glovo; }
// Glovo за день на точці: чистий оборот (після комісії) і профіт (після собівартості).
function glovoDayStats(locationId, dateKey){
  let net = 0, cost = 0;
  (state.orders||[]).forEach(o=>{
    if(o.source!=='glovo' || o.locationId!==locationId || o.dateKey!==dateKey) return;
    net += o.total;
    (o.items||[]).filter(l=>!l.unmapped).forEach(l=>{ cost += lineUnitCost(l)*l.qty; });
  });
  return { net, profit: net - cost };
}
function glovoNet(price, pct){ return Number((Number(price)*(1-(Number(pct)||0)/100)).toFixed(2)); }
function canUseGlovo(){ const u=curUser(); return !!u && (u.role==='owner' || u.role==='cashier'); }
function glovoLocationForUser(){
  const u = curUser();
  if(u && u.role==='cashier') return cashierShiftLocationId() || state.activeLocationId || (state.locations[0]||{}).id;
  return state.currentLocation && state.locations.find(l=>l.id===state.currentLocation) ? state.currentLocation : (state.locations[0]||{}).id;
}
function applyGlovoOrder(d){
  const g = glovoCfg();
  const pct = Number(d.commissionPct);
  const lines = d.items.map(it=>{
    const gi = g.items.find(x=>x.id===it.itemId);
    if(!gi) return null;
    const product = gi.productId ? state.products.find(p=>p.id===gi.productId) : null;
    const base = { id: uid(), name: product ? product.name : gi.name, glovoName: gi.name, glovoPrice: gi.price,
      price: glovoNet(gi.price, pct), qty: it.qty, modifierId:null, modifierName:null, selectedOptions:[], optionsCostSnapshot:0, optionKey:'', comboSelections:[] };
    if(!product) return Object.assign(base, { productId:null, productType:'unmapped', recipeSnapshot:[], costPriceSnapshot:0, unmapped:true, category:null });
    return Object.assign(base, productLineFields(product));
  }).filter(Boolean);
  if(!lines.length) return null;
  const gross = Number(lines.reduce((s,l)=>s+l.glovoPrice*l.qty,0).toFixed(2));
  const orders = recordSaleGroups({ lines, locationId: d.locationId, ms: d.ms, who: (curUser()||{}).name || 'Glovo', baseId: 'g'+uid(), idKey: 'glovoId',
    comment: 'Glovo'+(d.comment?' · '+d.comment:''), source: 'glovo', extra: { glovo: { gross, commissionPct: pct } } });
  orders.forEach(o=>{ o.glovo.gross = Number(o.items.reduce((s,l)=>s+l.glovoPrice*l.qty,0).toFixed(2)); o.glovo.commission = Number((o.glovo.gross - o.total).toFixed(2)); });
  logEvent('glovo', 'Продаж Glovo: '+fmtMoney(orders.reduce((s,o)=>s+o.total,0))+' (чисто)');
  return orders;
}
function deleteGlovoOrder(order){
  // Повертаємо на склад списане й прибираємо замовлення та його продаж.
  const back = (order.items||[]).filter(l=>!l.unmapped).map(l=>({ ...l, qty: -l.qty }));
  historyWhoOverride = (curUser()||{}).name || null;
  try{ if(back.length) applySaleConsumption(back, warehouseForLocation(order.locationId)); } finally { historyWhoOverride = null; }
  state.orders = state.orders.filter(o=>o.id!==order.id);
  state.sales = state.sales.filter(s=>s.glovoId!==order.glovoId);
  logEvent('glovo', 'Видалено продаж Glovo: '+fmtMoney(order.total));
}

  topBar.querySelector('#gvBack').onclick = ()=>{ view = owner ? 'settings' : homeView(); render(); };

      const p = gi.productId ? state.products.find(x=>x.id===gi.productId) : null;

      const card = el(`

            <div style="text-align:right"><div class="font-bold text-sm">${fmtMoney(gi.price)} → ${fmtMoney(net)}</div>
              <div class="sub text-xs">${p?'собівартість '+fmtMoney(cost)+' · профіт '+fmtMoney(net-cost):''}</div></div>
          </div>
        </div>
      `);
      card.onclick = ()=> openGlovoItemEdit(gi.id);
      wrap.appendChild(card);
    });
    return wrap;
  }

  // --- Продажі ---
  const addBtn = el(`<button class="btn-solid w-full py-3 mb-4">+ Додати продаж Glovo</button>`);
